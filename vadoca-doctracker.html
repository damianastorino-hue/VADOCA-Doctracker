<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VADOCA · DocTracker</title>
<style>
  :root{
    --tq:#00B4B6; --tq-dark:#008C8E; --tq-soft:#E0F5F5;
    --g1:#435561; --g2:#6D7985; --g3:#AEB8C0; --g4:#E7ECEF;
    --bg:#F6F8F9; --card:#FFFFFF;
    --ok:#2E9E5B; --warn:#D98E04; --bad:#C94F3D;
    --mono:'Courier New',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--g1);font-size:15px;line-height:1.45}
  h1,h2,h3{font-weight:600}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;background:var(--tq);color:#fff;font-weight:600;transition:background .15s}
  button:hover{background:var(--tq-dark)}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tq);outline-offset:2px}
  button.sec{background:var(--g4);color:var(--g1)}
  button.sec:hover{background:var(--g3)}
  button.ghost{background:transparent;color:var(--tq);padding:6px 10px}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font:inherit;border:1px solid var(--g3);border-radius:8px;padding:9px 11px;width:100%;background:#fff;color:var(--g1)}
  textarea{resize:vertical;min-height:80px}
  label{display:block;font-size:13px;font-weight:600;color:var(--g2);margin:12px 0 4px}
  a{color:var(--tq-dark)}

  header{background:var(--card);border-bottom:1px solid var(--g4);position:sticky;top:0;z-index:20}
  .hwrap{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-size:18px;font-weight:700;letter-spacing:.5px}
  .logo b{color:var(--tq)}
  nav{display:flex;gap:4px;margin-left:auto}
  nav button{background:transparent;color:var(--g2);font-weight:600;padding:8px 14px;border-radius:8px}
  nav button.active{background:var(--tq-soft);color:var(--tq-dark)}
  nav button:hover{background:var(--g4);color:var(--g1)}
  #userChip{font-size:12px;color:var(--g2)}

  main{max-width:1080px;margin:0 auto;padding:18px 16px 90px}
  .card{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:18px;margin-bottom:14px}
  .muted{color:var(--g2);font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:180px}

  /* Código = elemento distintivo */
  .codigo{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--tq-soft);color:var(--tq-dark);border-left:3px solid var(--tq);padding:3px 8px;border-radius:0 6px 6px 0;display:inline-block;letter-spacing:.3px}

  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:12px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .stat:hover{border-color:var(--tq)}
  .stat.activa{border-color:var(--tq);background:var(--tq-soft)}
  .stat .n{font-size:26px;font-weight:700;color:var(--tq-dark)}
  .stat .l{font-size:12px;color:var(--g2)}
  .stat.alerta .n{color:var(--bad)}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filtros select,.filtros input{flex:1;min-width:130px;width:auto}

  .exp{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .exp:hover{border-color:var(--tq)}
  .exp .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .exp .desc{font-weight:600;flex:1;min-width:180px}
  .exp .meta{font-size:12px;color:var(--g2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-ok{background:#E3F4EA;color:var(--ok)} .b-warn{background:#FBF0DA;color:var(--warn)}
  .b-bad{background:#F9E6E2;color:var(--bad)} .b-info{background:var(--tq-soft);color:var(--tq-dark)}
  .b-gris{background:var(--g4);color:var(--g2)}

  .docs-tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .docs-tabla th{text-align:left;color:var(--g2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--g4)}
  .docs-tabla td{padding:7px 8px;border-bottom:1px solid var(--g4);vertical-align:middle}
  .docs-tabla select{padding:5px 8px;font-size:13px;width:auto}

  .nota{border-left:3px solid var(--g4);padding:10px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 8px 8px 0}
  .nota.tipo-creacion{border-left-color:var(--tq)}
  .nota.tipo-estado{border-left-color:var(--warn)}
  .nota.tipo-version{border-left-color:var(--ok)}
  .nota .nts{font-size:11px;color:var(--g2);font-family:var(--mono)}
  .nota .ntx{margin:5px 0;white-space:pre-wrap}
  .nota .adj a{font-size:12px;margin-right:10px}

  .modal-bg{position:fixed;inset:0;background:rgba(30,40,46,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.modal-bg{align-items:center}}
  .modal{background:#fff;border-radius:16px 16px 0 0;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:20px}
  @media(min-width:640px){.modal{border-radius:16px}}

  #toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
  .toast{padding:11px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:pop .2s}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--bad)} .toast.info{background:var(--g1)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){.toast{animation:none}}

  #spinner{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
  .sp{width:38px;height:38px;border:4px solid var(--g4);border-top-color:var(--tq);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #spinnerTxt{font-weight:600;color:var(--g1)}
  .hidden{display:none!important}

  .setup-paso{display:flex;gap:12px;margin-bottom:14px}
  .setup-paso .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tq);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .archivo-chip{display:inline-flex;align-items:center;gap:6px;background:var(--g4);border-radius:8px;padding:4px 10px;font-size:12px;margin:4px 4px 0 0}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="logo">VADOCA <b>DocTracker</b></div>
    <nav id="mainNav" class="hidden">
      <button data-view="dashboard" class="active">Tablero</button>
      <button data-view="nuevo">+ Nuevo</button>
      <button data-view="config">Ajustes</button>
    </nav>
    <span id="userChip"></span>
  </div>
</header>

<main id="app"></main>

<div id="toasts"></div>
<div id="spinner" class="hidden"><div class="sp"></div><div id="spinnerTxt">Trabajando…</div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
/* ============================================================
   VADOCA DocTracker v1.0 — un solo archivo, sin backend.
   Google Drive (archivos) + Google Sheets (registro maestro).
   ============================================================ */

/* ---------- Configuración y catálogos ---------- */
const LSKEY = 'vadoca_doctracker_cfg_v1';
const DEFAULTS = {
  clientId: '',
  sheetId: '1e8d_Leo2RWYvGf6frTVUOdTX5t2fnAcCqx8_kzvZ-PU',
  rootFolderId: '',           // se crea sola la primera vez
  clientes: [ ['000','VADOCA'], ['001','Novocap SA'], ['002','LKM'], ['003','Passair / Conéctalis'] ],
  tiposTrabajo: [
    { key:'GR',  nombre:'Gestión de Riesgo',                    linea:'VDC' },
    { key:'VTA', nombre:'Validación de Técnicas Analíticas',    linea:'VDC' },
    { key:'VPC', nombre:'Validación de Planillas',              linea:'VPC' },
    { key:'CAL', nombre:'Calificaciones',                       linea:'VDC' },
    { key:'VSI', nombre:'Validación de Sistemas Informáticos',  linea:'VSI' },
  ],
  tiposDoc: ['GR','AR','VTA','RU','DQ','IQ','OQ','PQ','IOQ','IV','PMV','PV'],
  estados: ['Borrador','En revisión','Validable','No validable','En ejecución','Enviado a cliente','Aprobado','Entregado','Suspendido','Cancelado'],
  estadosFinales: ['Entregado','Suspendido','Cancelado'],
  paqueteVPC: [ ['RU','P'],['DQ','P'],['IQ','P'],['IQ','I'],['OQ','P'],['OQ','I'],['PQ','P'],['PQ','I'],['IV','I'] ],
  // Últimos números ya usados en el registro histórico (la app arranca desde acá)
  semillas: { 'VPC|002':32, 'GR|001':12, 'CAL|001':9, 'VTA|001':4 },
  diasEstancado: 7,
};
let CFG = loadCfg();
function loadCfg(){ try{ const s=JSON.parse(localStorage.getItem(LSKEY)||'{}'); const c=Object.assign({},DEFAULTS,s); c.paqueteVPC=DEFAULTS.paqueteVPC; return c;}catch(e){return {...DEFAULTS};} }
function saveCfg(){ localStorage.setItem(LSKEY, JSON.stringify(CFG)); }

/* Hoja REGISTRO: definición de columnas (A..W) */
const COLS = ['ID','Fecha_Alta','Cliente_Num','Cliente_Nombre','Tipo_Trabajo','Linea','Prot_Inf','Tipo_Doc','Doc_Num','Version','Descripcion','Codigo_Interno_Cliente','Ref_Presupuesto','Estado','Fecha_Inicio','Fecha_Fin','Carpeta_Drive_ID','Carpeta_Drive_URL','Ultimo_Movimiento','Conflicto_Legacy','Observaciones','Historial_File_ID','Expediente_ID'];
const CI = Object.fromEntries(COLS.map((c,i)=>[c,i])); // índice por nombre

/* ---------- Estado global ---------- */
let TOKEN = null, TOKEN_EXP = 0, tokenClient = null, USER_EMAIL = '';
let REG = [];        // filas del registro como objetos {..., _row}
let VIEW = 'dashboard';
let FICHA = null;    // expediente abierto

/* ---------- Utilidades ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n,l) => String(n).padStart(l,'0');
const hoy = () => new Date().toISOString().slice(0,10);
const ahora = () => new Date().toISOString();
function toast(msg,tipo='ok'){ const d=document.createElement('div'); d.className='toast '+tipo; d.textContent=msg; $('#toasts').appendChild(d); setTimeout(()=>d.remove(), tipo==='err'?6000:3500); }
function spin(on,txt){ $('#spinner').classList.toggle('hidden',!on); if(txt)$('#spinnerTxt').textContent=txt; }
function diasDesde(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function fFecha(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
function limpiarNombre(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\\/:*?"<>|#]/g,'-').trim().slice(0,60); }

/* ---------- Autenticación (Google Identity Services) ---------- */
const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email';

function initAuth(){
  if(!window.google?.accounts?.oauth2){ setTimeout(initAuth,300); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CFG.clientId, scope: SCOPES, prompt: '',
    callback: async (resp)=>{
      if(resp.error){ toast('Error de autenticación: '+resp.error,'err'); spin(false); return; }
      TOKEN = resp.access_token; TOKEN_EXP = Date.now() + (resp.expires_in-60)*1000;
      try{
        const u = await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{Authorization:'Bearer '+TOKEN}}).then(r=>r.json());
        USER_EMAIL = u.email||''; $('#userChip').textContent = USER_EMAIL;
      }catch(e){}
      $('#mainNav').classList.remove('hidden');
      await bootData();
    }
  });
  tokenClient.error_callback = (e)=>{ spin(false); render(); }; // popup bloqueado o cerrado: mostrar botón
  tokenClient.requestAccessToken({prompt:''}); // reutiliza el permiso ya dado; Google pide consentimiento solo la primera vez
}
function pedirToken(){ return new Promise(res=>{ const orig=tokenClient.callback;
  tokenClient.callback=(r)=>{ if(!r.error){TOKEN=r.access_token;TOKEN_EXP=Date.now()+(r.expires_in-60)*1000;} tokenClient.callback=orig; res(); };
  tokenClient.requestAccessToken({prompt:''}); }); }

/* fetch con token + reintento ante 401 */
async function api(url, opt={}, raw=false){
  if(Date.now()>TOKEN_EXP) await pedirToken();
  opt.headers = Object.assign({Authorization:'Bearer '+TOKEN}, opt.headers||{});
  let r = await fetch(url,opt);
  if(r.status===401){ await pedirToken(); opt.headers.Authorization='Bearer '+TOKEN; r=await fetch(url,opt); }
  if(r.status===429){ spin(true,'Google pide esperar (límite por minuto)… reintento en 25 s'); await new Promise(res=>setTimeout(res,25000)); r=await fetch(url,opt); }
  if(!r.ok){ const t=await r.text(); throw new Error('API '+r.status+': '+t.slice(0,300)); }
  return raw ? r : r.json();
}

/* ---------- Google Sheets: registro maestro ---------- */
async function ensureRegistro(){
  const meta = await api(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.sheetId}?fields=sheets.properties`);
  const existe = meta.sheets.some(s=>s.properties.title==='REGISTRO');
  if(!existe){
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.sheetId}:batchUpdate`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({requests:[{addSheet:{properties:{title:'REGISTRO'}}}]})
    });
    toast('Hoja REGISTRO creada en tu planilla');
  }
  // Escribir encabezados si la primera fila está vacía o incompleta (cubre hoja creada a mano)
  const h = await api(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.sheetId}/values/${encodeURIComponent("'REGISTRO'!A1:W1")}`);
  if(!h.values || !h.values[0] || h.values[0][0]!=='ID'){
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.sheetId}/values/${encodeURIComponent("'REGISTRO'!A1:W1")}?valueInputOption=RAW`,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({values:[COLS]})
    });
  }
}
async function leerRegistro(){
  const d = await api(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.sheetId}/values/${encodeURIComponent("'REGISTRO'!A2:W100000")}`);
  REG = (d.values||[]).map((v,i)=>{ const o={_row:i+2}; COLS.forEach((c,j)=>o[c]=v[j]??''); return o; });
}
async function appendFilas(filas){ // filas = array de objetos
  await ensureRegistro(); // por si la hoja no existe o fue borrada
  const values = filas.map(o=>COLS.map(c=>o[c]??''));
  await api(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.sheetId}/values/${encodeURIComponent("'REGISTRO'!A1")}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({values})
  });
}
async function updateCelda(row, colName, valor){
  await updateCeldas([{row, col:colName, valor}]);
}
/* Escribe muchas celdas en UNA sola llamada (evita el límite de 60 escrituras/min de Sheets) */
async function updateCeldas(cambios){
  const data = cambios.map(c=>({
    range: `'REGISTRO'!${String.fromCharCode(65+CI[c.col])}${c.row}`,
    values: [[c.valor]]
  }));
  await api(`https://sheets.googleapis.com/v4/spreadsheets/${CFG.sheetId}/values:batchUpdate`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({valueInputOption:'RAW', data})
  });
}

/* ---------- Google Drive ---------- */
async function buscarCarpeta(nombre, parentId){
  const q = encodeURIComponent(`name = '${nombre.replace(/'/g,"\\'")}' and mimeType = 'application/vnd.google-apps.folder' and '${parentId||'root'}' in parents and trashed = false`);
  const d = await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  return d.files?.[0]?.id || null;
}
async function crearCarpeta(nombre, parentId){
  const d = await api('https://www.googleapis.com/drive/v3/files?fields=id',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:nombre, mimeType:'application/vnd.google-apps.folder', parents: parentId?[parentId]:undefined})
  });
  return d.id;
}
async function ensureCarpeta(nombre, parentId){ return (await buscarCarpeta(nombre,parentId)) || (await crearCarpeta(nombre,parentId)); }

async function subirArchivo(file, parentId, nombre){
  const meta = {name: nombre||file.name, parents:[parentId]};
  const boundary='vadoca'+Date.now();
  const body = new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`,
    `--${boundary}\r\nContent-Type: ${file.type||'application/octet-stream'}\r\n\r\n`, file, `\r\n--${boundary}--`
  ]);
  const d = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',{
    method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body
  });
  return d;
}
async function crearJson(nombre, parentId, obj){
  const f = new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  f.name = nombre; // Blob no tiene name; lo pasamos aparte
  return await subirArchivo(new File([f],nombre,{type:'application/json'}), parentId, nombre);
}
async function leerJson(fileId){
  const r = await api(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {}, true);
  return r.json();
}
async function actualizarJson(fileId, obj){
  await api(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,{
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj,null,2)
  }, true);
}

/* ---------- Lógica de codificación ---------- */
function tt(key){ return CFG.tiposTrabajo.find(t=>t.key===key); }
function proximoDoc(ttKey, clienteNum){
  const semilla = CFG.semillas[`${ttKey}|${clienteNum}`] || 0;
  const usados = REG.filter(r=>r.Expediente_ID.startsWith(`${ttKey}-${clienteNum}-`)).map(r=>parseInt(r.Doc_Num,10)||0);
  return Math.max(semilla, ...usados, 0) + 1;
}
function armarID(linea,tipoDoc,pi,cliente,doc,ver){ return `${linea}-${tipoDoc}${pi?'-'+pi:''}-${cliente}-${pad(doc,3)}/${pad(ver,2)}`; }

/* ---------- Estructura de carpetas por expediente ---------- */
const SUBCARPETAS = ['00_cliente','01_versiones','02_evidencias','03_entregables'];
async function crearExpedienteDrive(clienteNum, clienteNombre, ttNombre, nombreExp){
  if(!CFG.rootFolderId){ CFG.rootFolderId = await ensureCarpeta('VADOCA_Gestion', null); saveCfg(); }
  const fCliente = await ensureCarpeta(`${clienteNum} - ${limpiarNombre(clienteNombre)}`, CFG.rootFolderId);
  const fTipo    = await ensureCarpeta(limpiarNombre(ttNombre), fCliente);
  const fExp     = await ensureCarpeta(limpiarNombre(nombreExp), fTipo);
  for(const s of SUBCARPETAS) await ensureCarpeta(s, fExp);
  return fExp;
}

/* ============================================================
   VISTAS
   ============================================================ */
function render(){
  const app = $('#app');
  if(!CFG.clientId){ app.innerHTML = vistaSetup(); return; }
  if(!TOKEN){ app.innerHTML = `<div class="card" style="text-align:center;padding:40px">
      <h2>Conectar con Google</h2>
      <p class="muted" style="margin:10px 0 18px">La app necesita permiso para escribir en tu Drive y en la planilla de códigos.</p>
      <button onclick="initAuth()">Iniciar sesión con Google</button>
      <p style="margin-top:14px"><button class="ghost" onclick="CFG.clientId='';saveCfg();render()">Cambiar configuración</button></p>
    </div>`; return; }
  if(VIEW==='dashboard') app.innerHTML = vistaDashboard();
  else if(VIEW==='nuevo') app.innerHTML = vistaNuevo();
  else if(VIEW==='config') app.innerHTML = vistaConfig();
  else if(VIEW==='ficha') app.innerHTML = vistaFicha();
  postRender();
}

/* ----- Setup inicial (primera vez) ----- */
function vistaSetup(){
  return `<div class="card">
    <h2>Puesta en marcha (una sola vez)</h2>
    <p class="muted" style="margin:8px 0 16px">La app corre 100% en tu navegador y guarda todo en tu Google Drive. Para eso Google exige crear una credencial propia. Son 10 minutos y es gratis:</p>
    <div class="setup-paso"><div class="num">1</div><div>Entrá a <a href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener">console.cloud.google.com</a> y creá un proyecto (nombre: <i>VADOCA DocTracker</i>).</div></div>
    <div class="setup-paso"><div class="num">2</div><div>En <b>APIs y servicios → Biblioteca</b>, habilitá <b>Google Drive API</b> y <b>Google Sheets API</b>.</div></div>
    <div class="setup-paso"><div class="num">3</div><div>En <b>Pantalla de consentimiento OAuth</b>: tipo <b>Externo</b>, completá nombre y tu email, y en <b>Usuarios de prueba</b> agregá tu propio Gmail.</div></div>

/* ----- Dashboard ----- */
let FILTRO = {cliente:'',tt:'',estado:'',txt:'',caja:''};
window.filtrarCaja = function(c){ FILTRO.caja = (FILTRO.caja===c ? '' : c); render(); };
function esActivo(e){ return e.docs.some(d=>!CFG.estadosFinales.includes(d.Estado)); }
function esEstancado(e){ return esActivo(e) && ((diasDesde(e.ult)??99) > CFG.diasEstancado); }
function esEntregado(e){ return e.docs.length && e.docs.every(d=>d.Estado==='Entregado'); }
function expedientes(){
  const map = new Map();
  for(const r of REG){
    if(!map.has(r.Expediente_ID)) map.set(r.Expediente_ID, {id:r.Expediente_ID, docs:[], desc:r.Descripcion, cliente:r.Cliente_Num, clienteN:r.Cliente_Nombre, tt:r.Tipo_Trabajo, carpeta:r.Carpeta_Drive_URL, hist:r.Historial_File_ID, ult:r.Ultimo_Movimiento, interno:r.Codigo_Interno_Cliente});
    const e = map.get(r.Expediente_ID); e.docs.push(r);
    if(r.Ultimo_Movimiento > e.ult) e.ult = r.Ultimo_Movimiento;
  }
  return [...map.values()].sort((a,b)=> (b.ult||'').localeCompare(a.ult||''));
}
function estadoExp(e){
  const activos = e.docs.filter(d=>!CFG.estadosFinales.includes(d.Estado));
  if(!activos.length) return {txt: e.docs.every(d=>d.Estado==='Entregado')?'Entregado':'Cerrado', cls:'b-gris'};
  const est = [...new Set(activos.map(d=>d.Estado))];
  return {txt: est.length===1?est[0]:'Mixto ('+activos.length+' activos)', cls:'b-info'};
}
function vistaDashboard(){
  const exps = expedientes().filter(e=>{
    if(FILTRO.cliente && e.cliente!==FILTRO.cliente) return false;
    if(FILTRO.tt && !e.id.startsWith(FILTRO.tt+'-')) return false;
    if(FILTRO.estado && !e.docs.some(d=>d.Estado===FILTRO.estado)) return false;
    if(FILTRO.txt){ const t=FILTRO.txt.toLowerCase(); if(!(e.id+e.desc+e.interno).toLowerCase().includes(t)) return false; }
    if(FILTRO.caja==='activos' && !esActivo(e)) return false;
    if(FILTRO.caja==='estancados' && !esEstancado(e)) return false;
    if(FILTRO.caja==='entregados' && !esEntregado(e)) return false;
    return true;
  });
  const all = expedientes();
  const activos = all.filter(esActivo);
  const estancados = all.filter(esEstancado);
  const entregados = all.filter(esEntregado);
  return `
    <div class="stats">
      <div class="stat ${FILTRO.caja===''?'activa':''}" onclick="filtrarCaja('')" title="Ver todos"><div class="n">${all.length}</div><div class="l">Expedientes</div></div>
      <div class="stat ${FILTRO.caja==='activos'?'activa':''}" onclick="filtrarCaja('activos')"><div class="n">${activos.length}</div><div class="l">Activos</div></div>
      <div class="stat alerta ${FILTRO.caja==='estancados'?'activa':''}" onclick="filtrarCaja('estancados')"><div class="n">${estancados.length}</div><div class="l">Estancados +${CFG.diasEstancado}d</div></div>
      <div class="stat ${FILTRO.caja==='entregados'?'activa':''}" onclick="filtrarCaja('entregados')"><div class="n">${entregados.length}</div><div class="l">Entregados</div></div>
    </div>
    <div class="filtros">
      <select onchange="FILTRO.cliente=this.value;render()">
        <option value="">Todos los clientes</option>
        ${CFG.clientes.map(c=>`<option value="${c[0]}" ${FILTRO.cliente===c[0]?'selected':''}>${c[0]} · ${esc(c[1])}</option>`).join('')}
      </select>
      <select onchange="FILTRO.tt=this.value;render()">
        <option value="">Todos los tipos</option>
        ${CFG.tiposTrabajo.map(t=>`<option value="${t.key}" ${FILTRO.tt===t.key?'selected':''}>${esc(t.nombre)}</option>`).join('')}
      </select>
      <select onchange="FILTRO.estado=this.value;render()">
        <option value="">Todos los estados</option>
        ${CFG.estados.map(s=>`<option ${FILTRO.estado===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <input placeholder="Buscar…" value="${esc(FILTRO.txt)}" oninput="FILTRO.txt=this.value" onchange="render()">
    </div>
    ${exps.length? exps.map(e=>{
      const st = estadoExp(e), d = diasDesde(e.ult);
      const estancado = d!==null && d>CFG.diasEstancado && st.cls==='b-info';
      return `<div class="exp" onclick="abrirFicha('${esc(e.id)}')">
        <div class="top">
          <span class="codigo">${esc(e.id)}</span>
          <span class="desc">${esc(e.desc)}</span>
          <span class="badge ${st.cls}">${esc(st.txt)}</span>
          ${estancado?`<span class="badge b-bad">⚠ ${d} días sin movimiento</span>`:''}
        </div>
        <div class="meta">
          <span>${esc(e.clienteN)}</span><span>${esc(e.tt)}</span>
          ${e.interno?`<span>Cód. cliente: ${esc(e.interno)}</span>`:''}
          <span>${e.docs.length} doc${e.docs.length>1?'s':''}</span>
          <span>Últ. mov.: ${fFecha(e.ult)}</span>
        </div>
      </div>`;
    }).join('') : `<div class="card" style="text-align:center;color:var(--g2)">No hay expedientes${REG.length?' con esos filtros':''}. Creá el primero desde <b>+ Nuevo</b>.</div>`}`;
}

window.confirmarNuevo = function(){
  const ttKey = $('#nTT').value, cliente = $('#nCliente').value;

    docs = $$('.pqDoc:checked').map(el=>el.value.split('|'));
    if(!docs.length){ toast('Elegí al menos un documento','err'); return; }
  } else docs = [[ $('#nTipoDoc').value, $('#nPI').value ]];
  // Un documento marcado P+I se desdobla en dos: protocolo e informe con seguimiento independiente
  docs = docs.flatMap(([td,pi])=> pi==='PI' ? [[td,'P'],[td,'I']] : [[td,pi]]);

window.crearExpediente = async function(p){
  cerrarModal(); spin(true,'Verificando numeración…');
  try{
    await leerRegistro(); // relectura anti-carrera
    const docReal = proximoDoc(p.ttKey, p.cliente);
    if(docReal !== p.doc){ p.doc = docReal; toast('El número cambió a '+pad(docReal,3)+' (se actualizó el registro)','info'); }
    const t = tt(p.ttKey);
    const clienteN = (CFG.clientes.find(c=>c[0]===p.cliente)||[])[1]||'';
    const expId = `${p.ttKey}-${p.cliente}-${pad(p.doc,3)}`;
    spin(true,'Creando carpetas en Drive…');
    const fExp = await crearExpedienteDrive(p.cliente, clienteN, t.nombre, `${expId} - ${p.desc}`);
    spin(true,'Creando historial…');
    const hist = { expediente: expId, creado: ahora(), entradas: [{
      ts: ahora(), autor: USER_EMAIL, tipo:'creacion',
      texto:`Expediente creado. Documentos: ${p.docs.map(d=>d[0]+'-'+d[1]).join(', ')}. Descripción: ${p.desc}`, adjuntos:[] }] };
    const hFile = await crearJson('historial.json', fExp, hist);
    spin(true,'Registrando en la planilla…');
    const url = `https://drive.google.com/drive/folders/${fExp}`;
    const filas = p.docs.map(([td,pi])=>({
      ID: armarID(t.linea,td,pi,p.cliente,p.doc,1), Fecha_Alta: hoy(),
      Cliente_Num:p.cliente, Cliente_Nombre:clienteN, Tipo_Trabajo:t.nombre, Linea:t.linea,
      Prot_Inf:pi, Tipo_Doc:td, Doc_Num:pad(p.doc,3), Version:'01',
      Descripcion:p.desc, Codigo_Interno_Cliente: $('#nInterno')?.value.trim()||'',
      Ref_Presupuesto: $('#nPresu')?.value.trim()||'', Estado:'Borrador',
      Fecha_Inicio: hoy(), Carpeta_Drive_ID:fExp, Carpeta_Drive_URL:url,
      Ultimo_Movimiento: ahora(), Historial_File_ID: hFile.id, Expediente_ID: expId
    }));
    await appendFilas(filas);
    await leerRegistro();
    spin(false); toast('Expediente '+expId+' creado');
    abrirFicha(expId);
  }catch(e){ spin(false); toast('Error: '+e.message,'err'); console.error(e); }
};

async function cargarHistorial(){
  const docs = REG.filter(r=>r.Expediente_ID===FICHA.id);
  const hId = docs[0]?.Historial_File_ID;
  if(!hId){ $('#bitacora').innerHTML='<p class="muted">Expediente importado del histórico: al guardar la primera nota se crean automáticamente su carpeta en Drive y su historial.</p>'; return; }

  catch(e){ $('#bitacora').innerHTML='<p class="muted">No se pudo leer el historial: '+esc(e.message)+'</p>'; }
}
function pintarBitacora(){

let PEGADOS = [];
window.cambiarEstado = async function(row, estado, id){
  spin(true,'Actualizando estado…');
  try{
    await asegurarInfraExpediente();
    const cambios = [{row,col:'Estado',valor:estado},{row,col:'Ultimo_Movimiento',valor:ahora()}];
    if(estado==='Entregado') cambios.push({row,col:'Fecha_Fin',valor:hoy()});
    await updateCeldas(cambios);
    await registrarEntrada({tipo:'estado', texto:`${id} → estado: ${estado}`, adjuntos:[]});
    await leerRegistro(); spin(false); toast('Estado actualizado'); pintarBitacora();
  }catch(e){ spin(false); toast('Error: '+e.message,'err'); }
};
window.estadoTodos = async function(){
  const estado = $('#estadoMasivo').value;
  spin(true,'Actualizando estados…');
  try{
    await asegurarInfraExpediente();
    const docs = REG.filter(r=>r.Expediente_ID===FICHA.id);
    const cambios = [];
    for(const d of docs){
      cambios.push({row:d._row,col:'Estado',valor:estado});
      cambios.push({row:d._row,col:'Ultimo_Movimiento',valor:ahora()});
      if(estado==='Entregado') cambios.push({row:d._row,col:'Fecha_Fin',valor:hoy()});
    }
    await updateCeldas(cambios);
    await registrarEntrada({tipo:'estado', texto:`Todos los documentos → estado: ${estado}`, adjuntos:[]});
    await leerRegistro(); spin(false); toast('Estados actualizados'); render(); await cargarHistorial();
  }catch(e){ spin(false); toast('Error: '+e.message,'err'); }
};
async function registrarEntrada(entrada){
  if(!FICHA.histId) throw new Error('El expediente no tiene historial todavía');
  const h = await leerJson(FICHA.histId);              // leer antes de escribir, siempre
  h.entradas.push(Object.assign({ts:ahora(), autor:USER_EMAIL}, entrada));
  await actualizarJson(FICHA.histId, h);
  FICHA.hist = h;
}
window.guardarNota = async function(){
  const txt = $('#notaTxt').value.trim();
  const files = [...($('#notaFiles').files||[]), ...PEGADOS];
  if(!txt && !files.length){ toast('Escribí algo o adjuntá un archivo','err'); return; }
  const sub = $('#notaSub').value;
  spin(true,'Guardando nota…');
  try{
    const {fExp, docs} = await asegurarInfraExpediente(); // crea carpeta+historial si es un expediente importado
    spin(true,'Guardando nota…');
    const adjuntos = [];
    if(files.length){
      const subId = await ensureCarpeta(sub, fExp);
      for(const f of files){
        spin(true,'Subiendo '+f.name+'…');
        const nombre = `${hoy()}_${f.name}`;
        const up = await subirArchivo(f, subId, nombre);
        adjuntos.push({nombre, drive_id:up.id, subcarpeta:sub});
      }
    }
    const tipo = sub==='01_versiones'?'version': sub==='03_entregables'?'archivo': files.length?'archivo':'nota';
    await registrarEntrada({tipo, texto: txt || ('Se subieron '+adjuntos.length+' archivo(s) a '+sub), adjuntos});
    await updateCeldas(docs.map(d=>({row:d._row,col:'Ultimo_Movimiento',valor:ahora()})));
    await leerRegistro();
    $('#notaTxt').value=''; $('#notaFiles').value=''; PEGADOS=[]; $('#pegados').innerHTML='';
    spin(false); toast('Nota guardada'); pintarBitacora();
    if(sub==='03_entregables' && adjuntos.length){
      modal(`<h3>Entregable cargado</h3><p style="margin:10px 0">¿Marcar todos los documentos como <b>Entregado</b>?</p>
        <p style="display:flex;gap:10px"><button onclick="cerrarModal();$('#estadoMasivo').value='Entregado';estadoTodos()">Sí, marcar Entregado</button>
        <button class="sec" onclick="cerrarModal()">Ahora no</button></p>`);
    }

/* filas: [ttKey, pi, tipoDoc, cliente, doc, ver, desc, interno, presup, fIni, fFin, estado, conflicto, obs] */

window.importarHistorico = async function(){
  const yaHay = REG.filter(r=>r.Observaciones && r.Observaciones.includes('[importado]')).length;
  if(yaHay){ toast('El histórico ya fue importado ('+yaHay+' filas). No se duplica.','err'); return; }
  if(!confirm('Se van a agregar '+DATA_HISTORICO.length+' documentos históricos a la hoja REGISTRO. ¿Continuar?')) return;
  spin(true,'Importando histórico…');
  try{
    const filas = DATA_HISTORICO.map(a=>{
      const [ttKey,pi,td,cli,doc,ver,desc,interno,presup,fIni,fFin,estado,conf,obs] = a;
      const t = tt(ttKey);
      return {
        ID: armarID(t.linea,td,pi,cli,doc,ver), Fecha_Alta: fIni||'2026-07-29',
        Cliente_Num:cli, Cliente_Nombre:(CFG.clientes.find(c=>c[0]===cli)||[])[1]||'',
        Tipo_Trabajo:t.nombre, Linea:t.linea, Prot_Inf:pi, Tipo_Doc:td,
        Doc_Num:pad(doc,3), Version:pad(ver,2), Descripcion:desc,
        Codigo_Interno_Cliente:interno, Ref_Presupuesto:presup, Estado:estado,
        Fecha_Inicio:fIni, Fecha_Fin:fFin, Carpeta_Drive_ID:'', Carpeta_Drive_URL:'',
        Ultimo_Movimiento:'', Conflicto_Legacy: conf?'TRUE':'',
        Observaciones: ((obs?obs+' ':'')+'[importado]').trim(),
        Historial_File_ID:'', Expediente_ID: ttKey+'-'+cli+'-'+pad(doc,3)
      };
    });
    // Sheets acepta lotes grandes, pero partimos en tandas de 100 por prolijidad
    for(let i=0;i<filas.length;i+=100){
      spin(true,'Importando '+Math.min(i+100,filas.length)+' / '+filas.length+'…');
      await appendFilas(filas.slice(i,i+100));
    }
    await leerRegistro();
    spin(false); toast('Histórico importado: '+filas.length+' documentos'); VIEW='dashboard'; render();
  }catch(e){ spin(false); toast('Error importando: '+e.message,'err'); console.error(e); }
};

    <textarea id="cSemillas">${esc(Object.entries(CFG.semillas).map(([k,v])=>k+'|'+v).join('\n'))}</textarea>
    <p class="muted">La numeración nueva arranca en semilla+1. Solo hace falta cargarla una vez por combinación.</p>
    <label>Días para marcar "estancado"</label><input id="cDias" type="number" value="${CFG.diasEstancado}" style="width:100px">
    <p style="margin-top:16px;display:flex;gap:10px">
      <button onclick="guardarConfig()">Guardar ajustes</button>
      <button class="sec" onclick="location.reload()">Recargar app</button>
      <button class="sec" onclick="importarHistorico()">Importar histórico (una vez)</button>
    </p>
  </div>`;
}
window.guardarConfig = function(){
  try{
    CFG.clientId = $('#cClientId').value.trim();
    CFG.sheetId = $('#cSheetId').value.trim();
    CFG.clientes = $('#cClientes').value.trim().split('\n').filter(Boolean).map(l=>l.split('|').map(s=>s.trim()));
    CFG.semillas = Object.fromEntries($('#cSemillas').value.trim().split('\n').filter(Boolean).map(l=>{const p=l.split('|');return [p[0]+'|'+p[1], parseInt(p[2],10)||0];}));
    CFG.diasEstancado = parseInt($('#cDias').value,10)||7;
    saveCfg(); toast('Ajustes guardados'); VIEW='dashboard'; render();
  }catch(e){ toast('Error en el formato: '+e.message,'err'); }
};


/* Asegura que el expediente tenga carpeta en Drive e historial; los crea si faltan (expedientes importados) */
async function asegurarInfraExpediente(){
  const docs = REG.filter(r=>r.Expediente_ID===FICHA.id);
  if(!docs.length) throw new Error('Expediente no encontrado');
  const e = docs[0];
  if(e.Carpeta_Drive_ID && e.Historial_File_ID){ FICHA.histId = e.Historial_File_ID; return {fExp:e.Carpeta_Drive_ID, docs}; }
  spin(true,'Creando carpeta e historial del expediente…');
  const fExp = e.Carpeta_Drive_ID || await crearExpedienteDrive(e.Cliente_Num, e.Cliente_Nombre, e.Tipo_Trabajo, FICHA.id+' - '+e.Descripcion);
  const hist = { expediente: FICHA.id, creado: ahora(), entradas: [{ ts: ahora(), autor: USER_EMAIL, tipo:'creacion', texto:'Carpeta e historial creados para expediente importado del registro histórico.', adjuntos:[] }] };
  const hFile = await crearJson('historial.json', fExp, hist);
  const url = 'https://drive.google.com/drive/folders/'+fExp;
  const cambios = [];
  for(const d of docs){
    cambios.push({row:d._row,col:'Carpeta_Drive_ID',valor:fExp});
    cambios.push({row:d._row,col:'Carpeta_Drive_URL',valor:url});
    cambios.push({row:d._row,col:'Historial_File_ID',valor:hFile.id});
  }
  await updateCeldas(cambios);
  FICHA.histId = hFile.id; FICHA.hist = hist;
  await leerRegistro();
  return {fExp, docs: REG.filter(r=>r.Expediente_ID===FICHA.id)};
}
window.crearCarpetaLegacy = async function(){
  try{
    await asegurarInfraExpediente();
    spin(false); toast('Carpeta creada'); render(); await cargarHistorial();
  }catch(err){ spin(false); toast('Error: '+err.message,'err'); }
};

/* ----- Modal / utilidades UI ----- */
function modal(html){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) cerrarModal(); });
  document.body.appendChild(bg); }
window.cerrarModal = ()=> $('#modalBg')?.remove();

function postRender(){
  $$('#mainNav button').forEach(b=>b.classList.toggle('active', b.dataset.view===VIEW || (VIEW==='ficha'&&b.dataset.view==='dashboard')));
  if(VIEW==='nuevo') onTTChange();
  if(VIEW==='ficha'){
    document.addEventListener('paste', onPaste);
  } else document.removeEventListener('paste', onPaste);
}
function onPaste(ev){
  const items = [...(ev.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));
  if(!items.length) return;
  for(const it of items){
    const f = it.getAsFile();
    const nombre = 'captura_'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';
    PEGADOS.push(new File([f], nombre, {type:f.type}));
  }
  $('#pegados').innerHTML = PEGADOS.map(f=>`<span class="archivo-chip">🖼 ${esc(f.name)}</span>`).join('');
  toast(items.length+' captura(s) lista(s) para adjuntar','info');
}

/* ----- Navegación ----- */
$$('#mainNav button').forEach(b=>b.addEventListener('click',()=>{ VIEW=b.dataset.view; render(); }));

/* ----- Arranque ----- */
async function bootData(){
  spin(true,'Leyendo registro maestro…');
  try{
    await ensureRegistro();
    await leerRegistro();
    spin(false); VIEW='dashboard'; render();
    toast('Conectado. '+REG.length+' documento(s) en el registro.','info');
  }catch(e){ spin(false); toast('No pude leer la planilla: '+e.message,'err'); console.error(e); }
}
render();
/* Conexión automática al abrir: si ya diste permiso antes, entra sin que toques nada.
   Si el navegador bloquea el popup, queda el botón "Iniciar sesión" como respaldo. */
if(CFG.clientId){ window.addEventListener('load', ()=>setTimeout(()=>{ try{ initAuth(); }catch(e){ render(); } }, 500)); }
</script>
