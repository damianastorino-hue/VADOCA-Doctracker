<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VADOCA · Suite</title>
<style>
  :root{
    --tq:#00B4B6; --tq-dark:#008C8E; --tq-soft:#E0F5F5;
    --g1:#435561; --g2:#6D7985; --g3:#AEB8C0; --g4:#E7ECEF;
    --bg:#F6F8F9; --card:#FFFFFF;
    --ok:#2E9E5B; --warn:#D98E04; --bad:#C94F3D;
    --mono:'Courier New',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--g1);font-size:15px;line-height:1.45}
  h1,h2,h3{font-weight:600}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;background:var(--tq);color:#fff;font-weight:600;transition:background .15s}
  button:hover{background:var(--tq-dark)}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tq);outline-offset:2px}
  button.sec{background:var(--g4);color:var(--g1)} button.sec:hover{background:var(--g3)}
  button.ghost{background:transparent;color:var(--tq);padding:6px 10px}
  button.rojo{background:var(--bad)}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font:inherit;border:1px solid var(--g3);border-radius:8px;padding:9px 11px;width:100%;background:#fff;color:var(--g1)}
  textarea{resize:vertical;min-height:80px}
  label{display:block;font-size:13px;font-weight:600;color:var(--g2);margin:12px 0 4px}
  a{color:var(--tq-dark)}
  header{background:var(--card);border-bottom:1px solid var(--g4);position:sticky;top:0;z-index:20}
  .hwrap{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-size:18px;font-weight:700;letter-spacing:.5px}
  .logo b{color:var(--tq)}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{background:transparent;color:var(--g2);font-weight:600;padding:8px 14px;border-radius:8px}
  nav button.active{background:var(--tq-soft);color:var(--tq-dark)}
  nav button:hover{background:var(--g4);color:var(--g1)}
  #userChip{font-size:12px;color:var(--g2)}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 90px}
  .card{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:18px;margin-bottom:14px}
  .muted{color:var(--g2);font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:180px}
  .codigo{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--tq-soft);color:var(--tq-dark);border-left:3px solid var(--tq);padding:3px 8px;border-radius:0 6px 6px 0;display:inline-block;letter-spacing:.3px}
  .hashchip{font-family:var(--mono);font-size:10px;color:var(--g3)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:12px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .stat:hover{border-color:var(--tq)}
  .stat.activa{border-color:var(--tq);background:var(--tq-soft)}
  .stat .n{font-size:26px;font-weight:700;color:var(--tq-dark)}
  .stat .l{font-size:12px;color:var(--g2)}
  .stat.alerta .n{color:var(--bad)}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filtros select,.filtros input{flex:1;min-width:130px;width:auto}
  .exp{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .exp:hover{border-color:var(--tq)}
  .exp .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .exp .desc{font-weight:600;flex:1;min-width:180px}
  .exp .meta{font-size:12px;color:var(--g2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-bad{background:#F9E6E2;color:var(--bad)} .b-info{background:var(--tq-soft);color:var(--tq-dark)}
  .b-gris{background:var(--g4);color:var(--g2)} .b-ok{background:#E3F4EA;color:var(--ok)}
  .docs-tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .docs-tabla th{text-align:left;color:var(--g2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--g4)}
  .docs-tabla td{padding:7px 8px;border-bottom:1px solid var(--g4);vertical-align:middle}
  .docs-tabla select{padding:5px 8px;font-size:13px;width:auto}
  .nota{border-left:3px solid var(--g4);padding:10px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 8px 8px 0}
  .nota.tipo-creacion{border-left-color:var(--tq)}
  .nota.tipo-estado{border-left-color:var(--warn)}
  .nota.tipo-version{border-left-color:var(--ok)}
  .nota.tipo-correccion{border-left-color:var(--bad)}
  .nota .nts{font-size:11px;color:var(--g2);font-family:var(--mono)}
  .nota .ntx{margin:5px 0;white-space:pre-wrap}
  .nota .adj a{font-size:12px;margin-right:10px}
  .adj-anulado{font-size:12px;margin-right:10px;color:#C0392B;background:#FBE9E7;border-radius:6px;padding:2px 8px;display:inline-block}
  .anular-btn{border:none;background:transparent;cursor:pointer;font-size:11px;opacity:.45;margin-right:8px}
  .anular-btn:hover{opacity:1}
  .nota.tipo-anulacion{border-left:3px solid #C0392B}
  .modal-bg{position:fixed;inset:0;background:rgba(30,40,46,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.modal-bg{align-items:center}}
  .modal{background:#fff;border-radius:16px 16px 0 0;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:20px}
  @media(min-width:640px){.modal{border-radius:16px}}
  #toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
  .toast{padding:11px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--bad)} .toast.info{background:var(--g1)}
  #spinner{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
  .sp{width:38px;height:38px;border:4px solid var(--g4);border-top-color:var(--tq);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #spinnerTxt{font-weight:600;color:var(--g1)}
  .hidden{display:none!important}
  .login-wrap{max-width:400px;margin:8vh auto}
  .rolchip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--g4);color:var(--g2);text-transform:uppercase}
  .u-tabla{width:100%;border-collapse:collapse;font-size:13px}
  .u-tabla th{text-align:left;color:var(--g2);font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--g4)}
  .u-tabla td{padding:8px;border-bottom:1px solid var(--g4)}

  /* ---------- Conmutador de módulos (suite) ---------- */
  .modswitch{display:flex;gap:2px;background:var(--g4);border-radius:10px;padding:3px}
  .modswitch button{background:transparent;color:var(--g2);font-weight:700;font-size:13px;padding:7px 14px;border-radius:8px}
  .modswitch button:hover{background:#fff;color:var(--g1)}
  .modswitch button.active{background:var(--tq);color:#fff}
  .subnav{padding-top:0}
  .subnav nav{margin-left:0}
  :root{
    --navy:#0D1C2E; --navy2:#16283E; --turq:#00B4B6; --turq-dim:#007e80;
    --gris:#6D7985; --gris-osc:#435561; --fondo:#F2F5F7; --peligro:#C0392B; --borde:#DDE4E9;
  }
/* ---------- Estilos FlowTracker (scope .ftui) ---------- */
.ftui select,.ftui input{width:auto}
.ftui textarea{width:100%}
#modal select,#modal input,#modal textarea{width:100%}
.ftui h2, .ftui h3, .ftui .brand{font-family:'Sora',sans-serif}
.ftui select, .ftui input, .ftui textarea{font-family:inherit;font-size:13px;border:1px solid var(--borde);border-radius:8px;padding:7px 9px;background:#fff;color:var(--navy)}
.ftui select:focus, .ftui input:focus, .ftui textarea:focus{outline:2px solid var(--turq);outline-offset:0;border-color:var(--turq)}
.ftui .card{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:14px}
.ftui .muted{color:var(--gris);font-size:12px}
.ftui .fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ftui .btn{background:var(--turq);color:#fff;font-weight:600;padding:8px 14px}
.ftui .btn.sec{background:#EAF0F3;color:var(--gris-osc)}
.ftui .btn.mini{padding:4px 9px;font-size:12px}
.ftui .btn.rojo{background:transparent;color:var(--peligro);border:1px solid #E7C4C0}
.ftui .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.ftui .c-mia{background:#FFF3E4;color:#9A5B12}
.ftui .c-cliente{background:#E3F2FD;color:#1663A8}
.ftui .c-cerrado{background:#E7F5EC;color:#1F7A44}
.ftui .punto{width:7px;height:7px;border-radius:50%;background:currentColor}
.ftui .hoy-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ftui .col-titulo{font-family:'Sora';font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.ftui .col-titulo.mia{color:#9A5B12}
.ftui .col-titulo.cli{color:#1663A8}
.ftui .pcard{cursor:pointer;transition:border-color .15s;border-left:4px solid var(--turq)}
.ftui .pcard.personal{border-left-color:#8E6CC8}
.ftui .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;vertical-align:middle}
.ftui .tag.dt{background:#E6F7F7;color:var(--turq-dim)}
.ftui .tag.pro{background:#E6F7F7;color:var(--turq-dim)}
.ftui .tag.per{background:#F0EAFB;color:#6B4FA3}
.ftui .filtros{display:flex;gap:6px;margin-bottom:14px}
.ftui .filtros button{background:#fff;border:1px solid var(--borde);color:var(--gris-osc);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600}
.ftui .filtros button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ftui .pcard:hover{border-color:var(--turq)}
.ftui .pcard h3{font-size:15px;margin-bottom:2px}
.ftui .pcard .prox{margin-top:8px;padding:8px 10px;background:var(--fondo);border-radius:8px;font-size:13px}
.ftui .pcard .prox b{color:var(--turq-dim)}
.ftui .barra{height:5px;background:#E8EDF1;border-radius:3px;margin-top:10px;overflow:hidden}
.ftui .barra i{display:block;height:100%;background:var(--turq)}
.ftui .venc{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--fondo);font-size:13px}
.ftui .venc.tarde{color:var(--peligro);font-weight:600}
.ftui .item-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--fondo)}
.ftui .item-row:last-child{border-bottom:none}
.ftui .item-row .nom{font-size:13.5px}
.ftui .item-row .nom .doc{color:var(--turq-dim);font-size:11px;display:block}
.ftui .item-row .ops{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ftui .item-row select{padding:5px 7px;font-size:12px}
.ftui .item-row input[type=date]{padding:4px 6px;font-size:12px}
.ftui .tilde{width:18px;height:18px;border-radius:50%;border:2px solid var(--borde);display:inline-block}
.ftui .tilde.done{background:var(--turq);border-color:var(--turq);position:relative}
.ftui .tilde.done::after{content:'✓';color:#fff;font-size:11px;position:absolute;left:3px;top:0}
.ftui .bita{margin-top:14px;border-top:2px solid var(--fondo);padding-top:10px;max-height:260px;overflow:auto}
.ftui .bita .e{padding:6px 4px;border-bottom:1px solid var(--fondo);font-size:12.5px}
.ftui .bita .e .muted{font-size:11px}
.ftui .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.ftui .cal .dia{background:#fff;border:1px solid var(--borde);border-radius:8px;min-height:78px;padding:5px;font-size:11px}
.ftui .cal .dia.hoy-dia{border-color:var(--turq);border-width:2px}
.ftui .cal .dia .n{color:var(--gris);font-weight:600}
.ftui .cal .dia .it{background:#E6F7F7;color:var(--turq-dim);border-radius:5px;padding:2px 4px;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.ftui .cal .dia .it.tarde{background:#FBE9E7;color:var(--peligro)}
.ftui .cal-cab{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;text-align:center;font-size:11px;color:var(--gris);font-weight:600}
#modal{display:none;position:fixed;inset:0;background:rgba(13,28,46,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
#modal .caja{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
#modal h3{margin-bottom:14px}
#modal label{display:block;font-size:12px;color:var(--gris-osc);font-weight:600;margin:10px 0 4px}
#modal select, #modal input, #modal textarea{width:100%}
#modal .acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.ftui .tarea-vacia{text-align:center;color:var(--gris);padding:30px 10px;font-size:13px}
.ftui details.exp{border:1px solid var(--borde);border-radius:10px;margin-bottom:8px;background:#FAFCFD}
.ftui details.exp summary{cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none;font-size:13px}
.ftui details.exp summary::-webkit-details-marker{display:none}
.ftui details.exp summary .cod{font-weight:600;color:var(--turq-dim)}
.ftui details.exp[open] summary{border-bottom:1px solid var(--borde)}
.ftui .doc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--fondo);font-size:12.5px;flex-wrap:wrap}
.ftui .doc-row:last-child{border-bottom:none}
.ftui .doc-row select{padding:4px 6px;font-size:12px}
.ftui .seccion{font-family:'Sora';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gris-osc);margin:16px 0 8px}
.ftui .mapa-wrap{overflow-x:auto;margin-top:8px}
.ftui .mapa{border-collapse:collapse;font-size:11px}
.ftui .mapa th{padding:4px 6px;color:var(--gris-osc);font-weight:600;text-align:center;white-space:nowrap}
.ftui .mapa td{padding:3px}
.ftui .mapa td.exp-nom{white-space:nowrap;color:var(--gris-osc);font-weight:600;padding-right:10px;position:sticky;left:0;background:var(--card)}
.ftui .celda{width:22px;height:22px;border-radius:5px;margin:0 auto;cursor:default}
.ftui .celda.vacia{background:var(--fondo);display:flex;align-items:center;justify-content:center;color:#C3CDD5;font-size:12px;font-weight:700}
.ftui .leyenda{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--gris-osc);align-items:center}
.ftui .leyenda .celda{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:4px}
.ftui .modo-btns{display:flex;gap:4px}
.ftui .modo-btns button{background:#EAF0F3;color:var(--gris-osc);padding:5px 11px;font-size:12px;font-weight:600}
.ftui .modo-btns button.on{background:var(--navy);color:#fff}
.ftui .arbol{margin-top:10px}
.ftui .arbol .raiz{display:inline-block;background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-family:'Sora';font-weight:700;font-size:13px}
.ftui .arbol .ramas{margin-left:14px;border-left:3px solid #E6B93C;padding-left:0}
.ftui .arbol .exp-nodo{position:relative;margin:10px 0 10px 22px}
.ftui .arbol .exp-nodo::before{content:'';position:absolute;left:-25px;top:18px;width:22px;height:3px;background:#E6B93C}
.ftui .arbol .exp-caja{display:inline-flex;align-items:center;gap:10px;background:#FFF6DE;border:2px solid #E6B93C;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12.5px;color:#8A6D1D;max-width:100%}
.ftui .arbol .exp-caja b{white-space:nowrap}
.ftui .arbol .exp-caja .desc{color:#A98E3B;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:260px}
.ftui .arbol .exp-caja .caret{font-size:10px}
.ftui .arbol .resumen{display:inline-flex;gap:8px;font-size:11px;font-weight:700}
.ftui .arbol .resumen span{display:inline-flex;align-items:center;gap:3px;color:#fff;border-radius:10px;padding:1px 7px}
.ftui .arbol .hojas{margin-left:16px;border-left:2px solid var(--borde);padding:4px 0 2px}
.ftui .arbol .hoja{position:relative;margin:7px 0 7px 20px}
.ftui .arbol .hoja::before{content:'';position:absolute;left:-22px;top:12px;width:18px;height:2px;background:var(--h-color,#DDE4E9)}
.ftui .arbol .hoja-chip{display:inline-block;color:#fff;border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:600}
@media(max-width:760px){
.ftui .hoy-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">VADOCA<b>.</b> <span class="muted" style="font-size:11px">suite</span></div>
    <div id="modSwitch" class="modswitch hidden">
      <button data-mod="dt" class="active">DocTracker</button>
      <button data-mod="ft">FlowTracker</button>
      <button data-mod="com" id="modCom">Comercial</button>
    </div>
    <span id="userChip" style="margin-left:auto"></span>
  </div>
  <div class="hwrap subnav">
    <nav id="mainNav" class="hidden">
      <button data-view="dashboard" class="active">Tablero</button>
      <button data-view="nuevo" id="navNuevo">+ Nuevo</button>
      <button data-view="poes">Procedimientos</button>
      <button data-view="proyectos">Proyectos</button>
      <button data-view="indicadores">Indicadores</button>
      <button data-view="auditoria" id="navAudit" class="hidden">Auditoría</button>
      <button data-view="usuarios" id="navUsuarios" class="hidden">Usuarios</button>
      <button data-view="config">Ajustes</button>
    </nav>
    <nav id="ftNav" class="hidden">
      <button id="nHoy" class="active" onclick="ftIr('hoy')">Hoy</button>
      <button id="nProy" onclick="ftIr('proyectos')">Proyectos</button>
      <button id="nCal" onclick="ftIr('calendario')">Calendario</button>
      <button id="nTpl" onclick="ftIr('templates')">Templates</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="modal" class="ftui"><div class="caja" id="modalCaja"></div></div>
<div id="toasts"></div>
<div id="spinner" class="hidden"><div class="sp"></div><div id="spinnerTxt">Trabajando…</div></div>

<script>
'use strict';
/* ============================================================
   VADOCA DocTracker v2 — frontend contra backend Railway
   ============================================================ */
const LSKEY = 'vadoca_doctracker_v2_cfg';
const DEFAULTS = {
  backendUrl: 'https://vadoca-doctracker-backend-production.up.railway.app',
  clientes: [ ['000','VADOCA'], ['001','Novocap SA'], ['002','LKM'], ['003','Passair / Conéctalis'] ],
  tiposTrabajo: [
    { key:'GR',  nombre:'Gestión de Riesgo',                    linea:'VDC' },
    { key:'VTA', nombre:'Validación de Técnicas Analíticas',    linea:'VDC' },
    { key:'VPC', nombre:'Validación de Planillas',              linea:'VPC' },
    { key:'CAL', nombre:'Calificaciones',                       linea:'VDC' },
    { key:'VSI', nombre:'Validación de Sistemas Informáticos',  linea:'VSI' },
  ],
  tiposDoc: ['GR','AR','VTA','RU','DQ','IQ','OQ','PQ','IOQ','IV','PMV','PV'],
  estados: ['Borrador','En revisión','Validable','No validable','En ejecución','Enviado a cliente','Aprobado','Entregado','Suspendido','Cancelado'],
  estadosFinales: ['Entregado','Suspendido','Cancelado'],
  paqueteVPC: [ ['RU','P'],['DQ','P'],['IQ','P'],['IQ','I'],['OQ','P'],['OQ','I'],['PQ','P'],['PQ','I'],['IV','I'] ],
  diasEstancado: 7,

/* ---------- Llamadas al backend ---------- */
async function api(ruta, opt={}){
  opt.headers = Object.assign({}, opt.headers||{}, TOKEN?{Authorization:'Bearer '+TOKEN}:{});
  if(opt.body && !(opt.body instanceof FormData)){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(opt.body); }
  const r = await fetch(CFG.backendUrl + ruta, opt);
  let data = null; try{ data = await r.json(); }catch(e){}
  if(r.status===401 && ruta!=='/api/login'){ cerrarSesion(); throw new Error('Sesión vencida, entrá de nuevo'); }
  if(!r.ok) throw new Error(data?.error || ('Error '+r.status));
  return data;
}

function expedientes(){
  const map = new Map();
  for(const r of REG){
    if(!map.has(r.expediente_id)) map.set(r.expediente_id, {id:r.expediente_id, docs:[], desc:r.descripcion, cliente:r.cliente_num, clienteN:r.cliente_nombre, tt:r.tipo_trabajo, carpeta:r.carpeta_drive_url, ult:r.ultimo_movimiento||'', interno:r.codigo_interno_cliente});
    const e = map.get(r.expediente_id); e.docs.push(r);
    if((r.ultimo_movimiento||'') > e.ult) e.ult = r.ultimo_movimiento;
  }
  return [...map.values()].sort((a,b)=> String(b.ult).localeCompare(String(a.ult)));
}
function esActivo(e){ return e.docs.some(d=>!CFG.estadosFinales.includes(d.estado)); }
function esEstancado(e){ return esActivo(e) && ((diasDesde(e.ult)??99) > CFG.diasEstancado); }
function esEntregado(e){ return e.docs.length && e.docs.every(d=>d.estado==='Entregado'); }
function estadoExp(e){
  const activos = e.docs.filter(d=>!CFG.estadosFinales.includes(d.estado));
  if(!activos.length) return {txt: e.docs.every(d=>d.estado==='Entregado')?'Entregado':'Cerrado', cls:'b-gris'};
  const est = [...new Set(activos.map(d=>d.estado))];
  return {txt: est.length===1?est[0]:'Mixto ('+activos.length+' activos)', cls:'b-info'};
}

/* ---- Circuitos: template de FlowTracker → selección de documentos del wizard ----
   Interpreta los nombres de ítems: "Protocolo DQ"→DQ-P, "Informe IV"→IV-I,
   "Plan Maestro"→PMV-P, "RU"→RU-P, "GR P"/"GR-I"→GR-P/GR-I, "OQ PI"→ambos. */
function matchTipoDoc(x){
  x = String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
  return (CFG.tiposDoc||[]).find(t=>t.toUpperCase()===x) || null;
}
function circuitoDeTemplate(t){
  const pares = [], ignorados = [];
  for(const item of (t.items||[])){
    const sN = String(item).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
    let m, td;
    if((m = sN.match(/^PROTOCOLO\s+(.+)$/)))      { td = matchTipoDoc(m[1]); if(td){ pares.push([td,'P']); continue; } }
    else if((m = sN.match(/^INFORME\s+(.+)$/)))   { td = matchTipoDoc(m[1]); if(td){ pares.push([td,'I']); continue; } }
    else if(/^PLAN\s+MAESTRO/.test(sN))            { td = matchTipoDoc('PMV'); if(td){ pares.push([td,'P']); continue; } }
    else {
      const p = sN.split(/[\s\-\/]+/);
      td = matchTipoDoc(p[0]);
      if(td){
        const pi = ['P','I','PI'].includes(p[1]) ? p[1] : 'P';
        if(pi==='PI'){ pares.push([td,'P'],[td,'I']); } else pares.push([td,pi]);
        continue;
      }
    }
    ignorados.push(item);
  }
  return { pares, ignorados };
}
window.aplicarCircuito = function(){
  const sel = $('#nCircuito'); if(!sel) return;
  const aviso = $('#nCircuitoAviso');
  if(!sel.value){ if(aviso) aviso.textContent=''; return; }
  const t = (DATA.templates||[]).find(x=>x.id===+sel.value); if(!t) return;
  const { pares, ignorados } = circuitoDeTemplate(t);
  const set = new Set(pares.map(([td,pi])=>td+'|'+pi));
  $$('.pqDoc').forEach(el=>{ el.checked = set.has(el.value); });
  if(aviso) aviso.textContent = `Circuito "${t.nombre}": ${set.size} documento(s) tildados.` +
    (ignorados.length ? ` Ítems sin documento asociado (quedan solo como seguimiento): ${ignorados.join(', ')}.` : '');
};

  cerrarModal(); spin(true,'Creando expediente…');
  try{
    const clienteNombre = (CFG.clientes.find(c=>c[0]===p.cliente)||[])[1]||'';
    const d = await api('/api/expedientes',{method:'POST',body:{
      ttKey:p.ttKey, ttNombre:p.ttNombre, linea:p.linea, cliente:p.cliente, clienteNombre,

    }});

    if(a.anula) return `<span class="adj-anulado" title="Esta entrada anula un adjunto previo">↳ anula: ${esc(a.original||a.nombre)}</span>`;
    if(anulados.has(a.drive_id)) return `<span class="adj-anulado" title="Anulado — ver entrada de anulación en esta bitácora">🚫 <s>${esc(a.nombre)}</s> ANULADO</span>`;

// Máquina de estados (espejo del backend). Los tres legacy no se ofrecen como destino.
const DOC_LEGACY = ['Validable','No validable','Aprobado'];
function docEstadosSel(actual){
  const base = (CFG.estados||[]).filter(s=>!DOC_LEGACY.includes(s));
  return (actual && !base.includes(actual)) ? [actual, ...base] : base;
}
function claseTransicionDoc(viejo, nuevo){
  if(viejo===nuevo) return {tipo:'igual', motivo:false};
  const RANK={'Borrador':0,'En revisión':1,'Validable':1,'No validable':1,'En ejecución':2,'Enviado a cliente':3,'Aprobado':4,'Entregado':5};
  if(['Entregado','Cancelado'].includes(viejo)) return {tipo:'reapertura', motivo:true};
  if(viejo==='Suspendido') return {tipo:'reanudación', motivo:true};
  if(nuevo==='Suspendido'||nuevo==='Cancelado') return {tipo:'lateral', motivo:true};
  const rv=RANK[viejo]??2, rn=RANK[nuevo]??2;
  return rn>rv ? {tipo:'avance', motivo:false} : {tipo:'retroceso', motivo:true};
}
// Devuelve {motivo} si el usuario confirma, o null si cancela.
function pedirCambioEstado(viejo, nuevo){
  const c = claseTransicionDoc(viejo, nuevo);
  if(c.tipo==='igual') return null;
  if(!c.motivo) return confirm(`Confirmar cambio de estado:\n\n${viejo}  →  ${nuevo}`) ? {motivo:''} : null;
  const etiq = {reapertura:'REAPERTURA de un estado terminal', 'reanudación':'reanudación desde Suspendido', lateral:'pase a estado lateral', retroceso:'RETROCESO en el circuito'}[c.tipo];
  const m = prompt(`${viejo}  →  ${nuevo}\n\nEsto es ${etiq}: el motivo es obligatorio y queda en la bitácora.\n(A futuro acá va el nº de desvío / nota aclaratoria)\n\nMotivo:`);
  if(m===null) return null;
  if(!m.trim()){ alert('El motivo es obligatorio para este cambio.'); return null; }
  return {motivo:m.trim()};
}

// Ingesta inteligente: detecta códigos tipo XLS089 en el nombre del archivo y los cruza
// con los adjuntos de este expediente y de los demás. Devuelve true si se puede seguir.
async function verificarArchivos(files){
  const codigosDe = s => [...new Set((String(s).toUpperCase().match(/XLS\s?-?\d{2,4}/g)||[]).map(x=>x.replace(/[\s-]/g,'')))];
  const propios = new Set();
  for(const n of FICHA.bit) for(const a of (n.adjuntos||[])) if(!a.anula) codigosDe(a.nombre).forEach(c=>propios.add(c));
  for(const f of files){
    for(const cod of codigosDe(f.name)){
      if(propios.has(cod)) continue;                       // ya conocido en este expediente: OK
      let ajenos = [];
      try{ ajenos = (await api('/api/adjuntos/donde?q='+encodeURIComponent(cod))).filter(x=>x.expediente_id!==FICHA.id); }catch(_){}
      const avisos = [];
      if(propios.size) avisos.push(`Este expediente ya tiene archivos de: ${[...propios].join(', ')}.`);
      if(ajenos.length) avisos.push(`${cod} ya aparece en: ${ajenos.map(x=>x.expediente_id).join(', ')}.`);
      if(!avisos.length) continue;                         // código nuevo y sin conflicto: OK
      const seguir = confirm(`⚠ Posible archivo en expediente equivocado\n\nArchivo: ${f.name}\nExpediente actual: ${FICHA.id}\n\n${avisos.join('\n')}\n\n¿Subir igual a ${FICHA.id}?`);
      if(!seguir) return false;
    }
  }
  return true;
}

const POE_ESTADOS = ['Borrador','En revisión','Aprobado','Vigente','Obsoleto'];
let POE_RELS = [];
async function cargarPoes(){ [POES, POE_RELS] = await Promise.all([api('/api/procedimientos'), api('/api/poe-relaciones')]); }
function relacionadosDe(base){
  const s = new Set();
  for(const r of POE_RELS){ if(r.base===base) s.add(r.relacionado); if(r.relacionado===base) s.add(r.base); }
  return [...s].sort();
}
function tituloDe(base){ const p = POES.find(x=>x.codigo_base===base); return p?p.titulo:''; }
function poesBase(){
  const map = new Map();
  for(const p of POES){
    if(!map.has(p.codigo_base)) map.set(p.codigo_base, {base:p.codigo_base, titulo:p.titulo, versiones:[], carpeta:p.carpeta_drive_url, ult:p.ultimo_movimiento||''});
    const e = map.get(p.codigo_base); e.versiones.push(p);
    if((p.ultimo_movimiento||'') > e.ult) e.ult = p.ultimo_movimiento;
  }
  for(const e of map.values()){
    e.versiones.sort((a,b)=>parseInt(b.version,10)-parseInt(a.version,10));
    e.vigente = e.versiones.find(v=>v.estado==='Vigente') || null;
  }
  return [...map.values()].sort((a,b)=>a.base.localeCompare(b.base));
}
function diasAlVenc(p){ if(!p?.fecha_vencimiento) return null; return Math.ceil((new Date(p.fecha_vencimiento+'T00:00:00').getTime()-Date.now())/86400000); }
function vistaPoes(){

  return `<div class="card" style="${alertas.length?'border-color:var(--warn)':''}">

    ${alertas.length? alertas.map(({b,d})=>`<div style="display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap">

        <span class="badge ${d<0?'b-bad':d<=7?'b-bad':'b-info'}">${d<0?('VENCIDO hace '+(-d)+' días'):('vence en '+d+' día'+(d===1?'':'s'))}</span>
        ${esLector()?'':`<button class="ghost" onclick="event.stopPropagation();nuevaVersionPoe('${esc(b.base)}')">Iniciar revisión</button>`}

    : '<p class="muted" style="margin-top:8px">Ningún procedimiento vence en los próximos 30 días ✔</p>'}
  </div>
  <div class="card">

          <td class="muted">${b.versiones.length}</td>
        </tr>`;
      }).join('')}</tbody></table>`
    : '<p class="muted" style="margin-top:12px">Todavía no hay procedimientos. Creá el primero.</p>'}

}

function todosProyectos() {
  // Tabla única de proyectos: "ambito" separa profesionales de personales.
  const dt = DATA.proyectos.map(p => ({ codigo:p.codigo, nombre:p.nombre, cliente_nombre:p.cliente_nombre||'',

  return dt.concat(faro);
}

}
function tagDe(p) {
  return p.ambito === 'personal' ? '<span class="tag per">Personal</span>' : '<span class="tag pro">Profesional</span>';
}

const hoyISO = () => new Date().toISOString().slice(0,10);


/* ---------- Lógica de cancha ---------- */
function estadoEfectivo(it){ return it.doc_codigo ? (it.doc_estado || 'Borrador') : it.estado; }
function canchaDoc(e) {
  if (['Entregado','Suspendido','Cancelado'].includes(e)) return 'cerrado';
  if (e === 'Enviado a cliente') return 'cliente';
  return 'mia';
}
function cancha(it) {
  const e = estadoEfectivo(it);
  if (it.doc_codigo) return canchaDoc(e);
  if (['aprobado','n/a'].includes(e)) return 'cerrado';
  if (['enviado a cliente','esperando respuesta'].includes(e)) return 'cliente';
  return 'mia';
}
const CHIP = { mia:['c-mia','En tu cancha'], cliente:['c-cliente','Espera al cliente'], cerrado:['c-cerrado','Cerrado'] };
function chip(c){ return `<span class="chip ${CHIP[c][0]}"><span class="punto"></span>${CHIP[c][1]}</span>`; }
function itemsDe(cod){ return DATA.items.filter(i => i.proyecto === cod); }
function docsDe(cod){ return DATA.documentos.filter(d => d.proyecto === cod); }

// Unidades de trabajo de un proyecto: documentos reales de DocTracker + ítems de seguimiento.
// Los ítems vinculados a un documento del mismo proyecto se omiten (ya cuentan como documento).
function unidadesDe(cod) {
  const docs = docsDe(cod);
  const codsDocs = new Set(docs.map(d => d.codigo));
  const uDocs = docs.map(d => ({ clase:'doc', nombre:(d.codigo + ' · ' + (d.tipo_doc||'') + ' ' + (d.prot_inf||'')).trim(),
    estado:d.estado, cancha:canchaDoc(d.estado), fecha_limite:null }));
  const uItems = itemsDe(cod).filter(i => !(i.doc_codigo && codsDocs.has(i.doc_codigo)))
    .map(i => ({ clase:'seg', nombre:i.nombre, estado:estadoEfectivo(i), cancha:cancha(i), fecha_limite:i.fecha_limite }));
  return uDocs.concat(uItems);
}

function ftRender() {
  if (typeof MODULO !== 'undefined' && MODULO === 'com') { renderCom(); return; }
  for (const [id,v] of [['nHoy','hoy'],['nProy','proyectos'],['nCal','calendario'],['nTpl','templates']])

  else m.innerHTML = vistaTemplates();
  if (VISTA === 'proyectos' && PROY_SEL) cargarBitacora();
}

/* ---------- Vista HOY ---------- */
function tarjetaProyecto(p) {
  const us = unidadesDe(p.codigo);
  const cerrados = us.filter(u => u.cancha === 'cerrado').length;
  const enMia = us.filter(u => u.cancha === 'mia').length;
  const enCli = us.filter(u => u.cancha === 'cliente').length;
  const prox = us.find(u => u.cancha === 'mia') || us.find(u => u.cancha === 'cliente');
  const pct = us.length ? Math.round(cerrados / us.length * 100) : 0;
  return `<div class="card pcard ${p.ambito === 'personal' ? 'personal' : ''}" onclick="abrirProyecto('${esc(p.codigo)}')">
    <div class="fila" style="justify-content:space-between">
      <h3>${esc(p.codigo)} · ${esc(p.nombre)} ${tagDe(p)}</h3>${prox ? chip(prox.cancha) : chip('cerrado')}
    </div>
    <div class="muted">${esc(p.cliente_nombre || '')} · ${cerrados}/${us.length} cerrados${enMia ? ` · ${enMia} en tu cancha` : ''}${enCli ? ` · ${enCli} del cliente` : ''}</div>

      </div>
    </div>
    ${docsProy.length ? `<div class="fila" style="justify-content:space-between;margin-top:14px">
      <div class="seccion" style="margin:0">Expedientes y documentos · DocTracker (${exps.size} exp / ${docsProy.length} docs)</div>
      <div class="modo-btns">
        <button class="${MODO_DETALLE === 'lista' ? 'on' : ''}" onclick="MODO_DETALLE='lista';ftRender()">☰ Lista</button>

// Árbol: proyecto → expedientes ABIERTOS (amarillo) → documentos por color.
// Los expedientes 100% cerrados no aparecen. Clic en un expediente lo expande/colapsa.
function arbolProyecto(p, exps) {
  const abiertos = [...exps.entries()].filter(([, docs]) => docs.some(d => canchaDoc(d.estado) !== 'cerrado'));
  if (!abiertos.length) return '<div class="tarea-vacia">🎉 Todos los expedientes están cerrados — no queda nada abierto en este proyecto.</div>';
  const cerradosOcultos = exps.size - abiertos.length;

  let ramas = '';
  for (const [expId, docs] of abiertos) {
    const n = { mia:0, cliente:0, cerrado:0 };
    for (const d of docs) n[canchaDoc(d.estado)]++;
    const abierto = ARBOL_EXP.has(expId);
    const resumen = ['mia','cliente','cerrado'].filter(c => n[c])
      .map(c => `<span style="background:${ARBOL_COLOR[c]}">${n[c]}</span>`).join('');
    const hojas = !abierto ? '' : `<div class="hojas">${docs
      .slice().sort((a,b) => ordenTipo(a.tipo_doc) - ordenTipo(b.tipo_doc))
      .map(d => { const c = ARBOL_COLOR[canchaDoc(d.estado)];
        return `<div class="hoja" style="--h-color:${c}">
          <span class="hoja-chip" style="background:${c}" title="${esc(d.codigo)}">${esc(d.tipo_doc || '')} ${esc(d.prot_inf || '')} · ${esc(d.estado)}${d.estado === 'Entregado' ? ' ✓' : ''}</span>
        </div>`; }).join('')}</div>`;
    ramas += `<div class="exp-nodo">
      <div class="exp-caja" onclick="toggleExp('${esc(expId)}')">
        <span class="caret">${abierto ? '▾' : '▸'}</span>
        <b>${esc(expId)}</b>
        <span class="desc">${esc(docs[0].descripcion || '')}</span>
        <span class="resumen">${resumen}</span>
      </div>
      ${hojas}
    </div>`;
  }

  return `<div class="arbol">
      <div class="raiz">${esc(p.codigo)} · ${esc(p.nombre)}</div>
      <div class="ramas">${ramas}</div>
    </div>
    <div class="leyenda">
      <span><span class="celda" style="background:${ARBOL_COLOR.mia}"></span>Tenés que entregarlo</span>
      <span><span class="celda" style="background:${ARBOL_COLOR.cliente}"></span>Lo tiene el cliente</span>
      <span><span class="celda" style="background:${ARBOL_COLOR.cerrado}"></span>Entregado</span>
      ${cerradosOcultos ? `<span class="muted">· ${cerradosOcultos} expediente(s) cerrados ocultos</span>` : ''}
    </div>`;
}
function toggleExp(id){ ARBOL_EXP.has(id) ? ARBOL_EXP.delete(id) : ARBOL_EXP.add(id); ftRender(); }

// Matriz: filas = expedientes, columnas = tipo P / tipo I.
// Los documentos legacy "PI" (protocolo+informe unificados) alimentan AMBAS columnas
// de su tipo, así no queda una tercera columna PI llena de agujeros.
function mapaProyecto(exps) {
  const colsDe = d => {
    const t = (d.tipo_doc || '?').toUpperCase().trim();
    const pi = (d.prot_inf || '').toUpperCase().trim();
    if (pi === 'PI') return [t + ' P', t + ' I'];
    return [(t + (pi ? ' ' + pi : '')).trim()];
  };
  const rangoPI = s => ({ 'P': 0, 'I': 1 }[s] ?? 9);
  const cols = [...new Set([...exps.values()].flat().flatMap(colsDe))]
    .sort((a, b) => {
      const [ta, pa] = a.split(' '), [tb, pb] = b.split(' ');
      return ordenTipo(ta) - ordenTipo(tb) || rangoPI(pa) - rangoPI(pb) || a.localeCompare(b);
    });
  let filas = '';
  // Más nuevos arriba: en batches largos, los viejos ya cerrados se van al fondo
  for (const [expId, docs] of [...exps.entries()].reverse()) {
    let celdas = '';
    for (const c of cols) {
      const ds = docs.filter(d => colsDe(d).includes(c));
      if (!ds.length) { celdas += '<td><div class="celda vacia" title="No aplica — no es entregable de este expediente">–</div></td>'; continue; }
      // Si hay varios docs del mismo tipo (P + I, versiones), manda el "peor": tu cancha > cliente > cerrado
      const canchas = ds.map(d => canchaDoc(d.estado));
      const peor = canchas.includes('mia') ? 'mia' : canchas.includes('cliente') ? 'cliente' : 'cerrado';
      const titulo = ds.map(d => `${d.codigo} (${(d.prot_inf || '').toUpperCase() === 'PI' ? 'PI unificado' : d.prot_inf || '—'}): ${d.estado}`).join('\n');
      celdas += `<td><div class="celda" style="background:${CANCHA_COLOR[peor]}" title="${esc(titulo)}"></div></td>`;
    }
    const desc = (docs => (docs[0].descripcion || ''))(exps.get(expId));
    filas += `<tr><td class="exp-nom" title="${esc(desc)}">${esc(expId)}</td>${celdas}</tr>`;
  }
  return `<div class="mapa-wrap"><table class="mapa">
      <tr><th style="text-align:left">Expediente</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
      ${filas}</table></div>
    <div class="leyenda">
      <span><span class="celda" style="background:${CANCHA_COLOR.mia}"></span>En tu cancha</span>
      <span><span class="celda" style="background:${CANCHA_COLOR.cliente}"></span>Espera al cliente</span>
      <span><span class="celda" style="background:${CANCHA_COLOR.cerrado}"></span>Cerrado</span>
      <span><span class="celda vacia">–</span>No aplica</span>
      <span class="muted">· Los PI viejos (protocolo+informe unificados) llenan ambas columnas; el hover detalla cada documento</span>
    </div>`;
}

/* ---------- Vista CALENDARIO ---------- */
function vistaCalendario() {
  if (!CAL_MES) { const d = new Date(); CAL_MES = [d.getFullYear(), d.getMonth()]; }
  const [anio, mes] = CAL_MES;
  const primero = new Date(anio, mes, 1);
  const inicio = (primero.getDay() + 6) % 7; // lunes = 0
  const dias = new Date(anio, mes + 1, 0).getDate();
  const h = hoyISO();
  const porFecha = {};
  for (const i of DATA.items) if (i.fecha_limite && cancha(i) !== 'cerrado')
    (porFecha[i.fecha_limite] = porFecha[i.fecha_limite] || []).push(i);
  let celdas = '';
  for (let x = 0; x < inicio; x++) celdas += '<div></div>';
  for (let d = 1; d <= dias; d++) {
    const f = `${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    celdas += `<div class="dia ${f === h ? 'hoy-dia' : ''}"><div class="n">${d}</div>
      ${(porFecha[f] || []).map(i => `<div class="it ${f < h ? 'tarde' : ''}" onclick="abrirProyecto('${esc(i.proyecto)}')" title="${esc(i.proyecto)}">${esc(i.nombre)}</div>`).join('')}</div>`;
  }
  return `<div class="card">
    <div class="fila" style="justify-content:space-between;margin-bottom:12px">
      <button class="btn sec mini" onclick="CAL_MES=[${mes===0?anio-1:anio},${mes===0?11:mes-1}];ftRender()">←</button>
      <h2 style="font-size:16px">${MESES[mes]} ${anio}</h2>
      <button class="btn sec mini" onclick="CAL_MES=[${mes===11?anio+1:anio},${mes===11?0:mes+1}];ftRender()">→</button>
    </div>
    <div class="cal-cab"><div>Lu</div><div>Ma</div><div>Mi</div><div>Ju</div><div>Vi</div><div>Sá</div><div>Do</div></div>
    <div class="cal">${celdas}</div>
  </div>`;
}

/* ---------- Vista FACTURACIÓN ---------- */
let FACT_F = { cliente:'', estado:'todas', desde:'', hasta:'' };
const fmtMonto = (n, m) => (m === 'USD' ? 'USD ' : '$ ') + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 2 });

function factRango(desde, hasta) { FACT_F.desde = desde; FACT_F.hasta = hasta; ftRender(); }
function enRango(f) { return (!FACT_F.desde || (f || '') >= FACT_F.desde) && (!FACT_F.hasta || (f || '') <= FACT_F.hasta); }

function vistaComercial() {
  const todas = DATA.facturas || [];
  const clientes = [...new Set(todas.map(f => f.cliente).filter(Boolean))].sort();

  // Totales del período, separados por moneda:
  // Facturado y Pendiente por fecha de emisión; Cobrado por fecha de cobro.
  const tot = { fact:{}, cob:{}, pend:{} };
  for (const f of todas) {
    if ((FACT_F.cliente && f.cliente !== FACT_F.cliente)) continue;
    if (enRango(f.fecha_emision)) {
      tot.fact[f.moneda] = (tot.fact[f.moneda] || 0) + +f.monto;
      if (f.estado !== 'Cobrada') tot.pend[f.moneda] = (tot.pend[f.moneda] || 0) + +f.monto;
    }
    if (f.estado === 'Cobrada' && enRango(f.fecha_cobro))
      tot.cob[f.moneda] = (tot.cob[f.moneda] || 0) + +f.monto;
  }
  const rTot = o => Object.keys(o).sort().map(m => `<div style="font-size:16px;font-weight:700">${fmtMonto(o[m], m)}</div>`).join('') || '<div class="muted">—</div>';

  const lista = todas.filter(f =>
    (!FACT_F.cliente || f.cliente === FACT_F.cliente) &&
    (FACT_F.estado === 'todas' || f.estado === FACT_F.estado) &&
    enRango(f.fecha_emision));

  const hoy = new Date(); const y = hoy.getFullYear();
  const hace3m = new Date(hoy - 90*864e5).toISOString().slice(0,10);

  // Presupuestos: gestión completa. El correlativo lo asigna DocTracker.
  const PRES_ESTADOS = ['Borrador','Enviado','Aceptado','Rechazado','Vencido'];
  const presRelevantes = (DATA.presupuestos || []).filter(p =>
    (!FACT_F.cliente || p.cliente_nombre === FACT_F.cliente));
  const htmlPres = presRelevantes.map(p => {
    const fs = todas.filter(f => f.presupuesto === p.codigo);
    const sumas = {};
    for (const f of fs) sumas[f.moneda] = (sumas[f.moneda] || 0) + +f.monto;
    const cobradas = fs.filter(f => f.estado === 'Cobrada').length;
    const pct = (p.moneda && sumas[p.moneda] && +p.monto) ? Math.round(sumas[p.moneda] / +p.monto * 100) : null;
    const cerrada = p.facturacion === 'Cerrada';
    const aceptado = p.estado === 'Aceptado';
    const sumasTxt = Object.keys(sumas).sort().map(m => fmtMonto(sumas[m], m)).join(' + ');
    const borde = cerrada ? '#2E9E5B' : aceptado ? '#E6B93C' : 'var(--borde)';
    return `<div class="card" style="border-left:4px solid ${borde}">
      <div class="fila" style="justify-content:space-between">
        <div style="min-width:0"><b>${esc(p.codigo)}</b> · ${esc(p.cliente_nombre || '')} <span class="muted">· ${esc((p.descripcion || '').slice(0,50))}</span>
          <div class="muted" style="margin-top:3px">Presupuesto: ${fmtMonto(p.monto || 0, p.moneda || 'ARS')}${p.fecha_emision ? ' · ' + esc(p.fecha_emision) : ''}${fs.length ? ` · ${fs.length} factura${fs.length === 1 ? '' : 's'} (${cobradas} cobrada${cobradas === 1 ? '' : 's'}) · Facturado: ${sumasTxt}${pct !== null ? ` · ${pct}%` : ''}` : ''}</div>
        </div>
        <div class="ops">
          ${esAdmin() ? `<select onchange="estadoPresup('${esc(p.codigo)}', this.value)" title="Estado del presupuesto">
            ${PRES_ESTADOS.map(s => `<option ${p.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`
            : `<span class="chip ${p.estado === 'Aceptado' ? 'c-cerrado' : 'c-mia'}"><span class="punto"></span>${esc(p.estado)}</span>`}
          ${aceptado ? `<span class="chip ${cerrada ? 'c-cerrado' : 'c-mia'}"><span class="punto"></span>Fact. ${cerrada ? 'cerrada' : 'abierta'}</span>
            ${esLector() ? '' : cerrada
              ? `<button class="btn sec mini" onclick="cicloPresup('${esc(p.codigo)}','Abierta')">Reabrir</button>`
              : `<button class="btn mini" onclick="cicloPresup('${esc(p.codigo)}','Cerrada')">Cerrar ciclo</button>`}` : ''}
          ${esAdmin() ? `<button class="btn sec mini" title="Ficha y bitácora del presupuesto" onclick="abrirPresu('${esc(p.codigo)}')">🗒</button>
          <button class="btn sec mini" title="Editar datos" onclick="modalEditarPresup('${esc(p.codigo)}')">✎</button>
          <button class="btn sec mini" title="Adjuntar archivo (presupuesto, comprobantes) a la carpeta Drive con bitácora" onclick="modalAdjunto('${esc(p.codigo)}','')">📎</button>` : ''}
          ${p.carpeta_drive_url ? `<a href="${esc(p.carpeta_drive_url)}" target="_blank" class="btn sec mini" style="text-decoration:none" title="Abrir carpeta en Drive">🗂</a>` : ''}
        </div>
      </div></div>`;
  }).join('');

  return `<div class="fila" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="font-size:17px">Comercial · presupuestos y facturación</h2>
      <div class="fila">
        ${esAdmin() ? `<button class="btn sec mini" onclick="modalImportarPresus()">⇪ Importar histórico</button>
        <button class="btn sec mini" onclick="reconstruirPresus()">↺ Reconstruir del registro</button>
        <button class="btn sec mini" onclick="modalNuevoPresup()">+ Presupuesto</button>` : ''}
        ${esLector() ? '' : `<button class="btn mini" onclick="modalFactura(null)">+ Nueva factura</button>`}
      </div></div>

    <div class="card"><div class="fila">
      <select onchange="FACT_F.cliente=this.value;ftRender()">
        <option value="">Todos los clientes</option>
        ${clientes.map(c => `<option ${FACT_F.cliente === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select onchange="FACT_F.estado=this.value;ftRender()">
        <option value="todas" ${FACT_F.estado === 'todas' ? 'selected' : ''}>Todas</option>
        <option value="Emitida" ${FACT_F.estado === 'Emitida' ? 'selected' : ''}>Emitidas (sin cobrar)</option>
        <option value="Cobrada" ${FACT_F.estado === 'Cobrada' ? 'selected' : ''}>Cobradas</option></select>
      <input type="date" value="${esc(FACT_F.desde)}" onchange="FACT_F.desde=this.value;ftRender()" title="Desde">
      <input type="date" value="${esc(FACT_F.hasta)}" onchange="FACT_F.hasta=this.value;ftRender()" title="Hasta">
      <div class="modo-btns">
        <button onclick="factRango('${hace3m}','')">3 meses</button>
        <button onclick="factRango('${y}-01-01','')">Este año</button>
        <button onclick="factRango('','')">Todo</button></div>
    </div></div>

    <div class="hoy-grid" style="grid-template-columns:1fr 1fr 1fr">
      <div class="card"><div class="muted" style="font-weight:600">FACTURADO</div>${rTot(tot.fact)}</div>
      <div class="card"><div class="muted" style="font-weight:600;color:#1F7A44">COBRADO</div>${rTot(tot.cob)}</div>
      <div class="card"><div class="muted" style="font-weight:600;color:#9A5B12">PENDIENTE DE COBRO</div>${rTot(tot.pend)}</div>
    </div>

    ${htmlPres ? `<div class="seccion">Por presupuesto</div>${htmlPres}` : ''}
    <div class="seccion">Facturas</div>
    <div class="card">
    ${lista.map(f => {
      const pres = (DATA.presupuestos || []).find(p => p.codigo === f.presupuesto);
      return `<div class="item-row" style="grid-template-columns:1fr auto">
        <div class="nom"><b>${esc(f.numero)}</b> · ${esc(f.cliente)} <span class="muted">· ${esc(f.fecha_emision)}</span>
          ${f.presupuesto ? `<span class="doc">Presup. ${esc(f.presupuesto)}${pres ? ` (${fmtMonto(pres.monto || 0, pres.moneda || 'ARS')})` : ''}</span>` : ''}
          ${f.estado === 'Cobrada' && f.fecha_cobro ? `<span class="doc" style="color:#1F7A44">Cobrada el ${esc(f.fecha_cobro)}</span>` : ''}
        </div>
        <div class="ops">
          <b style="font-size:13px">${fmtMonto(f.monto, f.moneda)}</b>
          <span class="chip ${f.estado === 'Cobrada' ? 'c-cerrado' : 'c-mia'}"><span class="punto"></span>${esc(f.estado)}</span>
          ${!esLector() && f.estado !== 'Cobrada' ? `<button class="btn mini" onclick="cobrarFactura(${f.id})">Cobrar</button>` : ''}
          ${esAdmin() && f.presupuesto ? `<button class="btn sec mini" title="Adjuntar PDF de la factura o comprobante de pago" onclick="modalAdjunto('${esc(f.presupuesto)}','[Factura ${esc(f.numero)}] ')">📎</button>` : ''}
          ${esLector() ? '' : `<button class="btn sec mini" onclick="modalFactura(${f.id})">✎</button>
          <button class="btn rojo mini" onclick="borrarFactura(${f.id})">✕</button>`}
        </div>
      </div>`; }).join('') || '<div class="tarea-vacia">No hay facturas en este filtro.</div>'}
    </div>`;
}

function modalFactura(id) {
  const f = id ? DATA.facturas.find(x => x.id === id) : { numero:'', cliente:'', presupuesto:'', fecha_emision: hoyISO(), monto:'', moneda:'ARS', notas:'' };
  // Solo presupuestos Aceptados con ciclo de facturación abierto (más el ya vinculado, si se edita)
  const pres = (DATA.presupuestos || []).filter(p =>
    (p.estado === 'Aceptado' && p.facturacion !== 'Cerrada') || p.codigo === f.presupuesto);
  ftAbrirModal(`<h3>${id ? 'Editar' : 'Nueva'} factura</h3>
    <label>Número</label><input id="fNum" value="${esc(f.numero)}" placeholder="Ej: 0003-00000123">
    <label>Presupuesto vinculado (opcional)</label>
    <select id="fPres" onchange="presupSeleccionado()">
      <option value="">— Sin presupuesto —</option>
      ${pres.map(p => `<option value="${esc(p.codigo)}" data-cliente="${esc(p.cliente_nombre || '')}" ${f.presupuesto === p.codigo ? 'selected' : ''}>
        ${esc(p.codigo)} · ${esc(p.cliente_nombre || '')} · ${fmtMonto(p.monto || 0, p.moneda || 'ARS')} · ${esc(p.estado)}</option>`).join('')}</select>
    <div class="muted" id="fPresRef" style="margin-top:4px"></div>
    <label>Cliente</label><input id="fCli" value="${esc(f.cliente)}" list="fClientes">
    <datalist id="fClientes">${[...new Set([...(DATA.facturas||[]).map(x=>x.cliente), ...pres.map(p=>p.cliente_nombre)].filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <label>Fecha de emisión</label><input id="fFec" type="date" value="${esc(f.fecha_emision)}">
    <div class="fila"><div style="flex:1"><label>Monto de la factura</label><input id="fMonto" type="number" step="0.01" value="${esc(f.monto)}"></div>
    <div><label>Moneda</label><select id="fMon"><option ${f.moneda === 'ARS' ? 'selected' : ''}>ARS</option><option ${f.moneda === 'USD' ? 'selected' : ''}>USD</option></select></div></div>
    <label>Notas</label><input id="fNotas" value="${esc(f.notas)}">
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="guardarFactura(${id ?? 'null'})">Guardar</button></div>`);
  presupSeleccionado(true);
}
function presupSeleccionado(soloRef) {
  const sel = document.getElementById('fPres');
  const op = sel.options[sel.selectedIndex];
  const p = (DATA.presupuestos || []).find(x => x.codigo === sel.value);
  document.getElementById('fPresRef').textContent = p ? `Referencia del presupuesto: ${fmtMonto(p.monto || 0, p.moneda || 'ARS')} — la factura lleva su propio monto y moneda` : '';
  if (!soloRef && op && op.dataset.cliente) document.getElementById('fCli').value = op.dataset.cliente;
}
async function guardarFactura(id) {
  const body = {
    numero: document.getElementById('fNum').value.trim(),
    presupuesto: document.getElementById('fPres').value,
    cliente: document.getElementById('fCli').value.trim(),
    fecha_emision: document.getElementById('fFec').value,
    monto: +document.getElementById('fMonto').value || 0,
    moneda: document.getElementById('fMon').value,
    notas: document.getElementById('fNotas').value.trim()
  };
  if (!body.numero || !body.fecha_emision) return alert('Faltan número o fecha');
  try {
    if (id) await api('/api/seguimiento/facturas/' + id, { method:'PATCH', body });
    else await api('/api/seguimiento/facturas', { method:'POST', body });
    ftCerrarModal(); await ftCargar(); ftRender();
  } catch(e){ alert(e.message); }
}
async function cobrarFactura(id) {
  const fecha = prompt('Fecha de cobro:', hoyISO());
  if (!fecha) return;
  try { await api('/api/seguimiento/facturas/' + id, { method:'PATCH', body:{ estado:'Cobrada', fecha_cobro: fecha } }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}
async function borrarFactura(id) {
  if (!confirm('¿Eliminar esta factura del registro?')) return;
  try { await api('/api/seguimiento/facturas/' + id, { method:'DELETE' }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}
async function cicloPresup(codigo, estado) {
  if (estado === 'Cerrada' && !confirm(`¿Cerrar el ciclo de facturación de ${codigo}? No vas a poder vincularle facturas nuevas (se puede reabrir).`)) return;
  try { await api('/api/seguimiento/presupuestos/' + encodeURIComponent(codigo) + '/facturacion', { method:'PATCH', body:{ estado } }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}

/* --- Presupuestos: crear, estado, editar, adjuntos (usa los endpoints de DocTracker) --- */
function modalNuevoPresup() {
  ftAbrirModal(`<h3>Nuevo presupuesto</h3>
    <p class="muted">El número correlativo lo asigna el sistema automáticamente. Nace en estado Borrador.</p>
    <label>Cliente</label><select id="pCli">${CFG.clientes.map(c => `<option value="${c[0]}">${c[0]} · ${esc(c[1])}</option>`).join('')}</select>
    <label>Descripción</label><input id="pDesc" placeholder="Ej: Calificación software Niagara — Lab POE">
    <div class="fila"><div style="flex:1"><label>Monto</label><input id="pMonto" type="number" step="0.01"></div>
    <div><label>Moneda</label><select id="pMon"><option>USD</option><option>ARS</option></select></div></div>
    <label>Fecha de emisión</label><input id="pFec" type="date" value="${hoyISO()}">
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="crearPresup()">Crear</button></div>`);
}
async function crearPresup() {
  const cliNum = document.getElementById('pCli').value;
  const body = {
    cliente: cliNum,
    clienteNombre: (CFG.clientes.find(c => c[0] === cliNum) || [])[1] || '',
    descripcion: document.getElementById('pDesc').value.trim(),
    monto: +document.getElementById('pMonto').value || null,
    moneda: document.getElementById('pMon').value,
    fecha_emision: document.getElementById('pFec').value
  };
  if (!body.descripcion) return alert('Falta la descripción');
  try {
    const r = await api('/api/presupuestos', { method:'POST', body });
    ftCerrarModal(); await ftCargar(); ftRender();
    alert('Presupuesto ' + r.codigo + ' creado en Borrador. Adjuntale el PDF con 📎 y pasalo a Enviado cuando salga.');
  } catch(e){ alert(e.message); }
}
async function estadoPresup(codigo, estado) {
  try { await api('/api/presupuestos/' + encodeURIComponent(codigo) + '/estado', { method:'POST', body:{ estado } }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}
function modalEditarPresup(codigo) {
  const p = (DATA.presupuestos || []).find(x => x.codigo === codigo);
  if (!p) return;
  ftAbrirModal(`<h3>Editar presupuesto ${esc(codigo)}</h3>
    <label>Cliente</label><input id="eCli" value="${esc(p.cliente_nombre || '')}">
    <label>Descripción</label><input id="eDesc" value="${esc(p.descripcion || '')}">
    <div class="fila"><div style="flex:1"><label>Monto</label><input id="eMonto" type="number" step="0.01" value="${esc(p.monto ?? '')}"></div>
    <div><label>Moneda</label><select id="eMon"><option ${p.moneda === 'USD' ? 'selected' : ''}>USD</option><option ${p.moneda === 'ARS' ? 'selected' : ''}>ARS</option></select></div></div>
    <label>Fecha de emisión</label><input id="eFec" type="date" value="${esc(p.fecha_emision || '')}">
    <label>Motivo del cambio (queda en bitácora)</label><input id="eMotivo" placeholder="Ej: corrección de monto acordada con el cliente">
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="guardarPresup('${esc(codigo)}')">Guardar</button></div>`);
}
async function guardarPresup(codigo) {
  try {
    await api('/api/presupuestos/' + encodeURIComponent(codigo) + '/corregir', { method:'POST', body:{
      clienteNombre: document.getElementById('eCli').value.trim(),
      descripcion: document.getElementById('eDesc').value.trim(),
      monto: document.getElementById('eMonto').value,
      moneda: document.getElementById('eMon').value,
      fecha_emision: document.getElementById('eFec').value,
      motivo: document.getElementById('eMotivo').value.trim()
    }});
    ftCerrarModal(); await ftCargar(); ftRender();
  } catch(e){ alert(e.message); }
}
// Adjuntar archivos a la carpeta Drive del presupuesto, con nota en bitácora.
// prefijo: ej "[Factura 0003-123] " cuando se sube el PDF/comprobante de una factura.
function modalAdjunto(codigo, prefijo) {
  ftAbrirModal(`<h3>Adjuntar a ${esc(codigo)}</h3>
    <p class="muted">Los archivos van a la carpeta Drive del presupuesto y quedan asentados en la bitácora.</p>
    <label>Archivos</label><input id="aFiles" type="file" multiple>
    <label>Nota</label><input id="aTexto" value="${esc(prefijo)}" placeholder="Ej: comprobante de transferencia del cliente">
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="subirAdjunto('${esc(codigo)}')">Subir</button></div>`);
}
async function subirAdjunto(codigo) {
  const files = document.getElementById('aFiles').files;
  const texto = document.getElementById('aTexto').value.trim();
  if (!files.length && !texto) return alert('Elegí al menos un archivo o escribí una nota');
  const fd = new FormData();
  for (const f of files) fd.append('archivos', f);
  fd.append('texto', texto);
  try {
    await api('/api/presupuestos/' + encodeURIComponent(codigo) + '/notas', { method:'POST', body: fd });
    ftCerrarModal(); await ftCargar(); ftRender();
  } catch(e){ alert(e.message); }
}

/* ---------- Vista TEMPLATES ---------- */
function vistaTemplates() {
  return `<div class="fila" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="font-size:17px">Templates de entregables</h2>
      <button class="btn mini" onclick="modalNuevoTemplate()">+ Nuevo</button></div>
    ${DATA.templates.map(t => `<div class="card">
      <div class="fila" style="justify-content:space-between">
        <h3 style="font-size:14px">${esc(t.nombre)} <span class="muted">· ${t.items.length} ítems</span></h3>
        <div class="fila">
          <button class="btn sec mini" onclick="modalEditarTemplate(${t.id})">Editar</button>
          <button class="btn rojo mini" onclick="borrarTemplate(${t.id})">✕</button></div>
      </div>
      <div class="muted" style="margin-top:6px">${t.items.map(esc).join(' → ') || 'Sin ítems (proyecto libre)'}</div>
    </div>`).join('')}`;
}
function modalNuevoTemplate(){ modalTpl({ id:null, nombre:'', items:[] }); }
function modalEditarTemplate(id){ modalTpl(DATA.templates.find(t => t.id === id)); }
function modalTpl(t) {
  ftAbrirModal(`<h3>${t.id ? 'Editar' : 'Nuevo'} template</h3>
    <label>Nombre</label><input id="tNom" value="${esc(t.nombre)}">
    <label>Ítems (uno por línea, en orden)</label>
    <textarea id="tIts" rows="10">${esc(t.items.join('\n'))}</textarea>
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="guardarTemplate(${t.id ?? 'null'})">Guardar</button></div>`);
}
async function guardarTemplate(id) {
  const nombre = document.getElementById('tNom').value.trim();
  const items = document.getElementById('tIts').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!nombre) return alert('Falta el nombre');
  try {
    if (id) await api('/api/seguimiento/templates/' + id, { method:'PATCH', body:{ nombre, items } });
    else await api('/api/seguimiento/templates', { method:'POST', body:{ nombre, items } });
    ftCerrarModal(); await ftCargar(); ftRender();
  } catch(e){ alert(e.message); }
}
async function borrarTemplate(id) {
  if (!confirm('¿Eliminar template? Los ítems ya aplicados a proyectos no se tocan.')) return;
  try { await api('/api/seguimiento/templates/' + id, { method:'DELETE' }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}



/* ===================== PUENTE SUITE (módulos) ===================== */
let MODULO = 'dt';           // 'dt' DocTracker · 'ft' FlowTracker · 'com' Comercial
let COM_VIEW = 'lista';      // vista interna del módulo Comercial
async function ftCargar(){ DATA = await api('/api/seguimiento/data'); DATA.cargado = true; }
function renderCom(){
  const shell = $('#app');
  shell.innerHTML = '<div id="ftScope" class="ftui">' + (COM_VIEW === 'ficha' ? vistaPresuFicha() : vistaComercial()) + '</div>';
}
window.cambiarModulo = async function(m){
  if(!TOKEN) return;
  if(m === 'com' && !esAdmin()) return;
  MODULO = m;
  if((m === 'ft' || m === 'com') && !DATA.cargado){
    spin(true,'Cargando seguimiento…');
    try{ await ftCargar(); }catch(e){ toast(e.message,'err'); }
    spin(false);
  }
  if(m === 'com'){
    COM_VIEW = 'lista';
    if(esAdmin() && !PRESUS.length){ try{ await cargarPresus(); }catch(e){} }
  }
  render();
};
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') ftCerrarModal(); });
$$('#modSwitch button').forEach(b => b.addEventListener('click', () => cambiarModulo(b.dataset.mod)));

/* ----- Arranque ----- */
(async function(){
  render();
  if(TOKEN){
    spin(true,'Cargando registro…');
    try{ await cargarRegistro(); }catch(e){ /* sesión vencida ya manejada */ }
    spin(false); render();
  }
})();
</script>
