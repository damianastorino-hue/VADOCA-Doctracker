<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VADOCA · Suite</title>
<style>
  :root{
    --tq:#1FC8FF; --tq-dark:#0089B0; --tq-text:#00708F; --tq-soft:#E3F6FD;
    --g1:#3D5A6C; --g2:#5B6E7E; --g3:#A9BCC8; --g4:#E1EAF0;
    --bg:#F4F8FB; --card:#FFFFFF;
    --ok:#2E9E5B; --warn:#D98E04; --bad:#C94F3D;
    --mono:'Courier New',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--g1);font-size:15px;line-height:1.45}
  h1,h2,h3{font-weight:600}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;background:var(--tq);color:var(--navy);font-weight:600;transition:background .15s}
  button:hover{background:var(--tq-dark);color:#fff}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tq);outline-offset:2px}
  button.sec{background:var(--g4);color:var(--g1)} button.sec:hover{background:var(--g3);color:var(--g1)}
  button.ghost{background:transparent;color:var(--tq-text);padding:6px 10px} button.ghost:hover{background:var(--tq-soft);color:var(--tq-text)}
  button.rojo{background:var(--bad);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font:inherit;border:1px solid var(--g3);border-radius:8px;padding:9px 11px;width:100%;background:#fff;color:var(--g1)}
  textarea{resize:vertical;min-height:80px}
  label{display:block;font-size:13px;font-weight:600;color:var(--g2);margin:12px 0 4px}
  a{color:var(--tq-text)}
  header{background:var(--card);border-bottom:1px solid var(--g4);position:sticky;top:0;z-index:20}
  .hwrap{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-size:18px;font-weight:700;letter-spacing:.5px}
  .logo b{color:var(--tq)}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{background:transparent;color:var(--g2);font-weight:600;padding:8px 14px;border-radius:8px}
  nav button.active{background:var(--tq-soft);color:var(--tq-text)}
  nav button:hover{background:var(--g4);color:var(--g1)}
  #userChip{font-size:12px;color:var(--g2)}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 90px}
  .card{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:18px;margin-bottom:14px}
  .muted{color:var(--g2);font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:180px}
  .codigo{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--tq-soft);color:var(--tq-text);border-left:3px solid var(--tq);padding:3px 8px;border-radius:0 6px 6px 0;display:inline-block;letter-spacing:.3px}
  .hashchip{font-family:var(--mono);font-size:10px;color:var(--g3)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:12px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .stat:hover{border-color:var(--tq)}
  .stat.activa{border-color:var(--tq);background:var(--tq-soft)}
  .stat .n{font-size:26px;font-weight:700;color:var(--tq-text)}
  .stat .l{font-size:12px;color:var(--g2)}
  .stat.alerta .n{color:var(--bad)}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filtros select,.filtros input{flex:1;min-width:130px;width:auto}
  .exp{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .exp:hover{border-color:var(--tq)}
  .exp .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .exp .desc{font-weight:600;flex:1;min-width:180px}
  .exp .meta{font-size:12px;color:var(--g2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-bad{background:#F9E6E2;color:var(--bad)} .b-info{background:var(--tq-soft);color:var(--tq-text)}
  .b-gris{background:var(--g4);color:var(--g2)} .b-ok{background:#E3F4EA;color:var(--ok)}
  .docs-tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .docs-tabla th{text-align:left;color:var(--g2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--g4)}
  .docs-tabla td{padding:7px 8px;border-bottom:1px solid var(--g4);vertical-align:middle}
  .docs-tabla select{padding:5px 8px;font-size:13px;width:auto}
  .nota{border-left:3px solid var(--g4);padding:10px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 8px 8px 0}
  .nota.tipo-creacion{border-left-color:var(--tq)}
  .nota.tipo-estado{border-left-color:var(--warn)}
  .nota.tipo-version{border-left-color:var(--ok)}
  .nota.tipo-correccion{border-left-color:var(--bad)}
  .nota .nts{font-size:11px;color:var(--g2);font-family:var(--mono)}
  .nota .ntx{margin:5px 0;white-space:pre-wrap}
  .nota .adj a{font-size:12px;margin-right:10px}
  .adj-anulado{font-size:12px;margin-right:10px;color:#C0392B;background:#FBE9E7;border-radius:6px;padding:2px 8px;display:inline-block}
  .anular-btn{border:none;background:transparent;cursor:pointer;font-size:11px;opacity:.45;margin-right:8px}
  .anular-btn:hover{opacity:1}
  .nota.tipo-anulacion{border-left:3px solid #C0392B}
  .nota.tipo-copia{border-left-color:var(--g3)}
  .modal-bg{position:fixed;inset:0;background:rgba(30,40,46,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.modal-bg{align-items:center}}
  .modal{background:#fff;border-radius:16px 16px 0 0;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:20px}
  @media(min-width:640px){.modal{border-radius:16px}}
  #toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
  .toast{padding:11px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--bad)} .toast.info{background:var(--g1)}
  #spinner{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
  .sp{width:38px;height:38px;border:4px solid var(--g4);border-top-color:var(--tq);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #spinnerTxt{font-weight:600;color:var(--g1)}
  .hidden{display:none!important}
  .login-wrap{max-width:400px;margin:8vh auto}
  .rolchip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--g4);color:var(--g2);text-transform:uppercase}
  .u-tabla{width:100%;border-collapse:collapse;font-size:13px}
  .u-tabla th{text-align:left;color:var(--g2);font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--g4)}
  .u-tabla td{padding:8px;border-bottom:1px solid var(--g4)}

  /* ---------- Conmutador de módulos (suite) ---------- */
  .modswitch{display:flex;gap:2px;background:var(--g4);border-radius:10px;padding:3px}
  .modswitch button{background:transparent;color:var(--g2);font-weight:700;font-size:13px;padding:7px 14px;border-radius:8px}
  .modswitch button:hover{background:#fff;color:var(--g1)}
  .modswitch button.active{background:var(--tq);color:var(--navy)}
  .subnav{padding-top:0}
  .subnav nav{margin-left:0}
  :root{
    --navy:#0B3B5A; --navy2:#12476A; --turq:#1FC8FF; --turq-dim:#0089B0;
    --gris:#5B6E7E; --gris-osc:#3D5A6C; --fondo:#F4F8FB; --peligro:#C0392B; --borde:#E1EAF0;
  }
/* ---------- Estilos FlowTracker (scope .ftui) ---------- */
.ftui select,.ftui input{width:auto}
.ftui textarea{width:100%}
#modal select,#modal input,#modal textarea{width:100%}
.ftui h2, .ftui h3, .ftui .brand{font-family:'Sora',sans-serif}
.ftui select, .ftui input, .ftui textarea{font-family:inherit;font-size:13px;border:1px solid var(--borde);border-radius:8px;padding:7px 9px;background:#fff;color:var(--navy)}
.ftui select:focus, .ftui input:focus, .ftui textarea:focus{outline:2px solid var(--turq);outline-offset:0;border-color:var(--turq)}
.ftui .card{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:14px}
.ftui .muted{color:var(--gris);font-size:12px}
.ftui .fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ftui .btn{background:var(--turq);color:var(--navy);font-weight:600;padding:8px 14px}
.ftui .btn:hover{background:var(--tq-dark);color:#fff}
.ftui .btn.sec{background:#EAF0F3;color:var(--gris-osc)}
.ftui .btn.sec:hover{background:#DCE6EC;color:var(--gris-osc)}
.ftui .btn.mini{padding:4px 9px;font-size:12px}
.ftui .btn.rojo{background:transparent;color:var(--peligro);border:1px solid #E7C4C0}
.ftui .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.ftui .c-mia{background:#FFF3E4;color:#9A5B12}
.ftui .c-cliente{background:#E3F2FD;color:#1663A8}
.ftui .c-cerrado{background:#E7F5EC;color:#1F7A44}
.ftui .punto{width:7px;height:7px;border-radius:50%;background:currentColor}
.ftui .hoy-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ftui .col-titulo{font-family:'Sora';font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.ftui .col-titulo.mia{color:#9A5B12}
.ftui .col-titulo.cli{color:#1663A8}
.ftui .pcard{cursor:pointer;transition:border-color .15s;border-left:4px solid var(--turq)}
.ftui .pcard.personal{border-left-color:#8E6CC8}
.ftui .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;vertical-align:middle}
.ftui .tag.dt{background:#E3F6FD;color:var(--tq-text)}
.ftui .tag.pro{background:#E3F6FD;color:var(--tq-text)}
.ftui .tag.per{background:#F0EAFB;color:#6B4FA3}
.ftui .filtros{display:flex;gap:6px;margin-bottom:14px}
.ftui .filtros button{background:#fff;border:1px solid var(--borde);color:var(--gris-osc);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600}
.ftui .filtros button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ftui .pcard:hover{border-color:var(--turq)}
.ftui .pcard h3{font-size:15px;margin-bottom:2px}
.ftui .pcard .prox{margin-top:8px;padding:8px 10px;background:var(--fondo);border-radius:8px;font-size:13px}
.ftui .pcard .prox b{color:var(--tq-text)}
.ftui .barra{height:5px;background:#E8EDF1;border-radius:3px;margin-top:10px;overflow:hidden}
.ftui .barra i{display:block;height:100%;background:var(--turq)}
.ftui .venc{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--fondo);font-size:13px}
.ftui .venc.tarde{color:var(--peligro);font-weight:600}
.ftui .item-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--fondo)}
.ftui .item-row:last-child{border-bottom:none}
.ftui .item-row .nom{font-size:13.5px}
.ftui .item-row .nom .doc{color:var(--tq-text);font-size:11px;display:block}
.ftui .item-row .ops{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ftui .item-row select{padding:5px 7px;font-size:12px}
.ftui .item-row input[type=date]{padding:4px 6px;font-size:12px}
.ftui .tilde{width:18px;height:18px;border-radius:50%;border:2px solid var(--borde);display:inline-block}
.ftui .tilde.done{background:var(--turq);border-color:var(--turq);position:relative}
.ftui .tilde.done::after{content:'✓';color:var(--navy);font-size:11px;position:absolute;left:3px;top:0}
.ftui .bita{margin-top:14px;border-top:2px solid var(--fondo);padding-top:10px;max-height:260px;overflow:auto}
.ftui .bita .e{padding:6px 4px;border-bottom:1px solid var(--fondo);font-size:12.5px}
.ftui .bita .e .muted{font-size:11px}
#modal{display:none;position:fixed;inset:0;background:rgba(11,59,90,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
#modal .caja{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
#modal h3{margin-bottom:14px}
#modal label{display:block;font-size:12px;color:var(--gris-osc);font-weight:600;margin:10px 0 4px}
#modal select, #modal input, #modal textarea{width:100%}
#modal .acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.ftui .tarea-vacia{text-align:center;color:var(--gris);padding:30px 10px;font-size:13px}
.ftui details.exp{border:1px solid var(--borde);border-radius:10px;margin-bottom:8px;background:#FAFCFD}
.ftui details.exp summary{cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none;font-size:13px}
.ftui details.exp summary::-webkit-details-marker{display:none}
.ftui details.exp summary .cod{font-weight:600;color:var(--tq-text)}
.ftui details.exp[open] summary{border-bottom:1px solid var(--borde)}
.ftui .doc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--fondo);font-size:12.5px;flex-wrap:wrap}
.ftui .doc-row:last-child{border-bottom:none}
.ftui .doc-row select{padding:4px 6px;font-size:12px}
.ftui .seccion{font-family:'Sora';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gris-osc);margin:16px 0 8px}
.ftui .mapa-wrap{overflow-x:auto;margin-top:8px}
.ftui .mapa{border-collapse:collapse;font-size:11px}
.ftui .mapa th{padding:4px 6px;color:var(--gris-osc);font-weight:600;text-align:center;white-space:nowrap}
.ftui .mapa td{padding:3px}
.ftui .mapa td.exp-nom{white-space:nowrap;color:var(--gris-osc);font-weight:600;padding-right:10px;position:sticky;left:0;background:var(--card)}
.ftui .celda{width:22px;height:22px;border-radius:5px;margin:0 auto;cursor:default}
.ftui .celda.vacia{background:var(--fondo);display:flex;align-items:center;justify-content:center;color:#C3CDD5;font-size:12px;font-weight:700}
.ftui .leyenda{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--gris-osc);align-items:center}
.ftui .leyenda .celda{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:4px}
.ftui .modo-btns{display:flex;gap:4px}
.ftui .modo-btns button{background:#EAF0F3;color:var(--gris-osc);padding:5px 11px;font-size:12px;font-weight:600}
.ftui .modo-btns button.on{background:var(--navy);color:#fff}
.ftui .arbol{margin-top:10px}
.ftui .arbol .raiz{display:inline-block;background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-family:'Sora';font-weight:700;font-size:13px}
.ftui .arbol .ramas{margin-left:14px;border-left:3px solid #E6B93C;padding-left:0}
.ftui .arbol .exp-nodo{position:relative;margin:10px 0 10px 22px}
.ftui .arbol .exp-nodo::before{content:'';position:absolute;left:-25px;top:18px;width:22px;height:3px;background:#E6B93C}
.ftui .arbol .exp-caja{display:inline-flex;align-items:center;gap:10px;background:#FFF6DE;border:2px solid #E6B93C;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12.5px;color:#8A6D1D;max-width:100%}
.ftui .arbol .exp-caja b{white-space:nowrap}
.ftui .arbol .exp-caja .desc{color:#A98E3B;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:260px}
.ftui .arbol .exp-caja .caret{font-size:10px}
.ftui .arbol .resumen{display:inline-flex;gap:8px;font-size:11px;font-weight:700}
.ftui .arbol .resumen span{display:inline-flex;align-items:center;gap:3px;color:#fff;border-radius:10px;padding:1px 7px}
.ftui .arbol .hojas{margin-left:16px;border-left:2px solid var(--borde);padding:4px 0 2px}
.ftui .arbol .hoja{position:relative;margin:7px 0 7px 20px}
.ftui .arbol .hoja::before{content:'';position:absolute;left:-22px;top:12px;width:18px;height:2px;background:var(--h-color,#DDE4E9)}
.ftui .arbol .hoja-chip{display:inline-block;color:#fff;border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:600}
@media(max-width:760px){
.ftui .hoy-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">VADOCA<b>.</b> <span class="muted" style="font-size:11px">suite</span></div>
    <div id="modSwitch" class="modswitch hidden">
      <button data-mod="dt" class="active">DocTracker</button>
      <button data-mod="ft">FlowTracker</button>
      <button data-mod="com" id="modCom">Comercial</button>
    </div>
    <span id="userChip" style="margin-left:auto"></span>
  </div>
  <div class="hwrap subnav">
    <nav id="mainNav" class="hidden">
      <button data-view="dashboard" class="active">Tablero</button>
      <button data-view="nuevo" id="navNuevo">+ Nuevo</button>
      <button data-view="poes">Procedimientos</button>
      <button data-view="proyectos">Proyectos</button>
      <button data-view="calidad">Calidad</button>
      <button data-view="indicadores">Indicadores</button>
      <button data-view="auditoria" id="navAudit" class="hidden">Auditoría</button>
      <button data-view="usuarios" id="navUsuarios" class="hidden">Usuarios</button>
      <button data-view="config">Ajustes</button>
    </nav>
    <nav id="ftNav" class="hidden">
      <button id="nHoy" class="active" onclick="ftIr('hoy')">Hoy</button>
      <button id="nProy" onclick="ftIr('proyectos')">Proyectos</button>
      <button id="nTpl" onclick="ftIr('templates')">Templates</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="modal" class="ftui"><div class="caja" id="modalCaja"></div></div>
<div id="toasts"></div>
<div id="spinner" class="hidden"><div class="sp"></div><div id="spinnerTxt">Trabajando…</div></div>

<script>
'use strict';
/* ============================================================
   VADOCA DocTracker v2 — frontend contra backend Railway
   ============================================================ */
const LSKEY = 'vadoca_doctracker_v2_cfg';
const DEFAULTS = {
  backendUrl: 'https://vadoca-doctracker-backend-production.up.railway.app',
  clientes: [ ['000','VADOCA'], ['001','Novocap SA'], ['002','LKM'], ['003','Passair / Conéctalis'] ],
  tiposTrabajo: [
    { key:'GR',  nombre:'Gestión de Riesgo',                    linea:'VDC' },
    { key:'VTA', nombre:'Validación de Técnicas Analíticas',    linea:'VDC' },
    { key:'VPC', nombre:'Validación de Planillas',              linea:'VPC' },
    { key:'CAL', nombre:'Calificaciones',                       linea:'VDC' },
    { key:'VSI', nombre:'Validación de Sistemas Informáticos',  linea:'VSI' },
  ],
  tiposDoc: ['GR','AR','VTA','RU','DQ','IQ','OQ','PQ','IOQ','IV','PMV','PV'],
  estados: ['Borrador','En revisión','Validable','No validable','En ejecución','Enviado a cliente','Aprobado','Entregado','Suspendido','Cancelado'],
  estadosFinales: ['Entregado','Suspendido','Cancelado'],
  paqueteVPC: [ ['RU','P'],['DQ','P'],['IQ','P'],['IQ','I'],['OQ','P'],['OQ','I'],['PQ','P'],['PQ','I'],['IV','I'] ],
  diasEstancado: 7,
};
let CFG = loadCfg();
function loadCfg(){ try{ const s=JSON.parse(localStorage.getItem(LSKEY)||'{}'); const c=Object.assign({},DEFAULTS,s); c.paqueteVPC=DEFAULTS.paqueteVPC; return c;}catch(e){return {...DEFAULTS};} }
function saveCfg(){ localStorage.setItem(LSKEY, JSON.stringify(CFG)); }

let TOKEN = sessionStorage.getItem('vdt_token') || null;
let YO = JSON.parse(sessionStorage.getItem('vdt_yo') || 'null');
let REG = [];        // documentos desde el backend (snake_case)

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const pad = (n,l) => String(n).padStart(l,'0');
function toast(msg,tipo='ok'){ const d=document.createElement('div'); d.className='toast '+tipo; d.textContent=msg; $('#toasts').appendChild(d); setTimeout(()=>d.remove(), tipo==='err'?6000:3500); }
function spin(on,txt){ $('#spinner').classList.toggle('hidden',!on); if(txt)$('#spinnerTxt').textContent=txt; }
function diasDesde(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function fFecha(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
const esLector = () => YO?.rol === 'lector';
const esAdmin  = () => YO?.rol === 'admin';

/* ---------- Llamadas al backend ---------- */
async function api(ruta, opt={}){
  opt.headers = Object.assign({}, opt.headers||{}, TOKEN?{Authorization:'Bearer '+TOKEN}:{});
  if(opt.body && !(opt.body instanceof FormData)){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(opt.body); }
  const r = await fetch(CFG.backendUrl + ruta, opt);
  let data = null; try{ data = await r.json(); }catch(e){}
  if(r.status===401 && ruta!=='/api/login'){ cerrarSesion(); throw new Error('Sesión vencida, entrá de nuevo'); }
  if(!r.ok) throw new Error(data?.error || ('Error '+r.status));
  return data;
}
async function cargarRegistro(){ REG = await api('/api/registro'); try{ PROYS = await api('/api/proyectos'); }catch(e){} }
function cerrarSesion(){ TOKEN=null; YO=null; sessionStorage.clear(); MODULO='dt'; render(); }

function render(){
  const app = $('#app');
  const logueado = !!TOKEN && !YO?.debe_cambiar_clave;
  $('#modSwitch').classList.toggle('hidden', !logueado);
  $('#modCom').classList.toggle('hidden', !esAdmin());
  if(MODULO==='com' && !esAdmin()) MODULO='dt';
  $$('#modSwitch button').forEach(b=>b.classList.toggle('active', b.dataset.mod===MODULO));
  $('#mainNav').classList.toggle('hidden', !logueado || MODULO!=='dt');
  $('#ftNav').classList.toggle('hidden', !logueado || MODULO!=='ft');
  $('#navUsuarios').classList.toggle('hidden', !esAdmin());
  $('#navAudit').classList.toggle('hidden', !esAdmin());
  $('#navNuevo').classList.toggle('hidden', esLector());
  $('#userChip').innerHTML = YO ? `${esc(YO.email)} <span class="rolchip">${esc(YO.rol)}</span> <button class="ghost" onclick="cerrarSesion()" style="font-size:12px">Salir</button>` : '';
  if(!TOKEN){ app.innerHTML = vistaLogin(); return; }
  if(YO?.debe_cambiar_clave){ app.innerHTML = vistaCambiarClave(true); return; }
  if(MODULO==='ft'){ ftRender(); return; }
  if(MODULO==='com'){ renderCom(); return; }
  if(VIEW==='dashboard') app.innerHTML = vistaDashboard();
  else if(VIEW==='nuevo') app.innerHTML = vistaNuevo();
  else if(VIEW==='poes') app.innerHTML = vistaPoes();
  else if(VIEW==='poeFicha') app.innerHTML = vistaPoeFicha();
  else if(VIEW==='calidad') app.innerHTML = vistaCalidad();
  else if(VIEW==='indicadores') app.innerHTML = vistaIndicadores();

  else if(VIEW==='proyectos') app.innerHTML = vistaProyectos();

let FILTRO = {cliente:'',tt:'',estado:'',txt:'',caja:''};
window.filtrarCaja = function(c){ FILTRO.caja = (FILTRO.caja===c ? '' : c); render(); };
function expedientes(){
  const map = new Map();
  for(const r of REG){
    if(!map.has(r.expediente_id)) map.set(r.expediente_id, {id:r.expediente_id, docs:[], desc:r.descripcion, cliente:r.cliente_num, clienteN:r.cliente_nombre, tt:r.tipo_trabajo, carpeta:r.carpeta_drive_url, ult:r.ultimo_movimiento||'', interno:r.codigo_interno_cliente});
    const e = map.get(r.expediente_id); e.docs.push(r);
    if((r.ultimo_movimiento||'') > e.ult) e.ult = r.ultimo_movimiento;
  }
  return [...map.values()].sort((a,b)=> String(b.ult).localeCompare(String(a.ult)));
}
function esActivo(e){ return e.docs.some(d=>!CFG.estadosFinales.includes(d.estado)); }
function esEstancado(e){ return esActivo(e) && ((diasDesde(e.ult)??99) > CFG.diasEstancado); }
function esEntregado(e){ return e.docs.length && e.docs.every(d=>d.estado==='Entregado'); }
function estadoExp(e){
  const activos = e.docs.filter(d=>!CFG.estadosFinales.includes(d.estado));
  if(!activos.length) return {txt: e.docs.every(d=>d.estado==='Entregado')?'Entregado':'Cerrado', cls:'b-gris'};
  const est = [...new Set(activos.map(d=>d.estado))];
  return {txt: est.length===1?est[0]:'Mixto ('+activos.length+' activos)', cls:'b-info'};
}
function vistaDashboard(){
  const all = expedientes();
  const exps = all.filter(e=>{
    if(FILTRO.cliente && e.cliente!==FILTRO.cliente) return false;
    if(FILTRO.tt && !e.id.startsWith(FILTRO.tt+'-')) return false;
    if(FILTRO.estado && !e.docs.some(d=>d.estado===FILTRO.estado)) return false;
    if(FILTRO.txt){ const t=FILTRO.txt.toLowerCase(); if(!((e.id||'')+(e.desc||'')+(e.interno||'')).toLowerCase().includes(t)) return false; }
    if(FILTRO.caja==='activos' && !esActivo(e)) return false;
    if(FILTRO.caja==='estancados' && !esEstancado(e)) return false;
    if(FILTRO.caja==='entregados' && !esEntregado(e)) return false;
    return true;
  });
  const activos = all.filter(esActivo), estancados = all.filter(esEstancado), entregados = all.filter(esEntregado);
  return `
    ${REG.length===0 && esAdmin() ? `<div class="card" style="border-color:var(--warn)">
      <b>Base vacía.</b> Si venís de la versión anterior, importá tus datos una única vez:
      <button class="sec" onclick="migrar()" style="margin-left:8px">Migrar desde la hoja REGISTRO</button></div>`:''}
    <div class="stats">
      <div class="stat ${FILTRO.caja===''?'activa':''}" onclick="filtrarCaja('')"><div class="n">${all.length}</div><div class="l">Expedientes</div></div>
      <div class="stat ${FILTRO.caja==='activos'?'activa':''}" onclick="filtrarCaja('activos')"><div class="n">${activos.length}</div><div class="l">Activos</div></div>
      <div class="stat alerta ${FILTRO.caja==='estancados'?'activa':''}" onclick="filtrarCaja('estancados')"><div class="n">${estancados.length}</div><div class="l">Estancados +${CFG.diasEstancado}d</div></div>
      <div class="stat ${FILTRO.caja==='entregados'?'activa':''}" onclick="filtrarCaja('entregados')"><div class="n">${entregados.length}</div><div class="l">Entregados</div></div>
    </div>
    <div class="filtros">
      <select onchange="FILTRO.cliente=this.value;render()"><option value="">Todos los clientes</option>
        ${CFG.clientes.map(c=>`<option value="${c[0]}" ${FILTRO.cliente===c[0]?'selected':''}>${c[0]} · ${esc(c[1])}</option>`).join('')}</select>
      <select onchange="FILTRO.tt=this.value;render()"><option value="">Todos los tipos</option>
        ${CFG.tiposTrabajo.map(t=>`<option value="${t.key}" ${FILTRO.tt===t.key?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select>
      <select onchange="FILTRO.estado=this.value;render()"><option value="">Todos los estados</option>
        ${CFG.estados.map(s=>`<option ${FILTRO.estado===s?'selected':''}>${s}</option>`).join('')}</select>
      <input placeholder="Buscar…" value="${esc(FILTRO.txt)}" oninput="FILTRO.txt=this.value" onchange="render()">
    </div>
    ${exps.length? exps.map(e=>{
      const st = estadoExp(e), d = diasDesde(e.ult);
      const estancado = d!==null && d>CFG.diasEstancado && st.cls==='b-info';
      return `<div class="exp" onclick="abrirFicha('${esc(e.id)}')">
        <div class="top">
          <span class="codigo">${esc(e.id)}</span>
          <span class="desc">${esc(e.desc)}</span>
          <span class="badge ${st.cls}">${esc(st.txt)}</span>
          ${estancado?`<span class="badge b-bad">⚠ ${d} días sin movimiento</span>`:''}
        </div>
        <div class="meta">
          <span>${esc(e.clienteN)}</span><span>${esc(e.tt)}</span>
          ${e.interno?`<span>Cód. cliente: ${esc(e.interno)}</span>`:''}
          <span>${e.docs.length} doc${e.docs.length>1?'s':''}</span>
          <span>Últ. mov.: ${fFecha(e.ult)}</span>

    }).join('') : `<div class="card" style="text-align:center;color:var(--g2)">No hay expedientes${REG.length?' con esos filtros':''}.</div>`}`;
}

/* ---- Circuitos: template de FlowTracker → selección de documentos del wizard ----
   Interpreta los nombres de ítems: "Protocolo DQ"→DQ-P, "Informe IV"→IV-I,
   "Plan Maestro"→PMV-P, "RU"→RU-P, "GR P"/"GR-I"→GR-P/GR-I, "OQ PI"→ambos. */
function matchTipoDoc(x){
  x = String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
  return (CFG.tiposDoc||[]).find(t=>t.toUpperCase()===x) || null;
}
function circuitoDeTemplate(t){
  const pares = [], ignorados = [];
  for(const item of (t.items||[])){
    const sN = String(item).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
    let m, td;
    if((m = sN.match(/^PROTOCOLO\s+(.+)$/)))      { td = matchTipoDoc(m[1]); if(td){ pares.push([td,'P']); continue; } }
    else if((m = sN.match(/^INFORME\s+(.+)$/)))   { td = matchTipoDoc(m[1]); if(td){ pares.push([td,'I']); continue; } }
    else if(/^PLAN\s+MAESTRO/.test(sN))            { td = matchTipoDoc('PMV'); if(td){ pares.push([td,'P']); continue; } }
    else {
      const p = sN.split(/[\s\-\/]+/);
      td = matchTipoDoc(p[0]);
      if(td){
        const pi = ['P','I','PI'].includes(p[1]) ? p[1] : 'P';
        if(pi==='PI'){ pares.push([td,'P'],[td,'I']); } else pares.push([td,pi]);
        continue;
      }
    }
    ignorados.push(item);
  }
  return { pares, ignorados };
}
window.aplicarCircuito = function(){
  const sel = $('#nCircuito'); if(!sel) return;
  const aviso = $('#nCircuitoAviso');
  if(!sel.value){ if(aviso) aviso.textContent=''; return; }
  const t = (DATA.templates||[]).find(x=>x.id===+sel.value); if(!t) return;
  const { pares, ignorados } = circuitoDeTemplate(t);
  const set = new Set(pares.map(([td,pi])=>td+'|'+pi));
  $$('.pqDoc').forEach(el=>{ el.checked = set.has(el.value); });
  if(aviso) aviso.textContent = `Circuito "${t.nombre}": ${set.size} documento(s) tildados.` +
    (ignorados.length ? ` Ítems sin documento asociado (quedan solo como seguimiento): ${ignorados.join(', ')}.` : '');
};
window.guardarCircuito = async function(){
  const pares = $$('.pqDoc:checked').map(el=>el.value.split('|'));
  if(!pares.length){ toast('Tildá al menos un documento para guardar el circuito','err'); return; }
  const nombre = prompt('Nombre del circuito (ej: "Validación de planillas sin cálculo"):');
  if(!nombre || !nombre.trim()) return;
  const items = pares.map(([td,pi])=> (pi==='I'?'Informe ':'Protocolo ')+td);
  spin(true,'Guardando circuito…');
  try{
    await api('/api/seguimiento/templates',{method:'POST',body:{nombre:nombre.trim(), items}});
    await ftCargar(); spin(false);
    toast('Circuito "'+nombre.trim()+'" guardado: ya aparece en el selector y en FlowTracker');
    render();
  }catch(e){ spin(false); toast(e.message,'err'); }
};

// Máquina de estados (espejo del backend). Los tres legacy no se ofrecen como destino.
const DOC_LEGACY = ['Validable','No validable','Aprobado'];
function docEstadosSel(actual){
  const base = (CFG.estados||[]).filter(s=>!DOC_LEGACY.includes(s));
  return (actual && !base.includes(actual)) ? [actual, ...base] : base;
}
function claseTransicionDoc(viejo, nuevo){
  if(viejo===nuevo) return {tipo:'igual', motivo:false};
  const RANK={'Borrador':0,'En revisión':1,'Validable':1,'No validable':1,'En ejecución':2,'Enviado a cliente':3,'Aprobado':4,'Entregado':5};
  if(['Entregado','Cancelado'].includes(viejo)) return {tipo:'reapertura', motivo:true};
  if(viejo==='Suspendido') return {tipo:'reanudación', motivo:true};
  if(nuevo==='Suspendido'||nuevo==='Cancelado') return {tipo:'lateral', motivo:true};
  const rv=RANK[viejo]??2, rn=RANK[nuevo]??2;
  return rn>rv ? {tipo:'avance', motivo:false} : {tipo:'retroceso', motivo:true};
}
// Devuelve {motivo} si el usuario confirma, o null si cancela.
function pedirCambioEstado(viejo, nuevo){
  const c = claseTransicionDoc(viejo, nuevo);
  if(c.tipo==='igual') return null;
  if(!c.motivo) return confirm(`Confirmar cambio de estado:\n\n${viejo}  →  ${nuevo}`) ? {motivo:''} : null;
  const etiq = {reapertura:'REAPERTURA de un estado terminal', 'reanudación':'reanudación desde Suspendido', lateral:'pase a estado lateral', retroceso:'RETROCESO en el circuito'}[c.tipo];
  const m = prompt(`${viejo}  →  ${nuevo}\n\nEsto es ${etiq}: el motivo es obligatorio y queda en la bitácora.\n(A futuro acá va el nº de desvío / nota aclaratoria)\n\nMotivo:`);
  if(m===null) return null;
  if(!m.trim()){ alert('El motivo es obligatorio para este cambio.'); return null; }
  return {motivo:m.trim()};
}

// Ingesta inteligente: detecta códigos tipo XLS089 en el nombre del archivo y los cruza
// con los adjuntos de este expediente y de los demás. Devuelve true si se puede seguir.
async function verificarArchivos(files){
  const codigosDe = s => [...new Set((String(s).toUpperCase().match(/XLS\s?-?\d{2,4}/g)||[]).map(x=>x.replace(/[\s-]/g,'')))];
  const propios = new Set();
  for(const n of FICHA.bit) for(const a of (n.adjuntos||[])) if(!a.anula) codigosDe(a.nombre).forEach(c=>propios.add(c));
  for(const f of files){
    for(const cod of codigosDe(f.name)){
      if(propios.has(cod)) continue;                       // ya conocido en este expediente: OK
      let ajenos = [];
      try{ ajenos = (await api('/api/adjuntos/donde?q='+encodeURIComponent(cod))).filter(x=>x.expediente_id!==FICHA.id); }catch(_){}
      const avisos = [];
      if(propios.size) avisos.push(`Este expediente ya tiene archivos de: ${[...propios].join(', ')}.`);
      if(ajenos.length) avisos.push(`${cod} ya aparece en: ${ajenos.map(x=>x.expediente_id).join(', ')}.`);
      if(!avisos.length) continue;                         // código nuevo y sin conflicto: OK
      const seguir = confirm(`⚠ Posible archivo en expediente equivocado\n\nArchivo: ${f.name}\nExpediente actual: ${FICHA.id}\n\n${avisos.join('\n')}\n\n¿Subir igual a ${FICHA.id}?`);
      if(!seguir) return false;
    }
  }
  return true;
}

const POE_ESTADOS = ['Borrador','En revisión','Aprobado','Vigente','Obsoleto'];
let POE_RELS = [];
async function cargarPoes(){ [POES, POE_RELS] = await Promise.all([api('/api/procedimientos'), api('/api/poe-relaciones')]); }
function relacionadosDe(base){
  const s = new Set();
  for(const r of POE_RELS){ if(r.base===base) s.add(r.relacionado); if(r.relacionado===base) s.add(r.base); }
  return [...s].sort();
}
function tituloDe(base){ const p = POES.find(x=>x.codigo_base===base); return p?p.titulo:''; }
function poesBase(){
  const map = new Map();
  for(const p of POES){
    if(!map.has(p.codigo_base)) map.set(p.codigo_base, {base:p.codigo_base, titulo:p.titulo, versiones:[], carpeta:p.carpeta_drive_url, ult:p.ultimo_movimiento||''});
    const e = map.get(p.codigo_base); e.versiones.push(p);
    if((p.ultimo_movimiento||'') > e.ult) e.ult = p.ultimo_movimiento;
  }
  for(const e of map.values()){
    e.versiones.sort((a,b)=>parseInt(b.version,10)-parseInt(a.version,10));
    e.vigente = e.versiones.find(v=>v.estado==='Vigente') || null;
  }
  return [...map.values()].sort((a,b)=>a.base.localeCompare(b.base));
}
function diasAlVenc(p){ if(!p?.fecha_vencimiento) return null; return Math.ceil((new Date(p.fecha_vencimiento+'T00:00:00').getTime()-Date.now())/86400000); }

        <span class="badge ${d<0?'b-bad':d<=7?'b-bad':'b-info'}">${d<0?('VENCIDO hace '+(-d)+' días'):('vence en '+d+' día'+(d===1?'':'s'))}</span>
        ${esLector()?'':`<button class="ghost" onclick="event.stopPropagation();nuevaVersionPoe('${esc(b.base)}')">Iniciar revisión</button>`}

  </div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="flex:1">Procedimientos VADOCA</h2>
      ${esLector()?'':`<button onclick="modalNuevoPoe()">+ Nuevo procedimiento</button>`}

    ${bases.length? `<table class="docs-tabla" style="margin-top:12px"><thead><tr><th>Código</th><th>Título</th><th>Versión vigente</th><th>Vence</th><th>Versiones</th></tr></thead><tbody>

          <td>${b.vigente?.fecha_vencimiento? esc(b.vigente.fecha_vencimiento)+(d!==null&&d<=30?` <span class="badge ${d<0||d<=7?'b-bad':'b-info'}">${d<0?'vencido':d+'d'}</span>`:'') :'—'}</td>

}

function pintarVersionesPresu(){

  if(!PRESU_VERSIONES.length){
    el.innerHTML = '<p class="muted">Todavía no tiene ninguna versión cargada (se sigue manejando con el Word subido a mano en la bitácora). Creá la primera versión para empezar a usar ítems/condiciones estructurados y la plantilla de impresión.</p>';

  }
  const max = Math.max(...PRESU_VERSIONES.map(v=>v.numero));
  el.innerHTML = `<table class="docs-tabla"><thead><tr><th>Versión</th><th>Moneda</th><th>Total</th><th>Estado</th><th>Autor</th><th>Fecha</th><th></th></tr></thead><tbody>
    ${PRESU_VERSIONES.map(v=>`<tr>
      <td>${v.numero}${v.numero===max?' <span class="badge b-info">vigente</span>':''}</td>
      <td>${esc(v.moneda)}</td>
      <td>${Number(v.total).toLocaleString('es-AR',{minimumFractionDigits:2})}</td>
      <td>${v.bloqueada?'<span class="badge b-gris">Bloqueada (emitida)</span>':'<span class="badge b-info">Editable (Borrador)</span>'}</td>
      <td class="muted">${esc(v.autor)}</td>
      <td class="muted">${fFecha(v.creado)}</td>
      <td><button class="ghost" onclick="imprimirPresu('${esc(PRESU.codigo)}', ${v.numero})">🖨 Imprimir</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}
window.imprimirPresu = async function(codigo, numero){
  spin(true,'Generando impresión…');
  try{
    const r = await fetch(CFG.backendUrl+'/api/presupuestos/'+encodeURIComponent(codigo)+'/imprimir'+(numero?('?version='+numero):''),
      { headers: TOKEN?{Authorization:'Bearer '+TOKEN}:{} });
    if(!r.ok){ let d=null; try{ d=await r.json(); }catch(e){} throw new Error(d?.error || ('Error '+r.status)); }
    const html = await r.text();
    const blob = new Blob([html], {type:'text/html'});
    window.open(URL.createObjectURL(blob), '_blank');
    spin(false);
  }catch(e){ spin(false); toast(e.message,'err'); }
};
function leerItemsVersion(){
  return $$('.pvItemRow').map(row=>{
    const descripcion = row.querySelector('.pvDesc').value.trim();
    const cantStr = row.querySelector('.pvCant').value;
    const precioStr = row.querySelector('.pvPrecio').value;
    const item = { descripcion };
    if(cantStr!=='') item.cantidad = Number(cantStr);
    if(precioStr!=='') item.precio_unitario = Number(precioStr);
    if(item.cantidad!==undefined && item.precio_unitario!==undefined) item.importe = Math.round(item.cantidad*item.precio_unitario*100)/100;
    return item;
  }).filter(it=>it.descripcion);
}
window.agregarItemVersion = function(it){
  it = it || {};
  const row = document.createElement('div');
  row.className = 'pvItemRow';
  row.style.cssText = 'border:1px solid var(--g4);border-radius:8px;padding:10px;margin-top:8px';
  row.innerHTML = `
    <input class="pvDesc" placeholder="Descripción del ítem" value="${esc(it.descripcion||'')}">
    <div class="row" style="margin-top:6px">
      <div><input class="pvCant" type="number" step="0.01" placeholder="Cantidad (opcional)" value="${it.cantidad??''}"></div>
      <div><input class="pvPrecio" type="number" step="0.01" placeholder="Precio unitario (opcional)" value="${it.precio_unitario??''}"></div>
    </div>
    <p style="margin-top:6px"><button type="button" class="ghost" style="font-size:12px;padding:4px 8px" onclick="this.closest('.pvItemRow').remove()">✕ Quitar ítem</button></p>`;
  $('#pvItems').appendChild(row);
};
window.recalcularVersionPresu = function(){
  const items = leerItemsVersion();
  const subtotal = items.reduce((a,it)=>a+(it.importe||0),0);
  $('#pvSubtotal').value = subtotal.toFixed(2);
  const descPct = Number($('#pvDescPct').value)||0;
  let descMonto = Number($('#pvDescMonto').value)||0;
  if(descPct && !descMonto){ descMonto = Math.round(subtotal*descPct/100*100)/100; $('#pvDescMonto').value = descMonto.toFixed(2); }
  const iva = $('#pvIvaDisc').checked ? (Number($('#pvIvaMonto').value)||0) : 0;
  $('#pvTotal').value = (subtotal - descMonto + iva).toFixed(2);
  toast('Montos recalculados desde los ítems — revisalos antes de guardar');
};

  try{ PROY.bit = await api('/api/expedientes/'+encodeURIComponent(codigo)+'/bitacora'); pintarBitacoraGen('bitacoraProy', PROY.bit); }
  catch(e){ $('#bitacoraProy').innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
};
function vistaProyFicha(){
  const p = PROYS.find(x=>x.codigo===PROY.codigo);
  if(!p) return `<div class="card">Proyecto no encontrado. <button class="ghost" onclick="VIEW='proyectos';render()">← Volver</button></div>`;
  const exps = [...new Set(REG.filter(r=>r.proyecto===p.codigo).map(r=>r.expediente_id))];
  const ro = esLector();
  return `
  <p><button class="ghost" onclick="VIEW='proyectos';render()">← Volver a proyectos</button></p>
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="codigo" style="font-size:15px">${esc(p.codigo)}</span>
      <h2 style="flex:1;min-width:200px;font-size:17px">${esc(p.nombre)}</h2>
      ${p.carpeta_drive_url?`<a href="${esc(p.carpeta_drive_url)}" target="_blank" rel="noopener"><button class="sec">Abrir en Drive</button></a>`:''}
    </div>
    <div class="muted" style="margin-top:8px">${esc(p.cliente_nombre||'')}
      · Presupuestos: ${(p.presupuestos||[]).map(x=>`<span class="codigo" style="font-size:11px">${esc(x)}</span>`).join(' ')||'—'}
      ${esAdmin()?` <button class="ghost" style="font-size:12px" onclick="modalPresusProy()">Editar</button>`:''}
    </div>
    ${ro?'':`<p style="margin-top:10px">Estado:
      <select style="width:auto" onchange="actualizarProy({estado:this.value})">
        ${['Activo','Pausado','Cerrado'].map(s=>`<option ${p.estado===s?'selected':''}>${s}</option>`).join('')}</select></p>`}
    <label>Alcance y cronología (informativo)</label>
    <textarea id="pjAlcanceEdit" ${ro?'disabled':''}>${esc(p.alcance||'')}</textarea>
    ${ro?'':`<p style="margin-top:8px"><button class="sec" onclick="actualizarProy({alcance:$('#pjAlcanceEdit').value})">Guardar alcance</button></p>`}
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="flex:1">Expedientes del proyecto (${exps.length})</h3>
      ${!ro && (p.presupuestos||[]).length?`<button class="sec" onclick="autovincular()">Autovincular por presupuesto</button>`:''}
    </div>
    ${exps.length? exps.map(id=>{
      const docs = REG.filter(r=>r.expediente_id===id);
      const activos = docs.filter(d=>!CFG.estadosFinales.includes(d.estado)).length;
      return `<div class="exp" onclick="abrirFicha('${esc(id)}')" style="margin-top:8px">
        <div class="top"><span class="codigo">${esc(id)}</span><span class="desc">${esc(docs[0].descripcion)}</span>
        <span class="badge ${activos?'b-info':'b-gris'}">${activos?activos+' activos':'cerrado'}</span></div></div>`;
    }).join('') : '<p class="muted" style="margin-top:8px">Sin expedientes vinculados. Vinculalos al crearlos, desde su ficha, o con la autovinculación por presupuesto.</p>'}
  </div>
  ${ro?'':`<div class="card">
    <h3>Agregar nota a la bitácora</h3>
    <textarea id="pjNotaTxt" placeholder="Hitos, reuniones, acuerdos con el cliente…"></textarea>
    <label>Adjuntar archivos (opcional)</label><input type="file" id="pjNotaFiles" multiple>
    <p style="margin-top:12px"><button onclick="guardarNotaProy()">Guardar en bitácora</button></p>
  </div>`}
  <div class="card"><h3>Bitácora</h3><div id="bitacoraProy" style="margin-top:10px"><p class="muted">Cargando…</p></div></div>`;
}
window.actualizarProy = async function(body){
  spin(true,'Guardando…');
  try{
    await api('/api/proyectos/'+encodeURIComponent(PROY.codigo)+'/actualizar',{method:'POST',body});
    await cargarProys(); PROY.bit = await api('/api/expedientes/'+encodeURIComponent(PROY.codigo)+'/bitacora');
    spin(false); toast('Proyecto actualizado'); render(); pintarBitacoraGen('bitacoraProy', PROY.bit);
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.modalPresusProy = function(){
  const p = PROYS.find(x=>x.codigo===PROY.codigo);
  const actuales = new Set(p.presupuestos||[]);
  modal(`<h3>Presupuestos del proyecto</h3>
    <div style="max-height:45vh;overflow-y:auto;margin-top:10px">
    ${PRESUS.length? PRESUS.map(pr=>`<label style="display:flex;align-items:center;gap:8px;margin:5px 0;font-weight:400">
      <input type="checkbox" class="ppChk" value="${esc(pr.codigo)}" ${actuales.has(pr.codigo)?'checked':''} style="width:auto">
      <span class="codigo">${esc(pr.codigo)}</span> <span class="muted" style="font-size:12px">${esc(pr.descripcion)} — ${esc(pr.estado)}</span></label>`).join('')
    : '<p class="muted">No hay presupuestos cargados.</p>'}
    </div>
    <p style="margin-top:14px;display:flex;gap:10px"><button onclick="guardarPresusProy()">Guardar</button><button class="sec" onclick="cerrarModal()">Cancelar</button></p>`);
};
window.guardarPresusProy = async function(){
  const lista = $$('.ppChk:checked').map(el=>el.value);
  cerrarModal(); spin(true,'Vinculando…');
  try{
    await api('/api/proyectos/'+encodeURIComponent(PROY.codigo)+'/presupuestos',{method:'POST',body:{presupuestos:lista}});
    await cargarProys(); PROY.bit = await api('/api/expedientes/'+encodeURIComponent(PROY.codigo)+'/bitacora');
    spin(false); toast('Presupuestos vinculados'); render(); pintarBitacoraGen('bitacoraProy', PROY.bit);
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.autovincular = async function(){
  spin(true,'Autovinculando expedientes…');
  try{
    const d = await api('/api/proyectos/'+encodeURIComponent(PROY.codigo)+'/autovincular',{method:'POST'});
    await cargarRegistro(); await cargarProys();
    spin(false); toast(d.expedientes+' expediente(s) vinculados'); render(); 
    PROY.bit = await api('/api/expedientes/'+encodeURIComponent(PROY.codigo)+'/bitacora'); pintarBitacoraGen('bitacoraProy', PROY.bit);
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.guardarNotaProy = async function(){
  const txt = $('#pjNotaTxt').value.trim();
  const files = [...($('#pjNotaFiles').files||[])];
  if(!txt && !files.length){ toast('Escribí algo o adjuntá un archivo','err'); return; }
  const fd = new FormData(); fd.append('texto',txt); fd.append('subcarpeta','02_evidencias');
  for(const f of files) fd.append('archivos', f, f.name);
  spin(true,'Guardando…');
  try{
    await api('/api/proyectos/'+encodeURIComponent(PROY.codigo)+'/notas',{method:'POST',body:fd});
    await cargarProys(); PROY.bit = await api('/api/expedientes/'+encodeURIComponent(PROY.codigo)+'/bitacora');
    spin(false); toast('Nota guardada'); render(); pintarBitacoraGen('bitacoraProy', PROY.bit);
  }catch(e){ spin(false); toast(e.message,'err'); }
};

/* ============================================================
   INDICADORES (PGC-003: cada indicador debe conducir a una decisión)
   ============================================================ */
function vistaIndicadores(){
  api('/api/indicadores').then(d=>{ if(VIEW==='indicadores') pintarIndicadores(d); }).catch(e=>{ $('#indBody') && ($('#indBody').innerHTML='<p class="muted">'+esc(e.message)+'</p>'); });
  return `<div class="card"><h2>Indicadores del SGC</h2>
    <p class="muted" style="margin-top:4px">Calculados en vivo sobre el registro. Referencia: PGC-003 — Seguimiento y Evaluación del SGC.</p>
    <div id="indBody" style="margin-top:12px"><p class="muted">Calculando…</p></div></div>`;
}
function barra(pct, color){ return `<div style="background:#E4E9ED;border-radius:4px;height:14px;overflow:hidden"><div style="width:${Math.min(100,pct)}%;height:100%;background:${color||'var(--tq)'}"></div></div>`; }
function pintarIndicadores(d){
  const el = $('#indBody'); if(!el) return;
  const kpi = (v,lab,det)=>`<div class="kpi" style="cursor:default"><div class="num">${v}</div><div class="lab">${lab}</div>${det?`<div class="muted" style="font-size:11px;margin-top:2px">${det}</div>`:''}</div>`;
  const totTipo = d.docs.porTipo.reduce((a,x)=>a+ +x.n,0)||1;
  const maxSerie = Math.max(...d.docs.serie12.map(x=>+x.n),1);
  el.innerHTML = `
  <div class="kpis" style="margin-bottom:14px">
    ${kpi(d.docs.mes,'Docs este mes')}
    ${kpi(d.docs.anio,'Docs este año')}
    ${kpi(d.expedientes.activos,'Expedientes activos', d.expedientes.estancados>0?('⚠ '+d.expedientes.estancados+' estancados'):'sin estancados')}
    ${kpi(d.docs.cicloPromedioDias??'—','Días alta→entrega','promedio de '+d.docs.cicloMuestra+' docs')}
    ${kpi(d.poes.vigentes,'POEs vigentes', (+d.poes.vencidos?('⚠ '+d.poes.vencidos+' vencidos'):(+d.poes.por_vencer?(d.poes.por_vencer+' por vencer'):'al día')))}
    ${kpi(d.proyectos.activos,'Proyectos activos', d.proyectos.cerrados+' cerrados · '+(d.proyectos.promDocsPorProyecto??'—')+' docs/proyecto prom.')}
  </div>
  <div class="row">
    <div class="card" style="margin:0">
      <h3>Documentos por tipo (${new Date().getFullYear()})</h3>
      ${d.docs.porTipo.length? d.docs.porTipo.map(x=>`<div style="display:grid;grid-template-columns:60px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:13px">
        <span class="codigo" style="font-size:11px">${esc(x.t)}</span>${barra(100*x.n/ +d.docs.porTipo[0].n)}<span class="muted">${x.n} (${Math.round(100*x.n/totTipo)}%)</span></div>`).join('')
      : '<p class="muted">Sin documentos este año.</p>'}
    </div>
    <div class="card" style="margin:0">
      <h3>Altas por mes (últimos 12)</h3>
      ${d.docs.serie12.map(x=>`<div style="display:grid;grid-template-columns:60px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font-size:13px">
        <span class="muted">${esc(x.m)}</span>${barra(100*x.n/maxSerie)}<span class="muted">${x.n}</span></div>`).join('') || '<p class="muted">Sin datos.</p>'}
    </div>
  </div>
  ${d.comercial?`<div class="card" style="margin-top:14px">
    <h3>Comercial (solo administradores)</h3>
    <div class="kpis" style="margin-top:10px">
      ${kpi(d.comercial.emitidos,'Presupuestos emitidos')}
      ${kpi(d.comercial.aceptados,'Aceptados','tasa: '+(d.comercial.emitidos>0?Math.round(100*d.comercial.aceptados/d.comercial.emitidos):0)+'%')}
      ${kpi(d.comercial.pipeline,'En espera (Enviado)', d.comercial.pipeline>0?'¡a perseguir!':'')}
      ${kpi(d.comercial.rechazados+ +d.comercial.vencidos,'Rechazados + vencidos')}
      ${d.comercial.montosAceptadosAnio.map(m=>kpi((+m.t).toLocaleString('es-AR'),'Aceptado '+esc(m.moneda)+' '+new Date().getFullYear())).join('')}
    </div>
  </div>`:''}`;
}

let AUD = [];
function vistaAuditoria(){
  setTimeout(cargarAuditoria, 50);
  return `<div class="card">
    <h2>Auditoría global del sistema</h2>
    <p class="muted" style="margin-top:4px">Eventos de todos los módulos, la administración y los accesos, en orden cronológico. Máximo 500 resultados por consulta.</p>
    <div class="row" style="margin-top:12px">
      <div><label>Módulo</label><select id="auModulo" onchange="cargarAuditoria()">
        <option value="">Todos</option><option>Expedientes</option><option>Procedimientos</option><option>Presupuestos</option><option>Proyectos</option><option>Administración</option><option>Accesos</option></select></div>
      <div><label>Usuario</label><input id="auAutor" placeholder="parte del email" onchange="cargarAuditoria()"></div>
    </div>
    <div class="row">
      <div><label>Buscar en texto/código</label><input id="auQ" placeholder="Ej: PGC-001, corrección, 0080…" onchange="cargarAuditoria()"></div>
      <div class="row" style="gap:8px"><div><label>Desde</label><input type="date" id="auDesde" onchange="cargarAuditoria()"></div>
      <div><label>Hasta</label><input type="date" id="auHasta" onchange="cargarAuditoria()"></div></div>
    </div>
    <p style="margin-top:10px"><button class="sec" onclick="exportarAuditoria()">🖨 Exportar / imprimir</button></p>
    <div id="audLista" style="margin-top:12px"><p class="muted">Cargando…</p></div>
  </div>`;
}
window.cargarAuditoria = async function(){
  const p = new URLSearchParams();
  if($('#auModulo').value) p.set('modulo',$('#auModulo').value);
  if($('#auAutor').value.trim()) p.set('autor',$('#auAutor').value.trim());
  if($('#auQ').value.trim()) p.set('q',$('#auQ').value.trim());
  if($('#auDesde').value) p.set('desde',$('#auDesde').value);
  if($('#auHasta').value) p.set('hasta',$('#auHasta').value);
  try{
    AUD = await api('/api/auditoria?'+p.toString());
    const el = $('#audLista'); if(!el) return;
    el.innerHTML = AUD.length? `<table class="docs-tabla"><thead><tr><th>Fecha/hora</th><th>Módulo</th><th>Clave</th><th>Usuario</th><th>Tipo</th><th>Detalle</th></tr></thead><tbody>
      ${AUD.map(a=>`<tr>
        <td style="white-space:nowrap">${fFecha(a.ts)}</td>
        <td><span class="badge ${a.modulo==='Accesos'?'b-gris':a.modulo==='Administración'?'b-bad':'b-info'}" style="font-size:10px">${esc(a.modulo)}</span></td>
        <td>${a.clave!=='ADMINISTRACIÓN'&&a.clave!=='ACCESOS'?`<span class="codigo" style="font-size:11px">${esc(a.clave)}</span>`:''}</td>
        <td class="muted" style="font-size:11px">${esc((a.autor||'').split('@')[0])}</td>
        <td class="muted" style="font-size:11px">${esc(a.tipo)}</td>
        <td style="font-size:12px">${esc(a.texto)}</td></tr>`).join('')}</tbody></table>
      <p class="muted" style="margin-top:8px">${AUD.length} evento(s)${AUD.length===500?' — hay más: acotá los filtros':''}</p>`
    : '<p class="muted">Sin eventos con esos filtros.</p>';
  }catch(e){ $('#audLista').innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
};
window.exportarAuditoria = function(){
  if(!AUD.length){ toast('No hay eventos para exportar','err'); return; }
  const w = window.open('','_blank');
  w.document.write(`<html><head><title>Auditoría VADOCA DocTracker</title><style>
    body{font-family:Arial,sans-serif;font-size:11px;margin:24px}h1{font-size:16px}
    table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
    th{background:#eee}@media print{button{display:none}}</style></head><body>
    <h1>VADOCA DocTracker — Auditoría global del sistema</h1>
    <p>Generado: ${new Date().toLocaleString('es-AR')} · Usuario: ${esc(YO.email)} · ${AUD.length} evento(s)</p>
    <button onclick="window.print()">Imprimir / Guardar PDF</button>
    <table><thead><tr><th>Fecha/hora</th><th>Módulo</th><th>Clave</th><th>Usuario</th><th>Tipo</th><th>Detalle</th></tr></thead><tbody>
    ${AUD.map(a=>`<tr><td>${fFecha(a.ts)}</td><td>${esc(a.modulo)}</td><td>${esc(a.clave)}</td><td>${esc(a.autor)}</td><td>${esc(a.tipo)}</td><td>${esc(a.texto)}</td></tr>`).join('')}
    </tbody></table></body></html>`);
  w.document.close();
};

async function cargarUsuarios(){
  try{
    const us = await api('/api/usuarios');
    $('#uLista').innerHTML = `<table class="u-tabla"><tr><th>Email</th><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr>
      ${us.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.nombre)}</td><td><span class="rolchip">${esc(u.rol)}</span></td>
        <td>${u.activo?'<span class="badge b-ok">Activo</span>':'<span class="badge b-gris">Inactivo</span>'}</td>
        <td style="white-space:nowrap">
          <button class="ghost" onclick="blanquear(${u.id},'${esc(u.email)}')">Blanquear clave</button>
          <button class="ghost" onclick="toggleUsuario(${u.id},${!u.activo})">${u.activo?'Desactivar':'Activar'}</button>
        </td></tr>`).join('')}</table>`;
    const log = await api('/api/admin/bitacora');
    $('#uLog').innerHTML = log.length? log.map(l=>`<div class="nota"><div class="nts">${fFecha(l.ts)} · ${esc(l.autor)} <span class="hashchip">⛓ ${esc((l.hash||'').slice(0,10))}</span></div><div class="ntx">${esc(l.accion)}${l.detalle?': '+esc(l.detalle):''}</div></div>`).join('') : '<p class="muted">Sin acciones registradas.</p>';
  }catch(e){ toast(e.message,'err'); }
}
window.crearUsuario = async function(){
  spin(true,'Creando usuario…');
  try{
    await api('/api/usuarios',{method:'POST',body:{email:$('#uEmail').value,nombre:$('#uNombre').value,rol:$('#uRol').value,password:$('#uPass').value}});
    spin(false); toast('Usuario creado'); render();
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.blanquear = async function(id,email){
  const p = prompt('Clave temporal nueva para '+email+' (se la pasás por un canal seguro; la cambia al entrar):');
  if(!p) return;
  spin(true,'Blanqueando…');
  try{ await api('/api/usuarios/'+id+'/blanquear',{method:'POST',body:{password:p}}); spin(false); toast('Clave blanqueada'); render(); }
  catch(e){ spin(false); toast(e.message,'err'); }
};
window.toggleUsuario = async function(id,activo){
  spin(true,'Actualizando…');
  try{ await api('/api/usuarios/'+id+'/estado',{method:'POST',body:{activo}}); spin(false); render(); }
  catch(e){ spin(false); toast(e.message,'err'); }
};

/* ----- Utilidades UI ----- */
function modal(html){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) cerrarModal(); });
  document.body.appendChild(bg); }
window.cerrarModal = ()=> $('#modalBg')?.remove();
function postRender(){
  $$('#mainNav button').forEach(b=>b.classList.toggle('active', b.dataset.view===VIEW || (VIEW==='ficha'&&b.dataset.view==='dashboard')));
  if(VIEW==='nuevo') onTTChange();
  if(VIEW==='ficha') document.addEventListener('paste', onPaste);
  else document.removeEventListener('paste', onPaste);
}
function onPaste(ev){
  const items = [...(ev.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));
  if(!items.length) return;
  for(const it of items){
    const f = it.getAsFile();
    const nombre = 'captura_'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';
    PEGADOS.push(new File([f], nombre, {type:f.type}));
  }
  $('#pegados').innerHTML = PEGADOS.map(f=>`<span class="muted" style="margin-right:10px">🖼 ${esc(f.name)}</span>`).join('');
  toast(items.length+' captura(s) lista(s) para adjuntar','info');
}
$$('#mainNav button').forEach(b=>b.addEventListener('click',()=>{ VIEW=b.dataset.view; render(); }));

/* ============================================================
   CALIDAD — Eventos y CAPA (PGC-002), Control de cambios (PGC-001 5.7),
   Indicadores del SGC (PGC-003) y rechazos de entregables (PCP-005 5.5)
   ============================================================ */
const DESV_TIPO = {nc_menor:'NC menor',nc_mayor:'NC mayor',observacion:'Observación',queja:'Queja',reclamo:'Reclamo'};
const DESV_EST  = {abierto:'Abierto',en_analisis:'En análisis',correccion_implementada:'Corrección implementada',cerrado:'Cerrado',reactivado:'Reactivado'};
const CAMB_EST  = {solicitado:'Solicitado',aprobado:'Aprobado',rechazado:'Rechazado',implementado:'Implementado · en verificación',cerrado:'Cerrado'};
const CAPA_EST  = {abierta:'Abierta',en_seguimiento:'En seguimiento',cerrada:'Cerrada',reactivada:'Reactivada'};
let CAL = {tab:'eventos', filtro:'abiertos', sel:null, desvios:[], det:null, capa:null, cambios:[], cdet:null, kpi:null, kcfg:null, rech:[], periodo:null};

const bdg = (t,c)=>`<span class="badge ${c||'b-gris'}">${esc(t)}</span>`;
const calPost = (p,b)=>api(p,{method:'POST',body:b||{}});
const calEstCls = e => ({cerrado:'b-ok',cerrada:'b-ok',aprobado:'b-ok',rechazado:'b-bad',reactivado:'b-bad',reactivada:'b-bad'}[e]||'b-info');
function trimestreActual(){ const d=new Date(); return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1); }
function ultimosTrimestres(n){ const out=[]; let y=new Date().getFullYear(), q=Math.floor(new Date().getMonth()/3)+1;
  for(let i=0;i<n;i++){ out.push(y+'-Q'+q); q--; if(q===0){q=4;y--;} } return out; }

/* Formulario modal genérico: campos [{id,label,type,opts,req,ph,val}] */
function calForm(titulo, campos, cta, onOk, nota){
  modal(`<h3>${esc(titulo)}</h3>${nota?`<p class="muted" style="margin:6px 0 2px">${nota}</p>`:''}
    ${campos.map(c=>{
      const id='cf_'+c.id;
      if(c.type==='check') return `<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--g1)"><input id="${id}" type="checkbox" style="width:auto"> ${esc(c.label)}</label>`;
      return `<label>${esc(c.label)}${c.req?' *':''}</label>` + (
        c.type==='select' ? `<select id="${id}">${c.opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>` :
        c.type==='textarea' ? `<textarea id="${id}" placeholder="${esc(c.ph||'')}">${esc(c.val||'')}</textarea>` :
        `<input id="${id}" type="${c.type||'text'}" value="${esc(c.val||'')}" placeholder="${esc(c.ph||'')}">`);
    }).join('')}
    <p style="margin-top:14px;display:flex;gap:10px"><button id="cfOk">${esc(cta)}</button><button class="sec" onclick="cerrarModal()">Cancelar</button></p>`);
  $('#cfOk').onclick = async ()=>{
    const v={};
    for(const c of campos){ const el=$('#cf_'+c.id); v[c.id]= c.type==='check'? el.checked : el.value.trim();
      if(c.req && !v[c.id]){ toast('Falta: '+c.label,'err'); return; } }
    cerrarModal(); spin(true,'Guardando…');
    try{ await onOk(v); spin(false); }catch(e){ spin(false); toast(e.message,'err'); }
  };
}

function vistaCalidad(){
  setTimeout(calCargar,0);
  return `<div class="card" style="padding:10px 14px"><div class="filtros" style="margin:0">
    ${[['eventos','Eventos y CAPA'],['cambios','Control de cambios'],['kpis','Indicadores del SGC']]
      .map(([k,t])=>`<button class="${CAL.tab===k?'':'sec'}" onclick="calTab('${k}')">${t}</button>`).join('')}
  </div></div><div id="calBody"><p class="muted" style="padding:12px">Cargando…</p></div>`;
}
function calTab(k){ CAL.tab=k; CAL.sel=null; render(); }
function calVolver(){ CAL.sel=null; calCargar(); }
async function calCargar(){
  const el=$('#calBody'); if(!el||VIEW!=='calidad') return;
  const tab=CAL.tab, sel=CAL.sel;
  try{
    if(tab==='eventos'){
      if(sel){ CAL.det=await api('/api/desvios/'+sel); try{ CAL.capa=(await api('/api/desvios/'+sel+'/capa')).capa; }catch(e){ CAL.capa=null; } }
      else CAL.desvios=(await api('/api/desvios')).desvios;
    } else if(tab==='cambios'){
      if(sel) CAL.cdet=await api('/api/cambios/'+sel);
      else CAL.cambios=(await api('/api/cambios')).cambios;
    } else {
      CAL.periodo = CAL.periodo || trimestreActual();
      const [k,c,r] = await Promise.all([api('/api/kpi-sgc?periodo='+CAL.periodo), api('/api/kpi-sgc/config'), api('/api/rechazos')]);
      CAL.kpi=k; CAL.kcfg=c; CAL.rech=r.rechazos;
    }
    if(tab!==CAL.tab || sel!==CAL.sel) return;
    calPintar();
  }catch(e){ el.innerHTML=`<div class="card"><p class="muted">${esc(e.message)}</p></div>`; }
}
function calPintar(){
  const el=$('#calBody'); if(!el) return;
  el.innerHTML = CAL.tab==='eventos' ? (CAL.sel?htmlDesvioDet():htmlDesvioLista())
               : CAL.tab==='cambios' ? (CAL.sel?htmlCambioDet():htmlCambioLista()) : htmlKpis();
}
const calAccionOk = async (fn, msg)=>{ spin(true,'Guardando…'); try{ await fn(); spin(false); if(msg) toast(msg); await calCargar(); }catch(e){ spin(false); toast(e.message,'err'); } };

/* ---------- EVENTOS ---------- */
function htmlDesvioLista(){
  const f=CAL.filtro, hoy=hoyISO();
  const lista = CAL.desvios.filter(d=> f==='todos' || (f==='abiertos'?d.estado!=='cerrado':d.estado==='cerrado'));
  return `<div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <h2 style="flex:1">Eventos de calidad</h2>
      ${[['abiertos','Abiertos'],['cerrados','Cerrados'],['todos','Todos']].map(([k,t])=>`<button class="${f===k?'':'sec'}" style="padding:6px 12px" onclick="CAL.filtro='${k}';calPintar()">${t}</button>`).join('')}
      ${esLector()?'':`<button onclick="modalNuevoDesvio()">+ Nuevo evento</button>`}
    </div>
    ${lista.length? lista.map(d=>`<div class="exp" onclick="CAL.sel='${esc(d.codigo)}';calCargar()">
      <div class="top"><span class="codigo">${esc(d.codigo)}</span>
        ${bdg(DESV_TIPO[d.tipo]||d.tipo, d.tipo==='nc_mayor'?'b-bad':'b-info')}
        <span class="desc">${esc((d.descripcion||'').slice(0,110))}</span>
        ${bdg(DESV_EST[d.estado]||d.estado, calEstCls(d.estado))}</div>
      <div class="meta"><span>Detectado ${esc(d.fecha_deteccion)}</span>${d.proyecto?`<span>${esc(d.proyecto)}</span>`:''}
        ${d.impacto_cliente && d.estado!=='cerrado'?`<span style="color:${d.fecha_comunicacion_cliente<hoy?'var(--bad)':'var(--warn)'};font-weight:600">Impacta al cliente · comunicar antes del ${esc(d.fecha_comunicacion_cliente||'—')}</span>`:''}</div>
    </div>`).join('') : '<p class="muted" style="margin-top:12px">No hay eventos en este filtro.</p>'}
  </div>`;
}
function modalNuevoDesvio(){
  calForm('Nuevo evento de calidad',[
    {id:'tipo',label:'Tipo',type:'select',opts:Object.entries(DESV_TIPO)},
    {id:'proyecto',label:'Proyecto (opcional)',type:'select',opts:[['','—'],...proysDT().map(p=>[p.codigo,p.codigo+' · '+p.nombre])]},
    {id:'expediente_id',label:'Expediente (opcional)',ph:'Ej: EXP-0012'},
    {id:'descripcion',label:'Qué pasó',type:'textarea',req:true},
    {id:'evidencia',label:'Evidencia (opcional)',type:'textarea'},
    {id:'fecha_deteccion',label:'Fecha de detección',type:'date',val:hoyISO()},
    {id:'impacto_cliente',label:'Impacta al cliente (hay que comunicarle en 2 días hábiles)',type:'check'},
  ],'Registrar', async v=>{
    const r=await calPost('/api/desvios',v);
    CAL.sel=r.codigo; toast('Evento '+r.codigo+' registrado'+(r.fecha_comunicacion_cliente?' · comunicar al cliente antes del '+r.fecha_comunicacion_cliente:'')); await calCargar();
  });
}
function htmlDesvioDet(){
  const d=CAL.det?.desvio, bit=CAL.det?.bitacora||[]; if(!d) return '';
  const ro=esLector();
  const sigs = ['abierto','en_analisis','correccion_implementada','cerrado'].filter(e=>e!==d.estado);
  return `<p><button class="ghost" onclick="calVolver()">← Eventos</button></p>
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="codigo" style="font-size:15px">${esc(d.codigo)}</span>
      ${bdg(DESV_TIPO[d.tipo]||d.tipo, d.tipo==='nc_mayor'?'b-bad':'b-info')} ${bdg(DESV_EST[d.estado]||d.estado, calEstCls(d.estado))}
      <span class="muted" style="margin-left:auto">Detectado ${esc(d.fecha_deteccion)} por ${esc((d.detectado_por||'').split('@')[0])}</span></div>
    <p style="margin-top:12px;white-space:pre-wrap">${esc(d.descripcion)}</p>
    ${d.evidencia?`<p class="muted" style="margin-top:8px;white-space:pre-wrap"><b>Evidencia:</b> ${esc(d.evidencia)}</p>`:''}
    <div class="muted" style="margin-top:8px">${d.proyecto?'Proyecto '+esc(d.proyecto)+' · ':''}${d.expediente_id?'Expediente '+esc(d.expediente_id)+' · ':''}
      ${d.impacto_cliente?`<b style="color:var(--warn)">Impacta al cliente — comunicar antes del ${esc(d.fecha_comunicacion_cliente||'—')}</b>`:'Sin impacto en cliente'}</div>
    ${d.correccion_texto?`<p style="margin-top:8px"><b>Corrección${d.correccion_fecha?' ('+esc(d.correccion_fecha)+')':''}:</b> ${esc(d.correccion_texto)}</p>`:''}
    ${ro?'':`<p style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${sigs.map(e=>`<button class="sec" onclick="modalEstadoDesvio('${esc(d.codigo)}','${e}')">→ ${DESV_EST[e]}</button>`).join('')}</p>`}
  </div>
  ${htmlCapa(d)}
  <div class="card"><h3>Bitácora (cadena de hashes)</h3>
    ${bit.map(b=>`<div style="margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--g4)">
      <div class="muted" style="font-size:12px">${fFecha(b.ts)} · ${esc((b.autor||'').split('@')[0])} · ${esc(b.tipo)}</div>
      <div style="margin-top:2px;white-space:pre-wrap">${esc(b.texto)}</div><div class="hashchip">${esc((b.hash||'').slice(0,16))}…</div></div>`).join('') || '<p class="muted">Sin entradas.</p>'}
  </div>`;
}
function modalEstadoDesvio(cod, est){
  const campos=[{id:'motivo',label:'Motivo (obligatorio si se reabre o se reactiva)',type:'textarea'}];
  if(est==='correccion_implementada') campos.unshift({id:'correccion_texto',label:'Qué corrección se implementó',type:'textarea',req:true});
  calForm('Pasar '+cod+' a «'+DESV_EST[est]+'»',campos,'Confirmar', async v=>{
    await calPost('/api/desvios/'+cod+'/estado',{estado:est,motivo:v.motivo||undefined,correccion_texto:v.correccion_texto||undefined}); toast('Estado actualizado'); await calCargar(); });
}

/* ---------- CAPA ---------- */
function htmlCapa(d){
  const c=CAL.capa, ro=esLector(), hoy=hoyISO();
  if(!c) return `<div class="card"><h3>CAPA</h3><p class="muted" style="margin-top:6px">Este evento todavía no tiene acción correctiva/preventiva.</p>
    ${ro?'':`<p style="margin-top:10px"><button onclick="modalNuevaCapa('${esc(d.codigo)}')">Abrir CAPA</button></p>`}</div>`;
  const acc=c.acciones||[], todasOk = acc.length>0 && acc.every(a=>a.estado==='completada');
  const analisisVence = c.estado==='abierta' && c.fecha_limite_analisis && c.fecha_limite_analisis<hoy && !c.causa_raiz_texto;
  return `<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="flex:1">CAPA ${esc(c.tipo)}</h3> ${bdg(CAPA_EST[c.estado]||c.estado, calEstCls(c.estado))}</div>
    <div class="muted" style="margin-top:6px">Responsable: ${esc(c.responsable)} · Análisis de causa raíz hasta ${esc(c.fecha_limite_analisis||'—')} ${analisisVence?bdg('VENCIDO','b-bad'):''}</div>
    <div style="margin-top:12px"><b>Causa raíz</b>${c.causa_raiz_texto?` <span class="muted">(${c.metodo_causa_raiz==='5_porques'?'5 porqués':'Ishikawa'})</span><p style="white-space:pre-wrap;margin-top:4px">${esc(c.causa_raiz_texto)}</p>`:' <span class="muted">— pendiente</span>'}
      ${ro||c.estado==='cerrada'?'':`<p style="margin-top:6px"><button class="ghost" onclick="modalCausaRaiz('${esc(d.codigo)}')">${c.causa_raiz_texto?'Editar':'Registrar'} causa raíz</button></p>`}</div>
    <div style="margin-top:12px"><b>Acciones</b>
      ${acc.length?`<div style="overflow-x:auto"><table class="docs-tabla"><thead><tr><th>Acción</th><th>Responsable</th><th>Fecha límite</th><th>Estado</th><th></th></tr></thead><tbody>
        ${acc.map(a=>`<tr><td>${esc(a.descripcion)}${a.motivo_retraso?`<div class="muted" style="font-size:11px">Reprogramada: ${esc(a.motivo_retraso)}</div>`:''}</td><td>${esc(a.responsable)}</td>
          <td>${esc(a.fecha_limite)}${a.fecha_limite_original&&a.fecha_limite_original!==a.fecha_limite?`<div class="muted" style="font-size:11px">orig. ${esc(a.fecha_limite_original)}</div>`:''}</td>
          <td>${a.estado==='completada'?bdg('Completada ' + (a.fecha_completada||''),'b-ok'):(a.vencida?bdg('VENCIDA','b-bad'):bdg('Pendiente','b-info'))}</td>
          <td>${ro||a.estado==='completada'||c.estado==='cerrada'?'':`<button class="ghost" onclick="completarAccion('${esc(d.codigo)}',${a.id})">✔ Completar</button><button class="ghost" onclick="modalReprogramar('${esc(d.codigo)}',${a.id})">Reprogramar</button>`}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="muted">Sin acciones cargadas.</p>'}
      ${ro||c.estado==='cerrada'||c.estado==='en_seguimiento'?'':`<p style="margin-top:6px"><button class="ghost" onclick="modalNuevaAccion('${esc(d.codigo)}')">+ Acción</button></p>`}</div>
    ${c.estado==='en_seguimiento'?`<p class="muted" style="margin-top:10px">Seguimiento de eficacia: ${esc(c.fecha_inicio_seguimiento)} → ${esc(c.fecha_fin_seguimiento)} (90 días).</p>`:''}
    ${c.eficacia_resultado?`<p style="margin-top:8px"><b>Eficacia:</b> ${c.eficacia_resultado==='eficaz'?'Eficaz':'No eficaz'}${c.fecha_cierre?' · cerrada el '+esc(c.fecha_cierre):''}</p>`:''}
    ${ro?'':`<p style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      ${(c.estado==='abierta'||c.estado==='reactivada')&&todasOk?`<button onclick="iniciarSeguimiento('${esc(d.codigo)}')">Iniciar seguimiento de eficacia (90 días)</button>`:''}
      ${esAdmin()&&c.estado==='en_seguimiento'?`<button onclick="modalCerrarCapa('${esc(d.codigo)}')">Cerrar CAPA (evaluar eficacia)</button>`:''}</p>`}
  </div>`;
}
function modalNuevaCapa(cod){ calForm('Abrir CAPA',[{id:'tipo',label:'Tipo',type:'select',opts:[['correctiva','Correctiva'],['preventiva','Preventiva']]},{id:'responsable',label:'Responsable',req:true}],'Abrir',
  async v=>{ const r=await calPost('/api/desvios/'+cod+'/capa',v); toast('CAPA abierta · análisis de causa raíz hasta '+r.fecha_limite_analisis); await calCargar(); },'El análisis de causa raíz vence a los 10 días hábiles.'); }
function modalCausaRaiz(cod){ calForm('Causa raíz',[{id:'metodo',label:'Método',type:'select',opts:[['5_porques','5 porqués'],['ishikawa','Ishikawa']]},{id:'causa_raiz_texto',label:'Descripción de la causa raíz',type:'textarea',req:true,val:CAL.capa?.causa_raiz_texto||''}],'Guardar',
  async v=>{ await calPost('/api/desvios/'+cod+'/capa/causa-raiz',{metodo:v.metodo,causa_raiz_texto:v.causa_raiz_texto}); toast('Causa raíz registrada'); await calCargar(); }); }
function modalNuevaAccion(cod){ calForm('Nueva acción',[{id:'descripcion',label:'Acción',type:'textarea',req:true},{id:'responsable',label:'Responsable',req:true},{id:'recursos',label:'Recursos (opcional)'},{id:'fecha_limite',label:'Fecha límite',type:'date',req:true}],'Agregar',
  async v=>{ await calPost('/api/desvios/'+cod+'/capa/acciones',v); toast('Acción agregada'); await calCargar(); }); }
function completarAccion(cod,id){ calAccionOk(()=>api('/api/desvios/'+cod+'/capa/acciones/'+id,{method:'PATCH',body:{completada:true}}),'Acción completada'); }
function modalReprogramar(cod,id){ calForm('Reprogramar acción',[{id:'nueva_fecha',label:'Nueva fecha límite',type:'date',req:true},{id:'motivo_retraso',label:'Motivo del retraso',type:'textarea',req:true}],'Reprogramar',
  async v=>{ await api('/api/desvios/'+cod+'/capa/acciones/'+id,{method:'PATCH',body:v}); toast('Acción reprogramada'); await calCargar(); }); }
function iniciarSeguimiento(cod){ calAccionOk(()=>calPost('/api/desvios/'+cod+'/capa/iniciar-seguimiento'),'Seguimiento iniciado (90 días corridos)'); }
function modalCerrarCapa(cod){ calForm('Cerrar CAPA',[{id:'eficacia_resultado',label:'Resultado de la evaluación de eficacia',type:'select',opts:[['eficaz','Eficaz → cierra la CAPA'],['no_eficaz','No eficaz → reactiva la CAPA']]},{id:'motivo',label:'Fundamento',type:'textarea'}],'Confirmar',
  async v=>{ const r=await calPost('/api/desvios/'+cod+'/capa/cerrar',v); toast(r.reactivada?'CAPA reactivada':'CAPA cerrada'); await calCargar(); }); }

/* ---------- CAMBIOS ---------- */
function htmlCambioLista(){
  const f=CAL.filtro, lista=CAL.cambios.filter(c=> f==='todos' || (f==='abiertos'?!['cerrado','rechazado'].includes(c.estado):['cerrado','rechazado'].includes(c.estado)));
  return `<div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <h2 style="flex:1">Control de cambios</h2>
      ${[['abiertos','En curso'],['cerrados','Cerrados'],['todos','Todos']].map(([k,t])=>`<button class="${f===k?'':'sec'}" style="padding:6px 12px" onclick="CAL.filtro='${k}';calPintar()">${t}</button>`).join('')}
      ${esLector()?'':`<button onclick="modalNuevoCambio()">+ Nuevo cambio</button>`}
    </div>
    ${lista.length? lista.map(c=>`<div class="exp" onclick="CAL.sel='${esc(c.codigo)}';calCargar()">
      <div class="top"><span class="codigo">${esc(c.codigo)}</span>
        ${c.es_emergencia?bdg('EMERGENCIA','b-bad'):''} ${c.clasificacion?bdg('Riesgo '+c.clasificacion, c.clasificacion==='alto'?'b-bad':'b-info'):''}
        <span class="desc">${esc((c.descripcion||'').slice(0,110))}</span>
        ${c.vencido?bdg('VENCIDO','b-bad'):''} ${bdg(CAMB_EST[c.estado]||c.estado, calEstCls(c.estado))}</div>
      <div class="meta"><span>${esc(c.elemento_afectado)}</span><span>Solicitado ${esc(c.fecha_solicitud)}</span>${c.poe_codigo?`<span>${esc(c.poe_codigo)}</span>`:''}</div>
    </div>`).join('') : '<p class="muted" style="margin-top:12px">No hay cambios en este filtro.</p>'}
  </div>`;
}
function modalNuevoCambio(){
  calForm('Nuevo cambio controlado',[
    {id:'descripcion',label:'Qué se quiere cambiar',type:'textarea',req:true},
    {id:'elemento_afectado',label:'Elemento afectado (POE, sistema, proceso…)',req:true},
    {id:'motivo',label:'Motivo',type:'textarea',req:true},

/* ===================== FLOWTRACKER (ex FARO) ===================== */

let DATA = { proyectos:[], proyectos_faro:[], items:[], templates:[], documentos:[] };
let VISTA = 'hoy', PROY_SEL = null, FILTRO_AMBITO = 'todos', MODO_DETALLE = 'lista';
const ARBOL_EXP = new Set(); // expedientes expandidos en la vista árbol
const CANCHA_COLOR = { mia:'#D9822B', cliente:'#1663A8', cerrado:'#2E9E5B' };
