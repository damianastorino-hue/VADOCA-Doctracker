const ORDEN_TIPOS = ['PM','PMV','VMP','RU','DQ','IQ','OQ','PQ','IV','IF','INF'];
function ordenTipo(t){ const i = ORDEN_TIPOS.indexOf((t||'').toUpperCase()); return i === -1 ? 99 : i; }

// Unifica proyectos de DocTracker (siempre profesionales) y propios de FlowTracker
function todosProyectos() {
  // Tabla única de proyectos: "ambito" separa profesionales de personales.
  const dt = DATA.proyectos.map(p => ({ codigo:p.codigo, nombre:p.nombre, cliente_nombre:p.cliente_nombre||'',
    estado:p.estado, origen:'dt', ambito:p.ambito||'profesional' }));
  const faro = (DATA.proyectos_faro||[]).map(p => ({ codigo:p.codigo, nombre:p.nombre, cliente_nombre:p.cliente||'',
    estado:p.estado, origen:'faro', ambito:p.ambito })); // compat backend viejo
  return dt.concat(faro);
}
function pasaFiltro(p){ return FILTRO_AMBITO === 'todos' || p.ambito === FILTRO_AMBITO; }
function chipsFiltro() {
  return `<div class="filtros">${[['todos','Todos'],['profesional','Profesional'],['personal','Personal']]
    .map(([v,t]) => `<button class="${FILTRO_AMBITO===v?'on':''}" onclick="FILTRO_AMBITO='${v}';ftRender()">${t}</button>`).join('')}</div>`;
}
function tagDe(p) {
  return p.ambito === 'personal' ? '<span class="tag per">Personal</span>' : '<span class="tag pro">Profesional</span>';
}

const hoyISO = () => new Date().toISOString().slice(0,10);


/* ---------- Lógica de cancha ---------- */
function estadoEfectivo(it){ return it.doc_codigo ? (it.doc_estado || 'Borrador') : it.estado; }
function canchaDoc(e) {
  if (['Entregado','Suspendido','Cancelado'].includes(e)) return 'cerrado';
  if (e === 'Enviado a cliente') return 'cliente';
  return 'mia';
}
function cancha(it) {
  const e = estadoEfectivo(it);
  if (it.doc_codigo) return canchaDoc(e);
  if (['aprobado','n/a'].includes(e)) return 'cerrado';
  if (['enviado a cliente','esperando respuesta'].includes(e)) return 'cliente';
  return 'mia';
}
const CHIP = { mia:['c-mia','En tu cancha'], cliente:['c-cliente','Espera al cliente'], cerrado:['c-cerrado','Cerrado'] };
function chip(c){ return `<span class="chip ${CHIP[c][0]}"><span class="punto"></span>${CHIP[c][1]}</span>`; }
function itemsDe(cod){ return DATA.items.filter(i => i.proyecto === cod); }
function docsDe(cod){ return DATA.documentos.filter(d => d.proyecto === cod); }

// Unidades de trabajo de un proyecto: documentos reales de DocTracker + ítems de seguimiento.
// Los ítems vinculados a un documento del mismo proyecto se omiten (ya cuentan como documento).
function unidadesDe(cod) {
  const docs = docsDe(cod);
  const codsDocs = new Set(docs.map(d => d.codigo));
  const uDocs = docs.map(d => ({ clase:'doc', nombre:(d.codigo + ' · ' + (d.tipo_doc||'') + ' ' + (d.prot_inf||'')).trim(),
    estado:d.estado, cancha:canchaDoc(d.estado), fecha_limite:null }));
  const uItems = itemsDe(cod).filter(i => !(i.doc_codigo && codsDocs.has(i.doc_codigo)))
    .map(i => ({ clase:'seg', nombre:i.nombre, estado:estadoEfectivo(i), cancha:cancha(i), fecha_limite:i.fecha_limite }));
  return uDocs.concat(uItems);
}

/* ---------- Navegación ---------- */
function ftIr(v){ VISTA = v; if(v!=='proyectos') PROY_SEL = null; ftRender(); }
function ftRender() {
  if (typeof MODULO !== 'undefined' && MODULO === 'com') { renderCom(); return; }
  for (const [id,v] of [['nHoy','hoy'],['nProy','proyectos'],['nTpl','templates']])
    document.getElementById(id).classList.toggle('active', VISTA === v);
  const shell = document.getElementById('app');
  shell.innerHTML = '<div id="ftScope" class="ftui"></div>';
  const m = document.getElementById('ftScope');
  if (VISTA === 'hoy') m.innerHTML = vistaHoy();
  else if (VISTA === 'proyectos') m.innerHTML = PROY_SEL ? vistaDetalle() : ftVistaProyectos();
  else m.innerHTML = vistaTemplates();
  if (VISTA === 'proyectos' && PROY_SEL) cargarBitacora();
  if (VISTA === 'hoy') planHoyCargar();
}

/* ---------- Vista HOY ---------- */
function tarjetaProyecto(p) {
  const us = unidadesDe(p.codigo);
  const cerrados = us.filter(u => u.cancha === 'cerrado').length;
  const enMia = us.filter(u => u.cancha === 'mia').length;
  const enCli = us.filter(u => u.cancha === 'cliente').length;
  const prox = us.find(u => u.cancha === 'mia') || us.find(u => u.cancha === 'cliente');
  const pct = us.length ? Math.round(cerrados / us.length * 100) : 0;
  return `<div class="card pcard ${p.ambito === 'personal' ? 'personal' : ''}" onclick="abrirProyecto('${esc(p.codigo)}')">
    <div class="fila" style="justify-content:space-between">
      <h3>${esc(p.codigo)} · ${esc(p.nombre)} ${tagDe(p)}</h3>${prox ? chip(prox.cancha) : chip('cerrado')}
    </div>
    <div class="muted">${esc(p.cliente_nombre || '')} · ${cerrados}/${us.length} cerrados${enMia ? ` · ${enMia} en tu cancha` : ''}${enCli ? ` · ${enCli} del cliente` : ''}</div>
    ${prox ? `<div class="prox">Próxima acción: <b>${esc(prox.nombre)}</b> — ${esc(prox.estado)}${prox.fecha_limite ? ' · vence ' + esc(prox.fecha_limite) : ''}</div>` : ''}
    <div class="barra"><i style="width:${pct}%"></i></div>
  </div>`;
}
function vistaHoy() {
  const activos = todosProyectos().filter(p => p.estado === 'Activo' && pasaFiltro(p) && unidadesDe(p.codigo).length);
  const mios = activos.filter(p => unidadesDe(p.codigo).some(u => u.cancha === 'mia'));
  // Del lado del cliente: documentos e ítems individuales, no proyectos enteros
  const esperando = [];
  for (const p of activos)
    for (const u of unidadesDe(p.codigo)) if (u.cancha === 'cliente') esperando.push({ ...u, proyecto: p.codigo });
  return chipsFiltro() + `<div id="planHoy">${planHoyHtml()}</div>
    <div class="hoy-grid">
      <div><div class="col-titulo mia"><span class="punto" style="background:#D9822B"></span>En tu cancha (${mios.length})</div>
        ${mios.map(tarjetaProyecto).join('') || '<div class="tarea-vacia">Nada pendiente de tu lado 🎉</div>'}</div>
      <div><div class="col-titulo cli"><span class="punto" style="background:#1663A8"></span>Esperando al cliente (${esperando.length})</div>
        ${esperando.map(u => `<div class="card pcard" style="border-left-color:#1663A8;padding:11px 14px" onclick="abrirProyecto('${esc(u.proyecto)}')">
          <div class="fila" style="justify-content:space-between;gap:8px">
            <b style="font-size:13px">${esc(u.nombre)}</b>
            <span class="muted" style="white-space:nowrap">${esc(u.proyecto)}</span></div>
          <div class="muted" style="margin-top:3px">${esc(u.estado)}${u.fecha_limite ? ' · vence ' + esc(u.fecha_limite) : ''}</div>
        </div>`).join('') || '<div class="tarea-vacia">Nada esperando respuesta</div>'}</div>
    </div>
    ${!activos.length ? `<div class="card tarea-vacia">Todavía no hay proyectos con seguimiento.<br><br>
      <button class="btn" onclick="ftIr('proyectos')">Ir a Proyectos para arrancar</button></div>` : ''}`;
}

/* ---------- Vista PROYECTOS ---------- */
function ftVistaProyectos() {
  const todos = todosProyectos();
  const conSeg = todos.filter(p => unidadesDe(p.codigo).length && pasaFiltro(p));
  const sinSeg = todos.filter(p => !unidadesDe(p.codigo).length && pasaFiltro(p));
  return `<div class="fila" style="justify-content:space-between;margin-bottom:12px">
      ${chipsFiltro()}
      <button class="btn mini" onclick="modalNuevoProyecto()">+ Nuevo proyecto</button></div>
    ${conSeg.map(tarjetaProyecto).join('') || '<div class="card tarea-vacia">Ningún proyecto tiene seguimiento todavía (con este filtro).</div>'}
    ${sinSeg.length ? `<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Proyectos sin seguimiento</h3>
      ${sinSeg.map(p => `<div class="fila" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--fondo)">
        <span>${esc(p.codigo)} · ${esc(p.nombre)} ${tagDe(p)} <span class="muted">${esc(p.cliente_nombre || '')} · ${esc(p.estado)}</span></span>
        <span class="fila"><button class="btn sec mini" onclick="modalTemplate('${esc(p.codigo)}')">+ Aplicar template</button>
        <button class="btn mini" onclick="abrirProyecto('${esc(p.codigo)}')">Abrir</button></span></div>`).join('')}
      <p class="muted" style="margin-top:10px">Los proyectos son los mismos acá y en DocTracker (tabla única, serie PRJ-).
      Los personales solo se ven en FlowTracker.</p></div>` : ''}`;
}

function modalNuevoProyecto() {
  ftAbrirModal(`<h3>Nuevo proyecto</h3>
    <p class="muted">Se crea en la tabla única de proyectos (serie PRJ-, la misma que ve DocTracker).
    Los de ámbito personal no aparecen en DocTracker ni en el espejo de proyectos.</p>
    <label>Nombre</label><input id="mPNom" placeholder="Ej: Pintar el portón / Habilitación farmacia">
    <label>Ámbito</label>
    <select id="mPAmb"><option value="personal">Personal</option><option value="profesional">Profesional</option></select>
    <label>Cliente / referencia (opcional)</label><input id="mPCli">
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="crearProyecto()">Crear</button></div>`);
}
async function crearProyecto() {
  const nombre = document.getElementById('mPNom').value.trim();
  if (!nombre) return alert('Falta el nombre');
  try {
    const p = await api('/api/seguimiento/proyectos', { method:'POST', body:{
      nombre, ambito: document.getElementById('mPAmb').value,
      cliente: document.getElementById('mPCli').value.trim() } });
    ftCerrarModal(); await ftCargar(); abrirProyecto(p.codigo);
  } catch(e){ alert(e.message); }
}

function abrirProyecto(cod){ if (cod === TAREAS) { ftIr('hoy'); return; } VISTA = 'proyectos'; PROY_SEL = cod; PLAN_VER = null; delete PLANES[cod]; ftRender(); }

function vistaDetalle() {
  const p = todosProyectos().find(x => x.codigo === PROY_SEL);
  if (!p) { PROY_SEL = null; return ftVistaProyectos(); }
  const its = itemsDe(p.codigo);
  const docsProy = docsDe(p.codigo);
  const codsDocs = new Set(docsProy.map(d => d.codigo));
  const itsVisibles = its.filter(i => !(i.doc_codigo && codsDocs.has(i.doc_codigo)));

  // Agrupar documentos por expediente, ordenados por número de expediente
  const exps = new Map();
  const docsOrdenados = docsProy.slice().sort((a, b) =>
    String(a.expediente_id).localeCompare(String(b.expediente_id), undefined, { numeric: true }) ||
    String(a.codigo).localeCompare(String(b.codigo)));
  for (const d of docsOrdenados) {
    if (!exps.has(d.expediente_id)) exps.set(d.expediente_id, []);
    exps.get(d.expediente_id).push(d);
  }
  const enPlan = MODO_DETALLE === 'plan';
  let htmlExps = '';
  for (const [expId, docs] of exps) {
    const activosN = docs.filter(d => canchaDoc(d.estado) !== 'cerrado').length;
    const resumen = activosN ? `<span class="chip c-mia"><span class="punto"></span>${activosN} activo${activosN > 1 ? 's' : ''}</span>` : chip('cerrado');
    htmlExps += `<details class="exp">
      <summary><span><span class="cod">${esc(expId)}</span> <span class="muted">${esc((docs[0].descripcion || '').slice(0,60))}</span></span>${resumen}</summary>
      ${docs.map(d => `<div class="doc-row">
        <span><b>${esc(d.codigo)}</b> · ${esc(d.tipo_doc || '')} ${esc(d.prot_inf || '')}</span>
        <span class="fila">${chip(canchaDoc(d.estado))}
        <select onchange="cambiarEstadoDoc('${esc(d.codigo)}', this.value, '${esc(d.estado)}')">
          ${docEstadosSel(d.estado).map(s => `<option ${d.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select></span>
      </div>`).join('')}
    </details>`;
  }

  return `<button class="btn sec mini" onclick="PROY_SEL=null;ftRender()">← Volver</button>
  <div class="card" style="margin-top:12px;border-left:4px solid ${p.ambito === 'personal' ? '#8E6CC8' : 'var(--turq)'}">
    <div class="fila" style="justify-content:space-between">
      <div><h2 style="font-size:17px">${esc(p.codigo)} · ${esc(p.nombre)} ${tagDe(p)}</h2>
      <div class="muted">${esc(p.cliente_nombre || '')}</div></div>
      <div class="fila">
        <select onchange="editarProyectoFaro('${esc(p.codigo)}',{estado:this.value})" style="padding:5px 7px;font-size:12px">
          ${[...new Set(['Activo','Pausado','Cerrado', p.estado])].map(s => `<option ${p.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <button class="btn sec mini" onclick="modalTemplate('${esc(p.codigo)}')">+ Template</button>
        <button class="btn mini" onclick="modalItem('${esc(p.codigo)}')">+ Ítem</button>
        ${p.ambito === 'personal' ? `<button class="btn rojo mini" onclick="borrarProyectoFaro('${esc(p.codigo)}')">✕</button>` : ''}
      </div>
    </div>
    <div class="fila" style="justify-content:space-between;margin-top:14px">
      <div class="seccion" style="margin:0">${enPlan || !docsProy.length ? 'Plan del proyecto' : `Expedientes y documentos · DocTracker (${exps.size} exp / ${docsProy.length} docs)`}</div>
      <div class="modo-btns">
        ${docsProy.length ? `<button class="${MODO_DETALLE === 'lista' ? 'on' : ''}" onclick="MODO_DETALLE='lista';ftRender()">☰ Lista</button>
        <button class="${MODO_DETALLE === 'mapa' ? 'on' : ''}" onclick="MODO_DETALLE='mapa';ftRender()">▦ Mapa</button>
        <button class="${MODO_DETALLE === 'arbol' ? 'on' : ''}" onclick="MODO_DETALLE='arbol';ftRender()">🌳 Árbol</button>` : ''}
        <button class="${enPlan ? 'on' : ''}" onclick="planAbrir()">📊 Plan</button>
      </div></div>
    ${enPlan ? `<div id="planBox">${planHtml(p.codigo)}</div>` : `
    ${docsProy.length ? (MODO_DETALLE === 'mapa' ? mapaProyecto(exps) : MODO_DETALLE === 'arbol' ? arbolProyecto(p, exps) : htmlExps) : ''}
    ${(docsProy.length || itsVisibles.length) ? `<div class="seccion">Ítems de seguimiento (extra: comercial, esperas, tareas sin documento)</div>` : ''}
    <div>
      ${itsVisibles.map(i => filaItem(i, docsProy)).join('') || (docsProy.length ? '<div class="muted" style="padding:4px 6px">Sin ítems extra. Usá "+ Ítem" para el ping-pong comercial (ej: esperando OC).</div>' : '<div class="tarea-vacia">Sin ítems. Aplicá un template o agregá ítems sueltos.</div>')}
    </div>`}
    ${enPlan ? '' : '<div class="bita" id="bitacora"><div class="muted">Cargando bitácora…</div></div>'}
  </div>`;
}

/* ============================================================
   FlowTracker · Plan del proyecto (Gantt, actividades, versiones)
   Herramienta operativa: lee el estado de los documentos desde DocTracker y no escribe en él.
   ============================================================ */
let PLANES = {}, PLAN_SUB = 'gantt', PLAN_VER = null, PLAN_CARGANDO = null, PLAN_HOY = null, PLAN_HOY_TS = 0, PLAN_REV = null;
const PL_COL = { vadoca: '#D9822B', cliente: '#1663A8', hecho: '#2E9E5B', gris: '#9AA7B1' };
const PL_MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const plDm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '—';
const plDmy = s => s ? plDm(s) + '/' + s.slice(0, 4) : '—';
const plDias = n => `${Math.abs(n)} día${Math.abs(n) === 1 ? '' : 's'} hábil${Math.abs(n) === 1 ? '' : 'es'}`;
const PL_CHIP = { terminada: ['c-cerrado', 'Terminada'], esperando: ['c-cliente', 'Espera al cliente'], en_ejecucion: ['c-mia', 'En tu cancha'], lista: ['c-mia', 'Para empezar'] };
const PL_GRIS = { pendiente: 'Pendiente', pausada: 'En pausa', cancelada: 'Cancelada', bloqueada: 'Bloqueada' };
function plChip(a) {
  const e = PL_CHIP[a.estado];
  if (e) return `<span class="chip ${e[0]}"><span class="punto"></span>${e[1]}</span>`;
  const rojo = a.estado === 'bloqueada';
  return `<span class="chip" style="background:${rojo ? '#FBE9E7' : '#EEF2F5'};color:${rojo ? '#C0392B' : '#6D7985'}">${PL_GRIS[a.estado] || a.estado}</span>`;
}
const plTagDoc = a => a.documento ? `<span style="font-family:'Courier New',monospace;font-size:10px;font-weight:700;background:#E6F7F7;color:#007E80;padding:1px 5px;border-radius:4px">${esc(a.documento.tipo_doc)} ${a.documento.prot_inf === 'P' ? 'Prot.' : 'Inf.'}</span>` : '';
const plOrigen = o => ({ cliente: 'Cliente', vadoca: 'VADOCA', otro: 'Otro', inicial: 'Plan inicial' }[o] || o);
const plRef = r => !r ? '' : /^https?:\/\//.test(r) ? `<a href="${esc(r)}" target="_blank" rel="noopener">${esc(r.length > 60 ? r.slice(0, 57) + '…' : r)}</a>` : esc(r);

function planAbrir() { MODO_DETALLE = 'plan'; PLAN_VER = null; delete PLANES[PROY_SEL]; ftRender(); }
async function planCargar(cod, silencioso) {
  const clave = cod + '|' + (PLAN_VER || '');
  if (PLAN_CARGANDO === clave) return; PLAN_CARGANDO = clave;
  try { PLANES[cod] = await api('/api/planificacion/' + encodeURIComponent(cod) + (PLAN_VER ? '?version=' + PLAN_VER : '')); }
  catch (e) { PLANES[cod] = { error: e.message }; }
  PLAN_CARGANDO = null; PLAN_HOY_TS = 0;
  const box = document.getElementById('planBox');
  if (box && PROY_SEL === cod && MODO_DETALLE === 'plan') box.innerHTML = planHtml(cod);
}
async function planRecargar() { delete PLANES[PROY_SEL]; await planCargar(PROY_SEL); }

function planHtml(cod) {
  const D = PLANES[cod];
  if (!D) { planCargar(cod); return '<div class="muted" style="padding:18px 6px">Cargando el plan…</div>'; }
  if (D.error) return `<div class="tarea-vacia">No se pudo cargar el plan: ${esc(D.error)}<br><button class="btn sec mini" style="margin-top:10px" onclick="planRecargar()">Reintentar</button></div>`;
  if (!D.existe) return `<div class="tarea-vacia" style="padding:34px 10px">
      <div style="font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px">Este proyecto todavía no tiene plan</div>
      Pegá el JSON del plan que te genera el asistente y FlowTracker arma el Gantt.<br>
      Los documentos se siguen solos desde DocTracker.
      ${esLector() ? '' : '<div style="margin-top:14px"><button class="btn" onclick="planModalImportar()">⬆ Importar plan</button></div>'}</div>`;
  const ro = esLector() || !D.es_vigente;
  const vAct = D.versiones.find(v => v.numero === D.version);
  return `<div class="fila" style="justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:8px">
      <div class="modo-btns">
        <button class="${PLAN_SUB === 'gantt' ? 'on' : ''}" onclick="PLAN_SUB='gantt';planPintar()">▤ Gantt</button>
        <button class="${PLAN_SUB === 'acts' ? 'on' : ''}" onclick="PLAN_SUB='acts';planPintar()">☑ Actividades</button>
        <button class="${PLAN_SUB === 'hist' ? 'on' : ''}" onclick="PLAN_SUB='hist';planPintar()">🕘 Versiones (${D.versiones.length})</button>
      </div>
      <div class="fila" style="gap:6px;flex-wrap:wrap">
        <span class="muted" style="font-size:12px">Versión ${D.version}${D.es_vigente ? ' · vigente' : ''} · ${new Date(vAct.creado).toLocaleDateString('es-AR')}</span>
        <button class="btn sec mini" onclick="planExportar()">⬇ Exportar</button>
        ${ro ? '' : `<button class="btn sec mini" onclick="planModalPausa()">⏸ Pausar proyecto</button>
        <button class="btn mini" onclick="planModalImportar()">⬆ Actualizar plan</button>`}
      </div></div>
    ${D.es_vigente ? '' : `<div style="background:#EEF2F5;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px">
      Estás viendo la <b>versión ${D.version}</b> tal como se planificó${vAct.motivo ? ` (${esc(vAct.motivo)})` : ''}. No es la vigente.
      <a href="#" onclick="PLAN_VER=null;planRecargar();return false" style="margin-left:8px">Volver a la versión ${D.version_vigente} →</a></div>`}
    ${planEncabezado(D)}
    ${PLAN_SUB === 'gantt' ? planGantt(D) : PLAN_SUB === 'acts' ? planActividades(D, ro) : planVersiones(D)}`;
}
function planPintar() { const b = document.getElementById('planBox'); if (b) b.innerHTML = planHtml(PROY_SEL); }

function planEncabezado(D) {
  const d = D.desvio_dias || 0, tarde = D.es_vigente && d > 0;
  const sub2 = !D.es_vigente ? 'Según esa versión' : tarde ? plDias(d) + ' de atraso' : d < 0 ? plDias(d) + ' de adelanto' : 'En fecha';
  const tarj = [['Fin planificado', plDmy(D.fin_planificado), D.version > 1 ? `Versión ${D.version} · original ${plDmy(D.fin_original)}` : 'Línea base'],
    ['Fin proyectado', plDmy(D.fin_proyectado), sub2],
    ['Fecha comprometida', plDmy(D.comprometido), D.comprometido ? 'Con el cliente' : 'Sin fecha comprometida'],
    ['Avance', D.resumen.terminadas + ' de ' + D.resumen.total, 'actividades terminadas']];
  const pl = D.alertas.filter(a => a.tipo === 'planificada' || a.tipo === 'comprometida'), otras = D.alertas.filter(a => a.tipo === 'hito' || a.tipo === 'dependencia');
  const comp = D.alertas.some(a => a.tipo === 'comprometida');
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px">
    ${tarj.map(([l, v, s], i) => `<div style="flex:1;min-width:150px;border:1px solid var(--borde);border-radius:12px;padding:10px 14px;background:#fff">
      <div style="font-size:11px;color:var(--gris);font-weight:600;text-transform:uppercase;letter-spacing:.5px">${l}</div>
      <div style="font-size:20px;font-weight:700;color:${i === 1 && tarde ? '#C0392B' : 'var(--navy)'}">${v}</div>
      <div style="font-size:12px;color:${i === 1 && tarde ? '#C0392B' : 'var(--gris)'}">${s}</div></div>`).join('')}</div>
    ${pl.length ? `<div style="background:${comp ? '#FBE9E7' : '#FBF0DA'};border:1px solid ${comp ? '#C0392B' : '#D98E04'};border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px">
      <b>⚠ ${comp ? 'El fin proyectado supera la fecha comprometida con el cliente.' : 'El fin proyectado supera la fecha planificada.'}</b>
      ${!comp && D.comprometido ? `Sigue dentro de la fecha comprometida (${plDmy(D.comprometido)}).` : ''}
      ${D.causa ? `Lo que más está corriendo el plan: <b>${esc(D.causa.titulo)}</b>.` : ''}</div>` : ''}
    ${otras.map(a => `<div style="background:#FBF0DA;border-radius:10px;padding:7px 12px;font-size:12.5px;margin-top:6px">⚠ ${esc(a.texto.replace(/(\d{4})-(\d\d)-(\d\d)/g, '$3/$2/$1'))}</div>`).join('')}`;
}

function planGantt(D) {
  const dia = 864e5, f = s => new Date(s + 'T00:00:00Z').getTime(), N = 250;
  const fechas = [D.inicio, D.fin_proyectado, D.fin_planificado, D.comprometido, D.hoy].concat(D.actividades.map(a => a.inicio), D.actividades.map(a => a.base ? a.base.inicio : null)).filter(Boolean).sort();
  const t0 = f(fechas[0]) - 3 * dia, t1 = f(fechas[fechas.length - 1]) + 6 * dia, nd = (t1 - t0) / dia;
  const W = Math.max(750, Math.round(nd * 3)), px = W / nd;
  const x = s => Math.round((f(s) - t0) / dia * px), w = (a, b) => Math.max(4, x(b) - x(a) + Math.round(px));
  let meses = '', lineas = '', primerMes = null;
  for (let t = t0; t < t1; t += dia) { const d = new Date(t), xi = Math.round((t - t0) / dia * px);
    if (d.getUTCDate() === 1) { if (primerMes === null) primerMes = xi;
      meses += `<div style="position:absolute;left:${xi + 4}px;top:0;font-size:11px;font-weight:700;color:var(--gris);white-space:nowrap">${PL_MES[d.getUTCMonth()]} ${d.getUTCFullYear()}</div>`;
      lineas += `<div style="position:absolute;left:${xi}px;top:0;bottom:0;border-left:1px solid #DDE4E9"></div>`; }
    else if (d.getUTCDay() === 1 && px >= 3) lineas += `<div style="position:absolute;left:${xi}px;top:18px;bottom:0;border-left:1px dashed #EEF2F5"></div>`; }
  if (primerMes === null || primerMes > 70) { const d = new Date(t0); meses = `<div style="position:absolute;left:4px;top:0;font-size:11px;font-weight:700;color:var(--gris)">${PL_MES[d.getUTCMonth()]} ${d.getUTCFullYear()}</div>` + meses; }
  for (const p of D.pausas || []) lineas += `<div title="Proyecto en pausa: ${esc(p.motivo || '')}" style="position:absolute;left:${x(p.desde)}px;width:${w(p.desde, p.hasta)}px;top:18px;bottom:0;background:repeating-linear-gradient(135deg,#EEF2F5 0 6px,#F8FAFB 6px 12px);opacity:.9"></div>
    <div style="position:absolute;left:${x(p.desde) + 5}px;top:20px;font-size:10px;font-weight:700;color:#6D7985;z-index:4;white-space:nowrap">⏸ Pausa ${plDm(p.desde)}–${plDm(p.hasta)}</div>`;
  const marca = (s, color, texto, nivel) => `<div style="position:absolute;left:${x(s)}px;top:18px;bottom:0;border-left:2px ${color === '#C0392B' ? 'dashed' : 'solid'} ${color};z-index:3"></div>
    <div style="position:absolute;${x(s) > W - 130 ? `right:${W - x(s) + 4}px` : `left:${x(s) + 5}px`};top:${20 + nivel * 13}px;font-size:10px;font-weight:700;color:${color};background:#fff;padding:0 3px;z-index:4;white-space:nowrap">${texto}</div>`;
  const B = (izq, an, extra) => `<div style="position:absolute;left:${izq}px;width:${an}px;top:6px;height:13px;box-sizing:border-box;${extra}"></div>`;
  let filas = '';
  for (const fa of D.fases) {
    const acts = D.actividades.filter(z => z.fase === fa.id); if (!acts.length) continue;
    filas += `<div style="display:flex;align-items:center;height:26px;background:#F2F5F7;border-top:1px solid var(--borde)"><div style="width:${N}px;padding-left:8px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gris-osc)">${esc(fa.titulo)}</div></div>`;
    for (const a of acts) {
      const e = a.estado, cl = a.responsable === 'vadoca' ? PL_COL.vadoca : PL_COL.cliente, esp = a.espera_cliente > 0 && a.fin > a.interno;
      const xi = x(a.inicio), w1 = w(a.inicio, a.interno), x2 = x(a.interno) + Math.round(px), w2 = Math.max(6, w(a.interno, a.fin) - Math.round(px));
      const base = a.kind === 'milestone' || !a.base ? '' : `<div title="Línea base: ${plDm(a.base.inicio)} → ${plDm(a.base.fin)}" style="position:absolute;left:${x(a.base.inicio)}px;width:${w(a.base.inicio, a.base.fin)}px;top:21px;height:3px;background:${PL_COL.gris};border-radius:2px"></div>`;
      let barra;
      if (a.kind === 'milestone') barra = `<div style="position:absolute;left:${x(a.fin) - 6}px;top:6px;width:12px;height:12px;transform:rotate(45deg);box-sizing:border-box;background:${e === 'terminada' ? PL_COL.hecho : '#fff'};border:2px solid ${e === 'terminada' ? PL_COL.hecho : 'var(--navy)'}"></div>
        <div style="position:absolute;left:${x(a.fin) + 12}px;top:5px;font-size:10px;color:var(--gris)">${plDm(a.fin)}</div>`;
      else if (e === 'terminada') barra = B(xi, w(a.inicio, a.fin), `background:${PL_COL.hecho};border-radius:4px`);
      else if (e === 'cancelada') barra = B(xi, w(a.inicio, a.fin), `background:#DDE4E9;border-radius:4px;height:5px;top:10px`);
      else if (e === 'esperando' && a.kind === 'document') barra = B(xi, w1, `background:${PL_COL.vadoca};opacity:.45;border-radius:4px 0 0 4px`) + B(x2, w2, `background:${PL_COL.cliente};border-radius:0 4px 4px 0`);
      else if (e === 'esperando') barra = B(xi, w(a.inicio, a.fin), `background:${PL_COL.cliente};border-radius:4px`);
      else if (e === 'en_ejecucion') barra = B(xi, w1, `background:${PL_COL.vadoca};border-radius:4px${esp ? ' 0 0 4px' : ''}`) + (esp ? B(x2, w2, `border:1.5px dashed ${PL_COL.cliente};border-radius:0 4px 4px 0`) : '');
      else if (e === 'pausada' || e === 'bloqueada') barra = B(xi, w(a.inicio, a.fin), `background:repeating-linear-gradient(135deg,${e === 'bloqueada' ? '#E8B4AC' : '#C3CDD5'} 0 5px,#fff 5px 9px);border:1px solid ${e === 'bloqueada' ? '#C0392B' : '#9AA7B1'};border-radius:4px`);
      else barra = B(xi, w1, `border:1.5px dashed ${cl};background:${cl}14;border-radius:4px${esp ? ' 0 0 4px' : ''}`) + (esp ? B(x2, w2, `border:1.5px dashed ${PL_COL.cliente};background:${PL_COL.cliente}14;border-radius:0 4px 4px 0`) : '');
      const tip = `${a.titulo} · ${plDm(a.inicio)} → ${plDm(a.fin)}` + (a.base ? ` · plan ${plDm(a.base.fin)}` : '');
      filas += `<div style="display:flex;align-items:center;height:28px;border-top:1px solid #F2F5F7" title="${esc(tip)}">
        <div style="width:${N}px;flex:none;padding-left:8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${['terminada', 'cancelada'].includes(e) ? 'var(--gris)' : 'var(--navy)'}">
          ${a.kind === 'document' ? plTagDoc(a) + ' ' : a.kind === 'milestone' ? '◆ ' : ''}${esc(a.titulo)}${a.contractual ? ' <span title="Hito contractual" style="color:#6B4FA3">●</span>' : ''}</div>
        <div style="position:relative;width:${W}px;height:28px;flex:none">${base}${barra}</div></div>`;
    }
  }
  const cerca = D.comprometido && Math.abs(x(D.comprometido) - x(D.hoy)) < 120;
  return `<div style="overflow-x:auto;margin-top:12px"><div style="min-width:${N + W}px">
    <div style="display:flex"><div style="width:${N}px;flex:none"></div><div style="position:relative;width:${W}px;height:18px">${meses}</div></div>
    <div style="position:relative">
      <div style="position:absolute;left:${N}px;top:-18px;bottom:0;width:${W}px;pointer-events:none">${lineas}${D.es_vigente ? marca(D.hoy, '#00B4B6', 'Hoy ' + plDm(D.hoy), 0) : ''}${D.comprometido ? marca(D.comprometido, '#C0392B', 'Comprometido ' + plDm(D.comprometido), cerca ? 1 : 0) : ''}</div>
      ${filas}
    </div></div></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--gris);margin-top:10px;align-items:center">
      ${[[PL_COL.vadoca, 'En tu cancha'], [PL_COL.cliente, 'Esperando al cliente'], [PL_COL.hecho, 'Terminada']].map(([c, t]) => `<span><span style="display:inline-block;width:14px;height:9px;background:${c};border-radius:3px;margin-right:5px"></span>${t}</span>`).join('')}
      <span><span style="display:inline-block;width:14px;height:9px;border:1.5px dashed #6D7985;border-radius:3px;margin-right:5px;box-sizing:border-box"></span>Pendiente (proyectado)</span>
      <span><span style="display:inline-block;width:14px;height:3px;background:${PL_COL.gris};border-radius:2px;margin-right:5px;vertical-align:middle"></span>Línea base</span>
      <span>◆ Hito</span><span><span style="color:#6B4FA3">●</span> Contractual</span>
    </div>`;
}

function planActividades(D, ro) {
  const T = Object.fromEntries(D.actividades.map(a => [a.id, a]));
  const EST = [['not_started', 'No iniciada'], ['in_progress', 'En ejecución'], ['waiting_client', 'Esperando al cliente'], ['done', 'Terminada'], ['cancelled', 'Cancelada']];
  let h = '';
  for (const fa of D.fases) {
    const acts = D.actividades.filter(z => z.fase === fa.id); if (!acts.length) continue;
    h += `<div class="seccion">${esc(fa.titulo)}</div>`;
    for (const a of acts) {
      const hecho = a.estado === 'terminada', doc = a.documento, pr = a.propio || {};
      const faltan = a.espera_a.map(i => T[i].titulo);
      let control = '';
      if (a.kind === 'document') {
        if (doc.vinculo === 'ok') control = `<div style="font-size:11.5px;color:var(--gris)">📄 ${esc(doc.codigo)}<br><b style="color:var(--navy)">${esc(doc.estado_doc)}</b>${doc.ciclos > 1 ? ` · ${doc.ciclos} envíos` : ''}${doc.rechazos ? ` · ${doc.rechazos} rechazo${doc.rechazos > 1 ? 's' : ''}` : ''}</div>`;
        else if (doc.vinculo === 'ambiguo') control = ro ? '<span style="font-size:11px;color:#C0392B">Hay más de un documento posible</span>'
          : `<select style="font-size:12px;padding:4px 6px;max-width:170px" onchange="planAct('${a.id}',{doc_id:Number(this.value)})"><option value="">¿Qué documento es?</option>${doc.candidatos.map(c => `<option value="${c.id}">${esc(c.codigo)}</option>`).join('')}</select>`;
        else control = '<span style="font-size:11px;color:var(--gris)">📄 Todavía no existe en DocTracker</span>';
      } else if (a.kind === 'milestone') control = '<span style="font-size:11px;color:var(--gris)">Se cumple solo</span>';
      else if (ro) control = `<span style="font-size:11px;color:var(--gris)">${(EST.find(e => e[0] === pr.estado_propio) || EST[0])[1]}</span>`;
      else control = `<select style="font-size:12px;padding:4px 6px" onchange="planEstado('${a.id}',this.value,'${pr.estado_propio || 'not_started'}')">${EST.map(([k, t]) => `<option value="${k}" ${k === (pr.estado_propio || 'not_started') ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <div style="margin-top:3px"><a href="#" style="font-size:11px" onclick="planBloqueo('${a.id}');return false">${pr.bloqueo_motivo ? 'Quitar bloqueo' : 'Marcar bloqueo'}</a></div>`;
      const fechas = hecho ? `${plDm(a.inicio)} → ${plDm(a.fin)}` : `${plDm(a.inicio)} → ${plDm(a.fin)}`;
      const dv = a.desvio_dias, plan = a.base ? `<div style="font-size:11px;color:${dv > 0 && a.estado !== 'cancelada' ? '#C0392B' : 'var(--gris)'}">plan ${plDm(a.base.fin)}${dv > 0 ? ` · +${dv} d` : dv < 0 && hecho ? ` · ${dv} d` : ''}</div>` : '';
      const marcas = pr.checklist || [];
      h += `<div style="display:grid;grid-template-columns:22px minmax(200px,1fr) 140px 120px 180px;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--fondo)">
        <span class="tilde ${hecho ? 'done' : ''}"></span>
        <div style="font-size:13px"><span style="${hecho || a.estado === 'cancelada' ? 'color:var(--gris)' : 'font-weight:600'}${a.estado === 'cancelada' ? ';text-decoration:line-through' : ''}">${a.kind === 'milestone' ? '◆ ' : ''}${esc(a.titulo)}</span>
          ${doc ? ' ' + plTagDoc(a) : ''}${a.contractual ? ` <span class="tag" style="background:#F0EAFB;color:#6B4FA3">CONTRACTUAL</span>` : ''}
          ${a.responsable !== 'vadoca' && a.kind === 'task' ? ` <span class="tag" style="background:#E3EEF8;color:#1663A8">${a.responsable === 'client' ? 'CLIENTE' : 'TERCERO'}</span>` : ''}
          ${faltan.length && !hecho ? `<div style="font-size:11px;color:var(--gris);margin-top:2px">🔒 Espera a: ${faltan.map(esc).join(' · ')}</div>` : ''}
          ${pr.bloqueo_motivo ? `<div style="font-size:11px;color:#C0392B;margin-top:2px">⛔ Bloqueada: ${esc(pr.bloqueo_motivo)}</div>` : ''}
          ${a.committed_date ? `<div style="font-size:11px;color:${a.fin > a.committed_date && !hecho ? '#C0392B' : 'var(--gris)'};margin-top:2px">Comprometida para el ${plDmy(a.committed_date)}</div>` : ''}
          ${a.checklist.length ? `<div style="font-size:11.5px;color:var(--gris-osc);margin-top:3px">${a.checklist.map((c, i) => `<label style="margin-right:12px;white-space:nowrap;font-weight:400;display:inline"><input type="checkbox" style="width:auto;margin-right:3px;vertical-align:-2px" ${marcas[i] ? 'checked' : ''} ${ro || a.kind !== 'task' ? 'disabled' : ''} onchange="planCheck('${a.id}',${i},this.checked)">${esc(c)}</label>`).join('')}</div>` : ''}</div>
        <div>${plChip(a)}</div>
        <div style="font-size:12px;white-space:nowrap">${fechas}${doc && doc.fechas_ajustadas ? ' <span title="Fechas cargadas a mano en el plan">✎</span>' : ''}${plan}
          ${!ro && ((a.kind === 'task' && pr.estado_propio && pr.estado_propio !== 'not_started') || (doc && doc.vinculo === 'ok' && doc.estado_doc !== 'Borrador')) ? `<a href="#" style="font-size:11px" onclick="planFechas('${a.id}');return false">Ajustar fechas</a>` : ''}</div>
        <div style="text-align:right">${control}</div></div>`;
    }
  }
  if (D.hitos.length) h += `<div class="seccion">Hitos comerciales</div>` + D.hitos.map(m => `<div style="display:grid;grid-template-columns:22px minmax(200px,1fr) 140px 300px;gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--fondo);font-size:13px">
      <span class="tilde ${m.gestionado ? 'done' : ''}"></span>
      <div><b>${esc(m.titulo)}</b>${m.percent != null ? ' · ' + m.percent + ' %' : ''}<div style="font-size:11px;color:var(--gris)">Se habilita con: ${esc(m.trigger_titulo)}${m.habilitado ? '' : ' · estimado ' + plDm(m.fecha_estimada)}</div></div>
      <div>${m.gestionado ? '<span class="chip c-cerrado"><span class="punto"></span>Gestionado</span>' : m.habilitado ? '<span class="chip c-mia"><span class="punto"></span>Para gestionar</span>' : '<span class="chip" style="background:#EEF2F5;color:#6D7985">Todavía no</span>'}</div>
      <div style="font-size:12px;color:var(--gris);text-align:right">${m.proposal_ref ? 'Presupuesto ' + esc(m.proposal_ref) + ' · ' : ''}importes y facturas en Comercial
        ${m.habilitado && !ro ? `<br><label style="font-weight:400;display:inline"><input type="checkbox" style="width:auto;vertical-align:-2px" ${m.gestionado ? 'checked' : ''} onchange="planAct('hito:${m.id}',{gestionado:this.checked})"> Ya lo gestioné</label>` : ''}</div></div>`).join('');
  return h;
}

function planVersiones(D) {
  const tarj = D.versiones.slice().reverse().map(v => {
    const r = v.resumen || {}, d = r.diferencias, ant = D.versiones.find(z => z.numero === v.numero - 1);
    let cambios = '';
    if (v.tipo === 'pausa' && r.pausa) cambios = `<div style="font-size:12.5px;margin-top:6px">⏸ Proyecto en pausa del <b>${plDmy(r.pausa.desde)}</b> al <b>${plDmy(r.pausa.hasta)}</b> (${plDias(r.pausa.dias_habiles)}). Lo pendiente se corrió; lo ya hecho no cambió.</div>`;
    else if (d) { const li = [];
      for (const a of d.agregadas) li.push(`<li><b style="color:#2E9E5B">+ Agregada:</b> ${esc(a.titulo)}</li>`);
      for (const a of d.quitadas) li.push(`<li><b style="color:#C0392B">− Quitada:</b> ${esc(a.titulo)}</li>`);
      for (const a of d.cambiadas) li.push(`<li><b>Modificada:</b> ${esc(a.titulo)} — ${a.cambios.map(c => `${esc(c.campo)} ${esc(Array.isArray(c.antes) ? c.antes.length + ' → ' + c.despues.length : (c.antes ?? '—') + ' → ' + (c.despues ?? '—'))}`).join('; ')}</li>`);
      for (const c of d.proyecto) li.push(`<li><b>Proyecto:</b> ${esc(c.campo)} ${esc((c.antes ?? '—') + ' → ' + (c.despues ?? '—'))}</li>`);
      cambios = li.length ? `<ul style="font-size:12.5px;margin:6px 0 0 18px;line-height:1.6">${li.join('')}</ul>` : ''; }
    else if (v.numero === 1) cambios = `<div style="font-size:12.5px;margin-top:6px;color:var(--gris)">${r.actividades || ''} actividades · ${r.documentales || 0} documentales · ${r.propias || 0} propias</div>`;
    return `<div style="border:1px solid ${v.numero === D.version_vigente ? 'var(--turq)' : 'var(--borde)'};border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff">
      <div class="fila" style="justify-content:space-between;flex-wrap:wrap;gap:6px">
        <div><b style="font-size:14px">Versión ${v.numero}</b>${v.numero === D.version_vigente ? ' <span class="tag" style="background:#E6F7F7;color:#007E80">VIGENTE</span>' : ''}
          <span class="muted" style="font-size:12px;margin-left:6px">${new Date(v.creado).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })} · ${esc(v.autor)}</span></div>
        <button class="btn sec mini" onclick="PLAN_VER=${v.numero === D.version_vigente ? 'null' : v.numero};PLAN_SUB='gantt';planRecargar()">Ver este Gantt</button></div>
      <div style="font-size:13px;margin-top:6px">${v.numero === 1 ? 'Plan inicial.' : `<b>Motivo:</b> ${esc(v.motivo)} · <b>Pidió el cambio:</b> ${plOrigen(v.origen)}`}${v.referencia ? ` · <b>Evidencia:</b> ${plRef(v.referencia)}` : ''}</div>
      <div style="font-size:13px;margin-top:4px">Fin planificado: ${ant ? `${plDmy(ant.fin_planificado)} → ` : ''}<b>${plDmy(v.fin_planificado)}</b></div>
      ${cambios}</div>`; }).join('');
  const TIPO = { version: '📌', pausa: '⏸', reprogramacion: '↻', actividad: '✎', hito: '◆' };
  return `<div class="seccion">Versiones del plan</div>${tarj}
    <div class="seccion" style="margin-top:20px">Registro de cambios</div>
    <div style="max-height:320px;overflow:auto">${D.historial.map(n => `<div style="padding:6px 4px;border-bottom:1px solid var(--fondo);font-size:12.5px">
      <span class="muted" style="font-size:11px">${TIPO[n.tipo] || '·'} ${new Date(n.ts).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' })} · ${esc(n.autor === 'sistema' ? 'Automático' : n.autor)}</span><br>${esc(n.texto.replace(/(\d{4})-(\d\d)-(\d\d)/g, '$3/$2/$1'))}</div>`).join('') || '<div class="muted">Sin movimientos todavía.</div>'}</div>`;
}

/* ---------- Acciones ---------- */
async function planAct(id, cuerpo, ok) {
  try { await api('/api/planificacion/' + encodeURIComponent(PROY_SEL) + '/actividades/' + encodeURIComponent(id), { method: 'PATCH', body: cuerpo }); if (ok) toast(ok); }
  catch (e) { toast(e.message, 'err'); }
  await planRecargar();
}
function planEstado(id, nuevo, viejo) {
  const cerrada = ['done', 'cancelled'].includes(viejo);
  if (nuevo === 'cancelled' || cerrada) {
    planModal(`<h3>${cerrada ? 'Reabrir la actividad' : 'Cancelar la actividad'}</h3>
      <label>Motivo</label><textarea id="plMot" rows="3" placeholder="${cerrada ? 'Por qué se reabre' : 'Por qué se cancela'}"></textarea>
      <div class="acciones"><button class="btn sec" onclick="ftCerrarModal();planPintar()">Volver</button>
      <button class="btn" onclick="const m=document.getElementById('plMot').value.trim(); if(!m){toast('Falta el motivo','err');return;} ftCerrarModal(); planAct('${id}',{estado:'${nuevo}',motivo:m})">Confirmar</button></div>`, 440);
    return;
  }
  planAct(id, { estado: nuevo });
}
function planCheck(id, i, valor) {
  const a = PLANES[PROY_SEL].actividades.find(x => x.id === id), m = a.checklist.map((_, k) => !!(a.propio.checklist || [])[k]); m[i] = valor;
  planAct(id, { checklist: m });
}
function planBloqueo(id) {
  const a = PLANES[PROY_SEL].actividades.find(x => x.id === id);
  if (a.propio.bloqueo_motivo) return planAct(id, { bloqueo_motivo: '' }, 'Bloqueo quitado');
  planModal(`<h3>Marcar bloqueo</h3><div class="muted" style="font-size:12.5px">${esc(a.titulo)}</div>
    <label>¿Qué la está frenando?</label><textarea id="plMot" rows="3" placeholder="Ej.: falta el usuario de acceso que tiene que dar TI"></textarea>
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Volver</button>
    <button class="btn" onclick="const m=document.getElementById('plMot').value.trim(); if(!m){toast('Falta el motivo','err');return;} ftCerrarModal(); planAct('${id}',{bloqueo_motivo:m})">Guardar</button></div>`, 440);
}
/* Fecha propia: por defecto las fechas son automáticas; acá se corrige cuándo pasó algo de verdad. */
function planFechas(id) {
  const a = PLANES[PROY_SEL].actividades.find(x => x.id === id), doc = a.kind === 'document';
  const fin = ['terminada', 'cancelada'].includes(a.estado), env = doc && (fin || a.estado === 'esperando');
  planModal(`<h3>Ajustar fechas</h3><div class="muted" style="font-size:12.5px">${esc(a.titulo)}</div>
    <div class="muted" style="font-size:12px;margin-top:6px">${doc ? 'Las fechas salen solas de DocTracker. Si cargaste el estado otro día, corregilas acá: cambia solo el plan, DocTracker queda igual.' : 'Por defecto queda la fecha del día en que cambiaste el estado.'}</div>
    <label>${doc ? 'Empezó a trabajarse (salió de Borrador)' : 'Empezó'}</label><input type="date" id="plFi" max="${hoyISO()}" value="${a.inicio}">
    ${env ? `<label>Se envió al cliente</label><input type="date" id="plFe" max="${hoyISO()}" value="${a.interno}">` : ''}
    ${fin ? `<label>${doc ? 'Se entregó' : 'Terminó'}</label><input type="date" id="plFf" max="${hoyISO()}" value="${a.fin}">` : ''}
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
      ${doc && a.documento.fechas_ajustadas ? `<button class="btn sec" onclick="ftCerrarModal();planAct('${id}',{fechas:{inicio:null,enviado:null,fin:null}},'Fechas otra vez automáticas')">Volver a automático</button>` : ''}
      <button class="btn" onclick="planFechasGuardar('${id}')">Guardar</button></div>`, 440);
}
function planFechasGuardar(id) {
  const g = i => { const e = document.getElementById(i); return e ? e.value : undefined; }, f = {};
  if (g('plFi')) f.inicio = g('plFi'); if (g('plFe')) f.enviado = g('plFe'); if (g('plFf')) f.fin = g('plFf');
  ftCerrarModal(); planAct(id, { fechas: f }, 'Fechas actualizadas');
}
function planModal(html, ancho) { ftAbrirModal(html); document.getElementById('modalCaja').style.maxWidth = ancho + 'px'; }

/* Importar o actualizar el plan pegando el JSON */
function planModalImportar() {
  const D = PLANES[PROY_SEL] || {}, p = todosProyectos().find(x => x.codigo === PROY_SEL);
  PLAN_REV = null;
  planModal(`<h3>${D.existe ? 'Actualizar el plan (versión ' + (D.version_vigente + 1) + ')' : 'Importar plan del proyecto'}</h3>
    <div class="muted" style="font-size:12.5px">${esc(PROY_SEL)} · ${esc(p ? p.nombre : '')}</div>
    <label>Pegá acá el JSON del plan</label>
    <textarea id="plTxt" rows="11" spellcheck="false" style="font-family:'Courier New',monospace;font-size:12px;white-space:pre" placeholder='{ "schema_version": "0.2", "project": { … }, "phases": [ … ], "activities": [ … ] }' oninput="planRevLimpiar()"></textarea>
    <div class="fila" style="justify-content:space-between;margin-top:6px">
      <span style="font-size:11.5px;color:var(--gris)">Podés pegarlo tal cual sale del chat, con las comillas de código incluidas.</span>
      <span><input type="file" id="plArch" accept=".json,application/json,text/plain" style="display:none" onchange="planLeerArchivo(this)">
      <a href="#" style="font-size:11.5px" onclick="document.getElementById('plArch').click();return false">o elegir archivo .json</a></span></div>
    <div id="plRev"></div>
    <div class="acciones" id="plAcc"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button><button class="btn" onclick="planRevisar()">Revisar</button></div>`, 660);
  setTimeout(() => { const t = document.getElementById('plTxt'); if (t) t.focus(); }, 50);
}
function planLeerArchivo(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { document.getElementById('plTxt').value = r.result; planRevLimpiar(); planRevisar(); }; r.readAsText(f); }
function planRevLimpiar() { if (!PLAN_REV) return; PLAN_REV = null; document.getElementById('plRev').innerHTML = '';
  document.getElementById('plAcc').innerHTML = `<button class="btn sec" onclick="ftCerrarModal()">Cancelar</button><button class="btn" onclick="planRevisar()">Revisar</button>`; }
async function planRevisar() {
  const texto = document.getElementById('plTxt').value, box = document.getElementById('plRev');
  if (!texto.trim()) { toast('Pegá el JSON del plan', 'err'); return; }
  box.innerHTML = '<div class="muted" style="margin-top:12px">Revisando…</div>';
  let r; try { r = await api('/api/planificacion/' + encodeURIComponent(PROY_SEL) + '/revisar', { method: 'POST', body: { texto } }); }
  catch (e) { box.innerHTML = `<div style="background:#FBE9E7;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px;color:#C0392B">${esc(e.message)}</div>`; return; }
  if (!r.ok) { box.innerHTML = `<div style="background:#FBE9E7;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px;color:#8E2A1E">
      <b>✖ No se puede importar.</b> No se guardó nada. ${r.errores.length > 1 ? 'Hay ' + r.errores.length + ' cosas para corregir:' : ''}
      <ul style="margin:6px 0 0 18px;line-height:1.6">${r.errores.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`; return; }
  PLAN_REV = r; const s = r.resumen, d = r.diferencias;
  if (r.sin_cambios) { box.innerHTML = `<div style="background:#EEF2F5;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px">Este JSON es <b>igual al plan vigente</b>. No hay nada para actualizar.</div>`; return; }

// Árbol: proyecto → expedientes ABIERTOS (amarillo) → documentos por color.
// Los expedientes 100% cerrados no aparecen. Clic en un expediente lo expande/colapsa.
function arbolProyecto(p, exps) {
  const abiertos = [...exps.entries()].filter(([, docs]) => docs.some(d => canchaDoc(d.estado) !== 'cerrado'));
  if (!abiertos.length) return '<div class="tarea-vacia">🎉 Todos los expedientes están cerrados — no queda nada abierto en este proyecto.</div>';
  const cerradosOcultos = exps.size - abiertos.length;

  let ramas = '';
  for (const [expId, docs] of abiertos) {
    const n = { mia:0, cliente:0, cerrado:0 };
    for (const d of docs) n[canchaDoc(d.estado)]++;
    const abierto = ARBOL_EXP.has(expId);
    const resumen = ['mia','cliente','cerrado'].filter(c => n[c])
      .map(c => `<span style="background:${ARBOL_COLOR[c]}">${n[c]}</span>`).join('');
    const hojas = !abierto ? '' : `<div class="hojas">${docs
      .slice().sort((a,b) => ordenTipo(a.tipo_doc) - ordenTipo(b.tipo_doc))
      .map(d => { const c = ARBOL_COLOR[canchaDoc(d.estado)];
        return `<div class="hoja" style="--h-color:${c}">
          <span class="hoja-chip" style="background:${c}" title="${esc(d.codigo)}">${esc(d.tipo_doc || '')} ${esc(d.prot_inf || '')} · ${esc(d.estado)}${d.estado === 'Entregado' ? ' ✓' : ''}</span>
        </div>`; }).join('')}</div>`;
    ramas += `<div class="exp-nodo">
      <div class="exp-caja" onclick="toggleExp('${esc(expId)}')">
        <span class="caret">${abierto ? '▾' : '▸'}</span>
        <b>${esc(expId)}</b>
        <span class="desc">${esc(docs[0].descripcion || '')}</span>
        <span class="resumen">${resumen}</span>
      </div>
      ${hojas}
    </div>`;
  }

  return `<div class="arbol">
      <div class="raiz">${esc(p.codigo)} · ${esc(p.nombre)}</div>
      <div class="ramas">${ramas}</div>
    </div>
    <div class="leyenda">
      <span><span class="celda" style="background:${ARBOL_COLOR.mia}"></span>Tenés que entregarlo</span>
      <span><span class="celda" style="background:${ARBOL_COLOR.cliente}"></span>Lo tiene el cliente</span>
      <span><span class="celda" style="background:${ARBOL_COLOR.cerrado}"></span>Entregado</span>
      ${cerradosOcultos ? `<span class="muted">· ${cerradosOcultos} expediente(s) cerrados ocultos</span>` : ''}
    </div>`;
}
function toggleExp(id){ ARBOL_EXP.has(id) ? ARBOL_EXP.delete(id) : ARBOL_EXP.add(id); ftRender(); }

// Matriz: filas = expedientes, columnas = tipo P / tipo I.
// Los documentos legacy "PI" (protocolo+informe unificados) alimentan AMBAS columnas
// de su tipo, así no queda una tercera columna PI llena de agujeros.
function mapaProyecto(exps) {
  const colsDe = d => {
    const t = (d.tipo_doc || '?').toUpperCase().trim();
    const pi = (d.prot_inf || '').toUpperCase().trim();
    if (pi === 'PI') return [t + ' P', t + ' I'];
    return [(t + (pi ? ' ' + pi : '')).trim()];
  };
  const rangoPI = s => ({ 'P': 0, 'I': 1 }[s] ?? 9);
  const cols = [...new Set([...exps.values()].flat().flatMap(colsDe))]
    .sort((a, b) => {
      const [ta, pa] = a.split(' '), [tb, pb] = b.split(' ');
      return ordenTipo(ta) - ordenTipo(tb) || rangoPI(pa) - rangoPI(pb) || a.localeCompare(b);
    });
  let filas = '';
  // Más nuevos arriba: en batches largos, los viejos ya cerrados se van al fondo
  for (const [expId, docs] of [...exps.entries()].reverse()) {
    let celdas = '';
    for (const c of cols) {
      const ds = docs.filter(d => colsDe(d).includes(c));
      if (!ds.length) { celdas += '<td><div class="celda vacia" title="No aplica — no es entregable de este expediente">–</div></td>'; continue; }
      // Si hay varios docs del mismo tipo (P + I, versiones), manda el "peor": tu cancha > cliente > cerrado
      const canchas = ds.map(d => canchaDoc(d.estado));
      const peor = canchas.includes('mia') ? 'mia' : canchas.includes('cliente') ? 'cliente' : 'cerrado';
      const titulo = ds.map(d => `${d.codigo} (${(d.prot_inf || '').toUpperCase() === 'PI' ? 'PI unificado' : d.prot_inf || '—'}): ${d.estado}`).join('\n');
      celdas += `<td><div class="celda" style="background:${CANCHA_COLOR[peor]}" title="${esc(titulo)}"></div></td>`;
    }
    const desc = (docs => (docs[0].descripcion || ''))(exps.get(expId));
    filas += `<tr><td class="exp-nom" title="${esc(desc)}">${esc(expId)}</td>${celdas}</tr>`;
  }
  return `<div class="mapa-wrap"><table class="mapa">
      <tr><th style="text-align:left">Expediente</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
      ${filas}</table></div>
    <div class="leyenda">
      <span><span class="celda" style="background:${CANCHA_COLOR.mia}"></span>En tu cancha</span>
      <span><span class="celda" style="background:${CANCHA_COLOR.cliente}"></span>Espera al cliente</span>
      <span><span class="celda" style="background:${CANCHA_COLOR.cerrado}"></span>Cerrado</span>
      <span><span class="celda vacia">–</span>No aplica</span>
      <span class="muted">· Los PI viejos (protocolo+informe unificados) llenan ambas columnas; el hover detalla cada documento</span>
    </div>`;
}

/* ---------- Vista FACTURACIÓN ---------- */
let FACT_F = { cliente:'', estado:'todas', presEstado:'todas',
  desde: new Date(Date.now() - 180*864e5).toISOString().slice(0,10), hasta:'' };
const fmtMonto = (n, m) => (m === 'USD' ? 'USD ' : '$ ') + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 2 });

function factRango(desde, hasta) { FACT_F.desde = desde; FACT_F.hasta = hasta; ftRender(); }
function enRango(f) { return (!FACT_F.desde || (f || '') >= FACT_F.desde) && (!FACT_F.hasta || (f || '') <= FACT_F.hasta); }

function vistaComercial() {
  const todas = DATA.facturas || [];
  const clientes = [...new Set([
    ...todas.map(f => f.cliente),
    ...(DATA.presupuestos || []).map(p => p.cliente_nombre)
  ].filter(Boolean))].sort();

  // Totales del período, separados por moneda:
  // Facturado y Pendiente por fecha de emisión; Cobrado por fecha de cobro.
  const tot = { fact:{}, cob:{}, pend:{}, sinFacturar:{} };
  for (const f of todas) {
    if ((FACT_F.cliente && f.cliente !== FACT_F.cliente)) continue;
    if (enRango(f.fecha_emision)) {
      tot.fact[f.moneda] = (tot.fact[f.moneda] || 0) + +f.monto;
      if (f.estado !== 'Cobrada') tot.pend[f.moneda] = (tot.pend[f.moneda] || 0) + +f.monto;
    }
    if (f.estado === 'Cobrada' && enRango(f.fecha_cobro))
      tot.cob[f.moneda] = (tot.cob[f.moneda] || 0) + +f.monto;
  }
  // Por facturar: presupuestos Aceptados sin NINGUNA factura cargada todavía, en su propia
  // moneda. No se resta lo ya facturado en otra moneda (presupuesto USD / factura ARS,
  // tu caso típico) porque restar entre monedas distintas inventaría un tipo de cambio
  // que nadie pidió — así que esto es "trabajo aceptado, cero facturado", no un saldo neto.
  for (const p of (DATA.presupuestos || [])) {
    if (FACT_F.cliente && p.cliente_nombre !== FACT_F.cliente) continue;
    if (p.estado !== 'Aceptado') continue;
    const tieneFactura = todas.some(f => f.presupuesto === p.codigo);
    if (!tieneFactura && p.monto) tot.sinFacturar[p.moneda || 'ARS'] = (tot.sinFacturar[p.moneda || 'ARS'] || 0) + +p.monto;
  }
  const rTot = o => Object.keys(o).sort().map(m => `<div style="font-size:16px;font-weight:700">${fmtMonto(o[m], m)}</div>`).join('') || '<div class="muted">—</div>';

  const lista = todas.filter(f =>
    (!FACT_F.cliente || f.cliente === FACT_F.cliente) &&
    (FACT_F.estado === 'todas' || f.estado === FACT_F.estado) &&
    enRango(f.fecha_emision));

  const hoy = new Date(); const y = hoy.getFullYear();
  const hace3m = new Date(hoy - 90*864e5).toISOString().slice(0,10);
  const hace6m = new Date(hoy - 180*864e5).toISOString().slice(0,10);

  // Presupuestos: gestión completa. El correlativo lo asigna DocTracker.
  const PRES_ESTADOS = ['Borrador','Enviado','Aceptado','Rechazado','Vencido'];
  const presRelevantes = (DATA.presupuestos || []).filter(p =>
    (!FACT_F.cliente || p.cliente_nombre === FACT_F.cliente) &&
    (FACT_F.presEstado === 'todas' || p.estado === FACT_F.presEstado));
  const htmlPres = presRelevantes.map(p => {
    const fs = todas.filter(f => f.presupuesto === p.codigo);
    const sumas = {};
    for (const f of fs) sumas[f.moneda] = (sumas[f.moneda] || 0) + +f.monto;
    const cobradas = fs.filter(f => f.estado === 'Cobrada').length;
    const pct = (p.moneda && sumas[p.moneda] && +p.monto) ? Math.round(sumas[p.moneda] / +p.monto * 100) : null;
    const cerrada = p.facturacion === 'Cerrada';
    const aceptado = p.estado === 'Aceptado';
    const sumasTxt = Object.keys(sumas).sort().map(m => fmtMonto(sumas[m], m)).join(' + ');
    const borde = cerrada ? '#2E9E5B' : aceptado ? '#E6B93C' : 'var(--borde)';
    return `<div class="card" style="border-left:4px solid ${borde}">
      <div class="fila" style="justify-content:space-between">
        <div style="min-width:0"><b>${esc(p.codigo)}</b> · ${esc(p.cliente_nombre || '')} <span class="muted">· ${esc((p.descripcion || '').slice(0,50))}</span>
          <div class="muted" style="margin-top:3px">Presupuesto: ${fmtMonto(p.monto || 0, p.moneda || 'ARS')}${p.fecha_emision ? ' · ' + esc(p.fecha_emision) : ''}${fs.length ? ` · ${fs.length} factura${fs.length === 1 ? '' : 's'} (${cobradas} cobrada${cobradas === 1 ? '' : 's'}) · Facturado: ${sumasTxt}${pct !== null ? ` · ${pct}%` : ''}` : ''}</div>
        </div>
        <div class="ops">
          ${esAdmin() ? `<select onchange="estadoPresup('${esc(p.codigo)}', this.value)" title="Estado del presupuesto">
            ${PRES_ESTADOS.map(s => `<option ${p.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select>`
            : `<span class="chip ${p.estado === 'Aceptado' ? 'c-cerrado' : 'c-mia'}"><span class="punto"></span>${esc(p.estado)}</span>`}
          ${aceptado ? `<span class="chip ${cerrada ? 'c-cerrado' : 'c-mia'}"><span class="punto"></span>Fact. ${cerrada ? 'cerrada' : 'abierta'}</span>
            ${cerrada && !fs.length ? `<span class="chip c-mia" title="El ciclo se cerró sin cargar ninguna factura — no suma a Facturado/Cobrado">⚠ sin facturas</span>` : ''}
            ${esLector() ? '' : cerrada
              ? `<button class="btn sec mini" onclick="cicloPresup('${esc(p.codigo)}','Abierta')">Reabrir</button>`
              : `<button class="btn mini" onclick="cicloPresup('${esc(p.codigo)}','Cerrada')">Cerrar ciclo</button>`}` : ''}
          ${esAdmin() ? `<button class="btn sec mini" title="Ficha y bitácora del presupuesto" onclick="abrirPresu('${esc(p.codigo)}')">🗒</button>
          <button class="btn sec mini" title="Editar datos" onclick="modalEditarPresup('${esc(p.codigo)}')">✎</button>
          <button class="btn sec mini" title="Adjuntar archivo (presupuesto, comprobantes) a la carpeta Drive con bitácora" onclick="modalAdjunto('${esc(p.codigo)}','')">📎</button>` : ''}
          ${p.carpeta_drive_url ? `<a href="${esc(p.carpeta_drive_url)}" target="_blank" class="btn sec mini" style="text-decoration:none" title="Abrir carpeta en Drive">🗂</a>` : ''}
        </div>
      </div></div>`;
  }).join('');

  return `<div class="fila" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="font-size:17px">Comercial · presupuestos y facturación</h2>
      <div class="fila">
        ${esAdmin() ? `<button class="btn sec mini" onclick="modalNuevoPresup()">+ Presupuesto</button>` : ''}
        ${esLector() ? '' : `<button class="btn mini" onclick="modalFactura(null)">+ Nueva factura</button>`}
      </div></div>

    <div class="card"><div class="fila">
      <select onchange="FACT_F.cliente=this.value;ftRender()">
        <option value="">Todos los clientes</option>
        ${clientes.map(c => `<option ${FACT_F.cliente === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select onchange="FACT_F.presEstado=this.value;ftRender()" title="Filtra la sección Por presupuesto">
        <option value="todas" ${FACT_F.presEstado === 'todas' ? 'selected' : ''}>Presupuestos: todos los estados</option>
        ${PRES_ESTADOS.map(s => `<option value="${s}" ${FACT_F.presEstado === s ? 'selected' : ''}>Presupuestos: ${s}</option>`).join('')}</select>
      <select onchange="FACT_F.estado=this.value;ftRender()" title="Filtra la lista de facturas y los totales de abajo">
        <option value="todas" ${FACT_F.estado === 'todas' ? 'selected' : ''}>Facturas: todas</option>
        <option value="Emitida" ${FACT_F.estado === 'Emitida' ? 'selected' : ''}>Facturas: emitidas (sin cobrar)</option>
        <option value="Cobrada" ${FACT_F.estado === 'Cobrada' ? 'selected' : ''}>Facturas: cobradas</option></select>
      <input type="date" value="${esc(FACT_F.desde)}" onchange="FACT_F.desde=this.value;ftRender()" title="Desde">
      <input type="date" value="${esc(FACT_F.hasta)}" onchange="FACT_F.hasta=this.value;ftRender()" title="Hasta">
      <div class="modo-btns">
        <button onclick="factRango('${hace3m}','')">3 meses</button>
        <button onclick="factRango('${hace6m}','')">6 meses</button>
        <button onclick="factRango('${y}-01-01','')">Este año</button>
        <button onclick="factRango('','')">Todo</button></div>
    </div></div>

    <div class="hoy-grid" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <div class="card"><div class="muted" style="font-weight:600">FACTURADO</div>${rTot(tot.fact)}</div>
      <div class="card"><div class="muted" style="font-weight:600;color:#1F7A44">COBRADO</div>${rTot(tot.cob)}</div>
      <div class="card"><div class="muted" style="font-weight:600;color:#9A5B12">PENDIENTE DE COBRO</div>${rTot(tot.pend)}</div>
      <div class="card" title="Presupuestos Aceptados sin ninguna factura cargada todavía, en su propia moneda">
        <div class="muted" style="font-weight:600;color:#6D4FA3">POR FACTURAR</div>${rTot(tot.sinFacturar)}</div>
    </div>

    ${htmlPres ? `<div class="seccion">Por presupuesto</div>${htmlPres}` : ''}
    <div class="seccion">Facturas</div>
    <div class="card">
    ${lista.map(f => {
      const pres = (DATA.presupuestos || []).find(p => p.codigo === f.presupuesto);
      return `<div class="item-row" style="grid-template-columns:1fr auto">
        <div class="nom"><b>${esc(f.numero)}</b> · ${esc(f.cliente)} <span class="muted">· ${esc(f.fecha_emision)}</span>
          ${f.presupuesto ? `<span class="doc">Presup. ${esc(f.presupuesto)}${pres ? ` (${fmtMonto(pres.monto || 0, pres.moneda || 'ARS')})` : ''}</span>` : ''}
          ${f.estado === 'Cobrada' && f.fecha_cobro ? `<span class="doc" style="color:#1F7A44">Cobrada el ${esc(f.fecha_cobro)}</span>` : ''}
        </div>
        <div class="ops">
          <b style="font-size:13px">${fmtMonto(f.monto, f.moneda)}</b>
          <span class="chip ${f.estado === 'Cobrada' ? 'c-cerrado' : 'c-mia'}"><span class="punto"></span>${esc(f.estado)}</span>
          ${!esLector() && f.estado !== 'Cobrada' ? `<button class="btn mini" onclick="cobrarFactura(${f.id})">Cobrar</button>` : ''}
          ${esAdmin() && f.presupuesto ? `<button class="btn sec mini" title="Adjuntar PDF de la factura o comprobante de pago" onclick="modalAdjunto('${esc(f.presupuesto)}','[Factura ${esc(f.numero)}] ')">📎</button>` : ''}
          ${esLector() ? '' : `<button class="btn sec mini" onclick="modalFactura(${f.id})">✎</button>
          <button class="btn rojo mini" onclick="borrarFactura(${f.id})">✕</button>`}
        </div>
      </div>`; }).join('') || '<div class="tarea-vacia">No hay facturas en este filtro.</div>'}
    </div>`;
}

function modalFactura(id) {
  const f = id ? DATA.facturas.find(x => x.id === id) : { numero:'', cliente:'', presupuesto:'', fecha_emision: hoyISO(), monto:'', moneda:'ARS', notas:'' };
  // Solo presupuestos Aceptados con ciclo de facturación abierto (más el ya vinculado, si se edita)
  const pres = (DATA.presupuestos || []).filter(p =>
    (p.estado === 'Aceptado' && p.facturacion !== 'Cerrada') || p.codigo === f.presupuesto);
  ftAbrirModal(`<h3>${id ? 'Editar' : 'Nueva'} factura</h3>
    <label>Número</label><input id="fNum" value="${esc(f.numero)}" placeholder="Ej: 0003-00000123">
    <label>Presupuesto vinculado (opcional)</label>
    <select id="fPres" onchange="presupSeleccionado()">
      <option value="">— Sin presupuesto —</option>
      ${pres.map(p => `<option value="${esc(p.codigo)}" data-cliente="${esc(p.cliente_nombre || '')}" ${f.presupuesto === p.codigo ? 'selected' : ''}>
        ${esc(p.codigo)} · ${esc(p.cliente_nombre || '')} · ${fmtMonto(p.monto || 0, p.moneda || 'ARS')} · ${esc(p.estado)}</option>`).join('')}</select>
    <div class="muted" id="fPresRef" style="margin-top:4px"></div>
    <label>Cliente</label><input id="fCli" value="${esc(f.cliente)}" list="fClientes">
    <datalist id="fClientes">${[...new Set([...(DATA.facturas||[]).map(x=>x.cliente), ...pres.map(p=>p.cliente_nombre)].filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <label>Fecha de emisión</label><input id="fFec" type="date" value="${esc(f.fecha_emision)}">
    <div class="fila"><div style="flex:1"><label>Monto de la factura</label><input id="fMonto" type="number" step="0.01" value="${esc(f.monto)}"></div>
    <div><label>Moneda</label><select id="fMon"><option ${f.moneda === 'ARS' ? 'selected' : ''}>ARS</option><option ${f.moneda === 'USD' ? 'selected' : ''}>USD</option></select></div></div>
    <label>Notas</label><input id="fNotas" value="${esc(f.notas)}">
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="guardarFactura(${id ?? 'null'})">Guardar</button></div>`);
  presupSeleccionado(true);
}
function presupSeleccionado(soloRef) {
  const sel = document.getElementById('fPres');
  const op = sel.options[sel.selectedIndex];
  const p = (DATA.presupuestos || []).find(x => x.codigo === sel.value);
  document.getElementById('fPresRef').textContent = p ? `Referencia del presupuesto: ${fmtMonto(p.monto || 0, p.moneda || 'ARS')} — la factura lleva su propio monto y moneda` : '';
  if (!soloRef && op && op.dataset.cliente) document.getElementById('fCli').value = op.dataset.cliente;
}
async function guardarFactura(id) {
  const body = {
    numero: document.getElementById('fNum').value.trim(),
    presupuesto: document.getElementById('fPres').value,
    cliente: document.getElementById('fCli').value.trim(),
    fecha_emision: document.getElementById('fFec').value,
    monto: +document.getElementById('fMonto').value || 0,
    moneda: document.getElementById('fMon').value,
    notas: document.getElementById('fNotas').value.trim()
  };
  if (!body.numero || !body.fecha_emision) return alert('Faltan número o fecha');
  try {
    if (id) await api('/api/seguimiento/facturas/' + id, { method:'PATCH', body });
    else await api('/api/seguimiento/facturas', { method:'POST', body });
    ftCerrarModal(); await ftCargar(); ftRender();
  } catch(e){ alert(e.message); }
}
async function cobrarFactura(id) {
  const fecha = prompt('Fecha de cobro:', hoyISO());
  if (!fecha) return;
  try { await api('/api/seguimiento/facturas/' + id, { method:'PATCH', body:{ estado:'Cobrada', fecha_cobro: fecha } }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}
async function borrarFactura(id) {
  if (!confirm('¿Eliminar esta factura del registro?')) return;
  try { await api('/api/seguimiento/facturas/' + id, { method:'DELETE' }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}
async function cicloPresup(codigo, estado) {
  if (estado === 'Cerrada') {
    const tieneFacturas = (DATA.facturas || []).some(f => f.presupuesto === codigo);
    const msg = tieneFacturas
      ? `¿Cerrar el ciclo de facturación de ${codigo}? No vas a poder vincularle facturas nuevas (se puede reabrir).`
      : `${codigo} no tiene ninguna factura cargada todavía. Si lo cerrás así, no va a sumar en Facturado/Cobrado/Pendiente.\n\n¿Cerrar igual? (podés cargar las facturas primero con "+ Nueva factura" y volver después)`;
    if (!confirm(msg)) return;
  }
  try { await api('/api/seguimiento/presupuestos/' + encodeURIComponent(codigo) + '/facturacion', { method:'PATCH', body:{ estado } }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}

function modalAdjunto(codigo, prefijo) {
  ftAbrirModal(`<h3>Adjuntar a ${esc(codigo)}</h3>
    <p class="muted">Los archivos van a la carpeta Drive del presupuesto y quedan asentados en la bitácora.</p>
    <label>Archivos</label><input id="aFiles" type="file" multiple>
    <label>Nota</label><input id="aTexto" value="${esc(prefijo)}" placeholder="Ej: comprobante de transferencia del cliente">
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="subirAdjunto('${esc(codigo)}')">Subir</button></div>`);
}
async function subirAdjunto(codigo) {
  const files = document.getElementById('aFiles').files;
  const texto = document.getElementById('aTexto').value.trim();
  if (!files.length && !texto) return alert('Elegí al menos un archivo o escribí una nota');
  const fd = new FormData();
  for (const f of files) fd.append('archivos', f);
  fd.append('texto', texto);
  try {
    await api('/api/presupuestos/' + encodeURIComponent(codigo) + '/notas', { method:'POST', body: fd });
    ftCerrarModal(); await ftCargar(); ftRender();
  } catch(e){ alert(e.message); }
}

/* ---------- Vista TEMPLATES ---------- */
function vistaTemplates() {
  return `<div class="fila" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="font-size:17px">Templates de entregables</h2>
      <button class="btn mini" onclick="modalNuevoTemplate()">+ Nuevo</button></div>
    ${DATA.templates.map(t => `<div class="card">
      <div class="fila" style="justify-content:space-between">
        <h3 style="font-size:14px">${esc(t.nombre)} <span class="muted">· ${t.items.length} ítems</span></h3>
        <div class="fila">
          <button class="btn sec mini" onclick="modalEditarTemplate(${t.id})">Editar</button>
          <button class="btn rojo mini" onclick="borrarTemplate(${t.id})">✕</button></div>
      </div>
      <div class="muted" style="margin-top:6px">${t.items.map(esc).join(' → ') || 'Sin ítems (proyecto libre)'}</div>
    </div>`).join('')}`;
}
function modalNuevoTemplate(){ modalTpl({ id:null, nombre:'', items:[] }); }
function modalEditarTemplate(id){ modalTpl(DATA.templates.find(t => t.id === id)); }
function modalTpl(t) {
  ftAbrirModal(`<h3>${t.id ? 'Editar' : 'Nuevo'} template</h3>
    <label>Nombre</label><input id="tNom" value="${esc(t.nombre)}">
    <label>Ítems (uno por línea, en orden)</label>
    <textarea id="tIts" rows="10">${esc(t.items.join('\n'))}</textarea>
    <div class="acciones"><button class="btn sec" onclick="ftCerrarModal()">Cancelar</button>
    <button class="btn" onclick="guardarTemplate(${t.id ?? 'null'})">Guardar</button></div>`);
}
async function guardarTemplate(id) {
  const nombre = document.getElementById('tNom').value.trim();
  const items = document.getElementById('tIts').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!nombre) return alert('Falta el nombre');
  try {
    if (id) await api('/api/seguimiento/templates/' + id, { method:'PATCH', body:{ nombre, items } });
    else await api('/api/seguimiento/templates', { method:'POST', body:{ nombre, items } });
    ftCerrarModal(); await ftCargar(); ftRender();
  } catch(e){ alert(e.message); }
}
async function borrarTemplate(id) {
  if (!confirm('¿Eliminar template? Los ítems ya aplicados a proyectos no se tocan.')) return;
  try { await api('/api/seguimiento/templates/' + id, { method:'DELETE' }); await ftCargar(); ftRender(); }
  catch(e){ alert(e.message); }
}



/* ===================== PUENTE SUITE (módulos) ===================== */
let MODULO = 'dt';           // 'dt' DocTracker · 'ft' FlowTracker · 'com' Comercial
let COM_VIEW = 'lista';      // vista interna del módulo Comercial
async function ftCargar(){ DATA = await api('/api/seguimiento/data'); DATA.cargado = true; }
function renderCom(){
  const shell = $('#app');
  shell.innerHTML = '<div id="ftScope" class="ftui">' + (COM_VIEW === 'ficha' ? vistaPresuFicha() : vistaComercial()) + '</div>';
}
window.cambiarModulo = async function(m){
  if(!TOKEN) return;
  if(m === 'com' && !esAdmin()) return;
  MODULO = m;
  if((m === 'ft' || m === 'com') && !DATA.cargado){
    spin(true,'Cargando seguimiento…');
    try{ await ftCargar(); }catch(e){ toast(e.message,'err'); }
    spin(false);
  }
  if(m === 'com'){
    COM_VIEW = 'lista';
    if(esAdmin() && !PRESUS.length){ try{ await cargarPresus(); }catch(e){} }
  }
  render();
};
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') ftCerrarModal(); });
$$('#modSwitch button').forEach(b => b.addEventListener('click', () => cambiarModulo(b.dataset.mod)));

/* ----- Arranque ----- */
(async function(){
  render();
  if(TOKEN){
    spin(true,'Cargando registro…');
    try{ await cargarRegistro(); }catch(e){ /* sesión vencida ya manejada */ }
    spin(false); render();
  }
})();
</script>
</body>
