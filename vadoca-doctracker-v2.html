<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VADOCA · DocTracker v2</title>
<style>
  :root{
    --tq:#00B4B6; --tq-dark:#008C8E; --tq-soft:#E0F5F5;
    --g1:#435561; --g2:#6D7985; --g3:#AEB8C0; --g4:#E7ECEF;
    --bg:#F6F8F9; --card:#FFFFFF;
    --ok:#2E9E5B; --warn:#D98E04; --bad:#C94F3D;
    --mono:'Courier New',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--g1);font-size:15px;line-height:1.45}
  h1,h2,h3{font-weight:600}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;background:var(--tq);color:#fff;font-weight:600;transition:background .15s}
  button:hover{background:var(--tq-dark)}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tq);outline-offset:2px}
  button.sec{background:var(--g4);color:var(--g1)} button.sec:hover{background:var(--g3)}
  button.ghost{background:transparent;color:var(--tq);padding:6px 10px}
  button.rojo{background:var(--bad)}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font:inherit;border:1px solid var(--g3);border-radius:8px;padding:9px 11px;width:100%;background:#fff;color:var(--g1)}
  textarea{resize:vertical;min-height:80px}
  label{display:block;font-size:13px;font-weight:600;color:var(--g2);margin:12px 0 4px}
  a{color:var(--tq-dark)}
  header{background:var(--card);border-bottom:1px solid var(--g4);position:sticky;top:0;z-index:20}
  .hwrap{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-size:18px;font-weight:700;letter-spacing:.5px}
  .logo b{color:var(--tq)}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{background:transparent;color:var(--g2);font-weight:600;padding:8px 14px;border-radius:8px}
  nav button.active{background:var(--tq-soft);color:var(--tq-dark)}
  nav button:hover{background:var(--g4);color:var(--g1)}
  #userChip{font-size:12px;color:var(--g2)}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 90px}
  .card{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:18px;margin-bottom:14px}
  .muted{color:var(--g2);font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:180px}
  .codigo{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--tq-soft);color:var(--tq-dark);border-left:3px solid var(--tq);padding:3px 8px;border-radius:0 6px 6px 0;display:inline-block;letter-spacing:.3px}
  .hashchip{font-family:var(--mono);font-size:10px;color:var(--g3)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:12px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .stat:hover{border-color:var(--tq)}
  .stat.activa{border-color:var(--tq);background:var(--tq-soft)}
  .stat .n{font-size:26px;font-weight:700;color:var(--tq-dark)}
  .stat .l{font-size:12px;color:var(--g2)}
  .stat.alerta .n{color:var(--bad)}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filtros select,.filtros input{flex:1;min-width:130px;width:auto}
  .exp{background:var(--card);border:1px solid var(--g4);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .exp:hover{border-color:var(--tq)}
  .exp .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .exp .desc{font-weight:600;flex:1;min-width:180px}
  .exp .meta{font-size:12px;color:var(--g2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-bad{background:#F9E6E2;color:var(--bad)} .b-info{background:var(--tq-soft);color:var(--tq-dark)}
  .b-gris{background:var(--g4);color:var(--g2)} .b-ok{background:#E3F4EA;color:var(--ok)}
  .docs-tabla{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .docs-tabla th{text-align:left;color:var(--g2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--g4)}
  .docs-tabla td{padding:7px 8px;border-bottom:1px solid var(--g4);vertical-align:middle}
  .docs-tabla select{padding:5px 8px;font-size:13px;width:auto}
  .nota{border-left:3px solid var(--g4);padding:10px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 8px 8px 0}
  .nota.tipo-creacion{border-left-color:var(--tq)}
  .nota.tipo-estado{border-left-color:var(--warn)}
  .nota.tipo-version{border-left-color:var(--ok)}
  .nota .nts{font-size:11px;color:var(--g2);font-family:var(--mono)}
  .nota .ntx{margin:5px 0;white-space:pre-wrap}
  .nota .adj a{font-size:12px;margin-right:10px}
  .modal-bg{position:fixed;inset:0;background:rgba(30,40,46,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.modal-bg{align-items:center}}
  .modal{background:#fff;border-radius:16px 16px 0 0;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:20px}
  @media(min-width:640px){.modal{border-radius:16px}}
  #toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
  .toast{padding:11px 16px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--bad)} .toast.info{background:var(--g1)}
  #spinner{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
  .sp{width:38px;height:38px;border:4px solid var(--g4);border-top-color:var(--tq);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #spinnerTxt{font-weight:600;color:var(--g1)}
  .hidden{display:none!important}
  .login-wrap{max-width:400px;margin:8vh auto}
  .rolchip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--g4);color:var(--g2);text-transform:uppercase}
  .u-tabla{width:100%;border-collapse:collapse;font-size:13px}
  .u-tabla th{text-align:left;color:var(--g2);font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--g4)}
  .u-tabla td{padding:8px;border-bottom:1px solid var(--g4)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">VADOCA <b>DocTracker</b> <span class="muted" style="font-size:11px">v2</span></div>
    <nav id="mainNav" class="hidden">
      <button data-view="dashboard" class="active">Tablero</button>
      <button data-view="nuevo" id="navNuevo">+ Nuevo</button>
      <button data-view="poes">Procedimientos</button>
      <button data-view="usuarios" id="navUsuarios" class="hidden">Usuarios</button>
      <button data-view="config">Ajustes</button>
    </nav>
    <span id="userChip"></span>
  </div>
</header>
<main id="app"></main>
<div id="toasts"></div>
<div id="spinner" class="hidden"><div class="sp"></div><div id="spinnerTxt">Trabajando…</div></div>

<script>
'use strict';
/* ============================================================
   VADOCA DocTracker v2 — frontend contra backend Railway
   ============================================================ */
const LSKEY = 'vadoca_doctracker_v2_cfg';
const DEFAULTS = {
  backendUrl: 'https://vadoca-doctracker-backend-production.up.railway.app',
  clientes: [ ['000','VADOCA'], ['001','Novocap SA'], ['002','LKM'], ['003','Passair / Conéctalis'] ],
  tiposTrabajo: [
    { key:'GR',  nombre:'Gestión de Riesgo',                    linea:'VDC' },
    { key:'VTA', nombre:'Validación de Técnicas Analíticas',    linea:'VDC' },
    { key:'VPC', nombre:'Validación de Planillas',              linea:'VPC' },
    { key:'CAL', nombre:'Calificaciones',                       linea:'VDC' },
    { key:'VSI', nombre:'Validación de Sistemas Informáticos',  linea:'VSI' },
  ],
  tiposDoc: ['GR','AR','VTA','RU','DQ','IQ','OQ','PQ','IOQ','IV','PMV','PV'],
  estados: ['Borrador','En revisión','Validable','No validable','En ejecución','Enviado a cliente','Aprobado','Entregado','Suspendido','Cancelado'],
  estadosFinales: ['Entregado','Suspendido','Cancelado'],
  paqueteVPC: [ ['RU','P'],['DQ','P'],['IQ','P'],['IQ','I'],['OQ','P'],['OQ','I'],['PQ','P'],['PQ','I'],['IV','I'] ],
  diasEstancado: 7,
};
let CFG = loadCfg();
function loadCfg(){ try{ const s=JSON.parse(localStorage.getItem(LSKEY)||'{}'); const c=Object.assign({},DEFAULTS,s); c.paqueteVPC=DEFAULTS.paqueteVPC; return c;}catch(e){return {...DEFAULTS};} }
function saveCfg(){ localStorage.setItem(LSKEY, JSON.stringify(CFG)); }

let TOKEN = sessionStorage.getItem('vdt_token') || null;
let YO = JSON.parse(sessionStorage.getItem('vdt_yo') || 'null');
let REG = [];        // documentos desde el backend (snake_case)
let POES = [];       // procedimientos VADOCA
let POE = null;      // procedimiento abierto (codigo_base)
let VIEW = 'dashboard';
let FICHA = null;

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n,l) => String(n).padStart(l,'0');
function toast(msg,tipo='ok'){ const d=document.createElement('div'); d.className='toast '+tipo; d.textContent=msg; $('#toasts').appendChild(d); setTimeout(()=>d.remove(), tipo==='err'?6000:3500); }
function spin(on,txt){ $('#spinner').classList.toggle('hidden',!on); if(txt)$('#spinnerTxt').textContent=txt; }
function diasDesde(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function fFecha(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
const esLector = () => YO?.rol === 'lector';
const esAdmin  = () => YO?.rol === 'admin';

/* ---------- Llamadas al backend ---------- */
async function api(ruta, opt={}){
  opt.headers = Object.assign({}, opt.headers||{}, TOKEN?{Authorization:'Bearer '+TOKEN}:{});
  if(opt.body && !(opt.body instanceof FormData)){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(opt.body); }
  const r = await fetch(CFG.backendUrl + ruta, opt);
  let data = null; try{ data = await r.json(); }catch(e){}
  if(r.status===401 && ruta!=='/api/login'){ cerrarSesion(); throw new Error('Sesión vencida, entrá de nuevo'); }
  if(!r.ok) throw new Error(data?.error || ('Error '+r.status));
  return data;
}
async function cargarRegistro(){ REG = await api('/api/registro'); }
function cerrarSesion(){ TOKEN=null; YO=null; sessionStorage.clear(); render(); }

/* ============================================================
   VISTAS
   ============================================================ */
function render(){
  const app = $('#app');
  $('#mainNav').classList.toggle('hidden', !TOKEN);
  $('#navUsuarios').classList.toggle('hidden', !esAdmin());
  $('#navNuevo').classList.toggle('hidden', esLector());
  $('#userChip').innerHTML = YO ? `${esc(YO.email)} <span class="rolchip">${esc(YO.rol)}</span> <button class="ghost" onclick="cerrarSesion()" style="font-size:12px">Salir</button>` : '';
  if(!TOKEN){ app.innerHTML = vistaLogin(); return; }
  if(YO?.debe_cambiar_clave){ app.innerHTML = vistaCambiarClave(true); return; }
  if(VIEW==='dashboard') app.innerHTML = vistaDashboard();
  else if(VIEW==='nuevo') app.innerHTML = vistaNuevo();
  else if(VIEW==='poes') app.innerHTML = vistaPoes();
  else if(VIEW==='poeFicha') app.innerHTML = vistaPoeFicha();
  else if(VIEW==='usuarios') app.innerHTML = vistaUsuarios();
  else if(VIEW==='config') app.innerHTML = vistaConfig();
  else if(VIEW==='ficha') app.innerHTML = vistaFicha();
  postRender();
}

/* ----- Login y clave ----- */
function vistaLogin(){
  return `<div class="login-wrap"><div class="card">
    <h2>Ingresar</h2>
    <label>Email</label><input id="lEmail" type="email" placeholder="usuario@vadoca.com.ar" autocomplete="username">
    <label>Contraseña</label><input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresar()">
    <p style="margin-top:16px"><button onclick="ingresar()" style="width:100%">Entrar</button></p>
    <p class="muted" style="margin-top:10px">¿Sin cuenta o clave olvidada? Pedile al administrador que te dé de alta o te blanquee la clave.</p>
  </div></div>`;
}
window.ingresar = async function(){
  spin(true,'Ingresando…');
  try{
    const d = await api('/api/login',{method:'POST',body:{email:$('#lEmail').value,password:$('#lPass').value}});
    TOKEN=d.token; YO=d.usuario;
    sessionStorage.setItem('vdt_token',TOKEN); sessionStorage.setItem('vdt_yo',JSON.stringify(YO));
    if(!YO.debe_cambiar_clave){ spin(true,'Cargando registro…'); await cargarRegistro(); }
    spin(false); VIEW='dashboard'; render();
  }catch(e){ spin(false); toast(e.message,'err'); }
};
function vistaCambiarClave(obligatorio){
  return `<div class="login-wrap"><div class="card">
    <h2>${obligatorio?'Cambiá tu contraseña':'Cambiar contraseña'}</h2>
    ${obligatorio?'<p class="muted" style="margin-top:6px">Tu clave fue asignada por el administrador: elegí una propia para continuar.</p>':''}
    <label>Clave actual</label><input id="cAct" type="password" autocomplete="current-password">
    <label>Clave nueva (mínimo 8 caracteres)</label><input id="cNue" type="password" autocomplete="new-password">
    <p style="margin-top:16px"><button onclick="cambiarClave()" style="width:100%">Guardar</button></p>
  </div></div>`;
}
window.cambiarClave = async function(){
  spin(true,'Guardando…');
  try{
    await api('/api/cambiar-clave',{method:'POST',body:{actual:$('#cAct').value,nueva:$('#cNue').value}});
    YO.debe_cambiar_clave=false; sessionStorage.setItem('vdt_yo',JSON.stringify(YO));
    await cargarRegistro(); spin(false); toast('Clave actualizada'); VIEW='dashboard'; render();
  }catch(e){ spin(false); toast(e.message,'err'); }
};

/* ----- Dashboard ----- */
let FILTRO = {cliente:'',tt:'',estado:'',txt:'',caja:''};
window.filtrarCaja = function(c){ FILTRO.caja = (FILTRO.caja===c ? '' : c); render(); };
function expedientes(){
  const map = new Map();
  for(const r of REG){
    if(!map.has(r.expediente_id)) map.set(r.expediente_id, {id:r.expediente_id, docs:[], desc:r.descripcion, cliente:r.cliente_num, clienteN:r.cliente_nombre, tt:r.tipo_trabajo, carpeta:r.carpeta_drive_url, ult:r.ultimo_movimiento||'', interno:r.codigo_interno_cliente});
    const e = map.get(r.expediente_id); e.docs.push(r);
    if((r.ultimo_movimiento||'') > e.ult) e.ult = r.ultimo_movimiento;
  }
  return [...map.values()].sort((a,b)=> String(b.ult).localeCompare(String(a.ult)));
}
function esActivo(e){ return e.docs.some(d=>!CFG.estadosFinales.includes(d.estado)); }
function esEstancado(e){ return esActivo(e) && ((diasDesde(e.ult)??99) > CFG.diasEstancado); }
function esEntregado(e){ return e.docs.length && e.docs.every(d=>d.estado==='Entregado'); }
function estadoExp(e){
  const activos = e.docs.filter(d=>!CFG.estadosFinales.includes(d.estado));
  if(!activos.length) return {txt: e.docs.every(d=>d.estado==='Entregado')?'Entregado':'Cerrado', cls:'b-gris'};
  const est = [...new Set(activos.map(d=>d.estado))];
  return {txt: est.length===1?est[0]:'Mixto ('+activos.length+' activos)', cls:'b-info'};
}
function vistaDashboard(){
  const all = expedientes();
  const exps = all.filter(e=>{
    if(FILTRO.cliente && e.cliente!==FILTRO.cliente) return false;
    if(FILTRO.tt && !e.id.startsWith(FILTRO.tt+'-')) return false;
    if(FILTRO.estado && !e.docs.some(d=>d.estado===FILTRO.estado)) return false;
    if(FILTRO.txt){ const t=FILTRO.txt.toLowerCase(); if(!((e.id||'')+(e.desc||'')+(e.interno||'')).toLowerCase().includes(t)) return false; }
    if(FILTRO.caja==='activos' && !esActivo(e)) return false;
    if(FILTRO.caja==='estancados' && !esEstancado(e)) return false;
    if(FILTRO.caja==='entregados' && !esEntregado(e)) return false;
    return true;
  });
  const activos = all.filter(esActivo), estancados = all.filter(esEstancado), entregados = all.filter(esEntregado);
  return `
    ${REG.length===0 && esAdmin() ? `<div class="card" style="border-color:var(--warn)">
      <b>Base vacía.</b> Si venís de la versión anterior, importá tus datos una única vez:
      <button class="sec" onclick="migrar()" style="margin-left:8px">Migrar desde la hoja REGISTRO</button></div>`:''}
    <div class="stats">
      <div class="stat ${FILTRO.caja===''?'activa':''}" onclick="filtrarCaja('')"><div class="n">${all.length}</div><div class="l">Expedientes</div></div>
      <div class="stat ${FILTRO.caja==='activos'?'activa':''}" onclick="filtrarCaja('activos')"><div class="n">${activos.length}</div><div class="l">Activos</div></div>
      <div class="stat alerta ${FILTRO.caja==='estancados'?'activa':''}" onclick="filtrarCaja('estancados')"><div class="n">${estancados.length}</div><div class="l">Estancados +${CFG.diasEstancado}d</div></div>
      <div class="stat ${FILTRO.caja==='entregados'?'activa':''}" onclick="filtrarCaja('entregados')"><div class="n">${entregados.length}</div><div class="l">Entregados</div></div>
    </div>
    <div class="filtros">
      <select onchange="FILTRO.cliente=this.value;render()"><option value="">Todos los clientes</option>
        ${CFG.clientes.map(c=>`<option value="${c[0]}" ${FILTRO.cliente===c[0]?'selected':''}>${c[0]} · ${esc(c[1])}</option>`).join('')}</select>
      <select onchange="FILTRO.tt=this.value;render()"><option value="">Todos los tipos</option>
        ${CFG.tiposTrabajo.map(t=>`<option value="${t.key}" ${FILTRO.tt===t.key?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select>
      <select onchange="FILTRO.estado=this.value;render()"><option value="">Todos los estados</option>
        ${CFG.estados.map(s=>`<option ${FILTRO.estado===s?'selected':''}>${s}</option>`).join('')}</select>
      <input placeholder="Buscar…" value="${esc(FILTRO.txt)}" oninput="FILTRO.txt=this.value" onchange="render()">
    </div>
    ${exps.length? exps.map(e=>{
      const st = estadoExp(e), d = diasDesde(e.ult);
      const estancado = d!==null && d>CFG.diasEstancado && st.cls==='b-info';
      return `<div class="exp" onclick="abrirFicha('${esc(e.id)}')">
        <div class="top">
          <span class="codigo">${esc(e.id)}</span>
          <span class="desc">${esc(e.desc)}</span>
          <span class="badge ${st.cls}">${esc(st.txt)}</span>
          ${estancado?`<span class="badge b-bad">⚠ ${d} días sin movimiento</span>`:''}
        </div>
        <div class="meta">
          <span>${esc(e.clienteN)}</span><span>${esc(e.tt)}</span>
          ${e.interno?`<span>Cód. cliente: ${esc(e.interno)}</span>`:''}
          <span>${e.docs.length} doc${e.docs.length>1?'s':''}</span>
          <span>Últ. mov.: ${fFecha(e.ult)}</span>
        </div>
      </div>`;
    }).join('') : `<div class="card" style="text-align:center;color:var(--g2)">No hay expedientes${REG.length?' con esos filtros':''}.</div>`}`;
}
window.migrar = async function(){
  if(!confirm('Se importa todo lo que está hoy en la hoja REGISTRO a la base del sistema. Se hace UNA sola vez. ¿Continuar?')) return;
  spin(true,'Migrando desde Sheets…');
  try{
    const d = await api('/api/migrar',{method:'POST'});
    await cargarRegistro(); spin(false); toast('Migrados '+d.importados+' documentos'); render();
  }catch(e){ spin(false); toast(e.message,'err'); }
};

/* ----- Nuevo expediente ----- */
function vistaNuevo(){
  return `<div class="card">
    <h2>Nuevo expediente</h2>
    <div class="row">
      <div><label>Tipo de trabajo</label>
        <select id="nTT" onchange="onTTChange()">${CFG.tiposTrabajo.map(t=>`<option value="${t.key}">${esc(t.nombre)} (${t.linea})</option>`).join('')}</select></div>
      <div><label>Cliente</label>
        <select id="nCliente">${CFG.clientes.map(c=>`<option value="${c[0]}">${c[0]} · ${esc(c[1])}</option>`).join('')}</select></div>
    </div>
    <div id="nModoWrap"></div>
    <label>Descripción corta (va al nombre de la carpeta)</label>
    <input id="nDesc" maxlength="60" placeholder="Ej: XLS144 Valoración Absoluta por HPLC">
    <div class="row">
      <div><label>Código interno del cliente (opcional)</label><input id="nInterno" placeholder="Ej: XLS144-00"></div>

const POE_ESTADOS = ['Borrador','En revisión','Aprobado','Vigente','Obsoleto'];
let POE_RELS = [];
async function cargarPoes(){ [POES, POE_RELS] = await Promise.all([api('/api/procedimientos'), api('/api/poe-relaciones')]); }
function relacionadosDe(base){
  const s = new Set();
  for(const r of POE_RELS){ if(r.base===base) s.add(r.relacionado); if(r.relacionado===base) s.add(r.base); }
  return [...s].sort();
}
function tituloDe(base){ const p = POES.find(x=>x.codigo_base===base); return p?p.titulo:''; }
function poesBase(){
  const map = new Map();
  for(const p of POES){
    if(!map.has(p.codigo_base)) map.set(p.codigo_base, {base:p.codigo_base, titulo:p.titulo, versiones:[], carpeta:p.carpeta_drive_url, ult:p.ultimo_movimiento||''});
    const e = map.get(p.codigo_base); e.versiones.push(p);
    if((p.ultimo_movimiento||'') > e.ult) e.ult = p.ultimo_movimiento;
  }
  for(const e of map.values()){
    e.versiones.sort((a,b)=>parseInt(b.version,10)-parseInt(a.version,10));
    e.vigente = e.versiones.find(v=>v.estado==='Vigente') || null;
  }
  return [...map.values()].sort((a,b)=>a.base.localeCompare(b.base));
}
function diasAlVenc(p){ if(!p?.fecha_vencimiento) return null; return Math.ceil((new Date(p.fecha_vencimiento+'T00:00:00').getTime()-Date.now())/86400000); }
function vistaPoes(){
  cargarPoes().then(()=>{ if(VIEW==='poes') render(); });
  const bases = poesBase();
  const alertas = bases.map(b=>({b, d: diasAlVenc(b.vigente)})).filter(x=>x.d!==null && x.d<=30).sort((x,y)=>x.d-y.d);
  return `<div class="card" style="${alertas.length?'border-color:var(--warn)':''}">
    <h3>⏰ Vencimientos próximos (30 días)</h3>
    ${alertas.length? alertas.map(({b,d})=>`<div style="display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap">
        <span class="codigo">${esc(b.vigente.codigo)}</span>
        <span style="flex:1;min-width:160px">${esc(b.titulo)}</span>
        <span class="badge ${d<0?'b-bad':d<=7?'b-bad':'b-info'}">${d<0?('VENCIDO hace '+(-d)+' días'):('vence en '+d+' día'+(d===1?'':'s'))}</span>
        ${esLector()?'':`<button class="ghost" onclick="event.stopPropagation();nuevaVersionPoe('${esc(b.base)}')">Iniciar revisión</button>`}
      </div>`).join('')
    : '<p class="muted" style="margin-top:8px">Ningún procedimiento vence en los próximos 30 días ✔</p>'}
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="flex:1">Procedimientos VADOCA</h2>
      ${esLector()?'':`<button onclick="modalNuevoPoe()">+ Nuevo procedimiento</button>`}
      ${esAdmin()?`<button class="sec" onclick="modalImportarPoes()">Importación masiva</button>`:''}
    </div>
    ${bases.length? `<table class="docs-tabla" style="margin-top:12px"><thead><tr><th>Código</th><th>Título</th><th>Versión vigente</th><th>Vence</th><th>Versiones</th></tr></thead><tbody>
      ${bases.map(b=>{
        const d = diasAlVenc(b.vigente);
        return `<tr style="cursor:pointer" onclick="abrirPoe('${esc(b.base)}')">
          <td><span class="codigo">${esc(b.base)}</span></td>

          <td>${b.vigente?.fecha_vencimiento? esc(b.vigente.fecha_vencimiento)+(d!==null&&d<=30?` <span class="badge ${d<0||d<=7?'b-bad':'b-info'}">${d<0?'vencido':d+'d'}</span>`:'') :'—'}</td>
          <td class="muted">${b.versiones.length}</td>
        </tr>`;
      }).join('')}</tbody></table>`
    : '<p class="muted" style="margin-top:12px">Todavía no hay procedimientos. Creá el primero.</p>'}
  </div>`;
}

    <b>SECTOR | NÚMERO | VERSIÓN | TÍTULO | FECHA_VIGENCIA (AAAA-MM-DD) | VIGENCIA_MESES</b><br>
    Con fecha de vigencia entra como Vigente (vencimiento calculado); sin fecha, como Borrador. Te dejo precargados los 8 que ya conozco — completá el resto.</p>
    <textarea id="impPoes" style="min-height:220px;font-family:var(--mono);font-size:12px">${esc(POES_PRECARGA)}</textarea>
    <p style="margin-top:14px;display:flex;gap:10px"><button onclick="importarPoes()">Importar</button><button class="sec" onclick="cerrarModal()">Cancelar</button></p>`);
};
window.importarPoes = async function(){
  const filas = $('#impPoes').value.trim().split('\n').filter(Boolean).map(l=>{
    const p = l.split('|').map(s=>s.trim());
    return {sector:p[0], numero:p[1], version:p[2], titulo:p[3], fecha_vigencia:p[4]||'', vigencia_meses:p[5]||36};
  });
  if(!filas.length){ toast('No hay líneas','err'); return; }
  if(!confirm('Se van a importar '+filas.length+' POEs. Los que ya existan se saltean. ¿Continuar?')) return;
  cerrarModal(); spin(true,'Importando POEs…');
  try{
    const d = await api('/api/procedimientos/importar',{method:'POST',body:{filas}});
    await cargarPoes(); spin(false);
    toast(d.importados+' importados'+(d.saltados?', '+d.saltados+' ya existían':''));
    if(d.errores?.length){ toast(d.errores.length+' con error (ver consola F12)','err'); console.warn(d.errores); }
    render();
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.abrirPoe = async function(base){
  POE = { base, bit:[] }; VIEW='poeFicha'; render();
  try{ POE.bit = await api('/api/expedientes/'+encodeURIComponent(base)+'/bitacora'); pintarBitacoraPoe(); }
  catch(e){ $('#bitacoraPoe').innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
};
function pintarBitacoraPoe(){
  const el = $('#bitacoraPoe'); if(!el) return;
  el.innerHTML = POE.bit.map(n=>`<div class="nota tipo-${esc(n.tipo)}">
    <div class="nts">${fFecha(n.ts)} · ${esc(n.autor)} · ${esc(n.tipo)} <span class="hashchip">⛓ ${esc((n.hash||'').slice(0,10))}</span></div>
    <div class="ntx">${esc(n.texto)}</div>
    ${(n.adjuntos||[]).length?`<div class="adj">${n.adjuntos.map(a=>`<a href="https://drive.google.com/file/d/${esc(a.drive_id)}/view" target="_blank" rel="noopener" title="Original: ${esc(a.original||a.nombre)}">📎 ${esc(a.nombre)}</a>`).join('')}</div>`:''}
  </div>`).join('') || '<p class="muted">Sin entradas todavía.</p>';
}
function vistaPoeFicha(){
  const vs = POES.filter(p=>p.codigo_base===POE.base).sort((a,b)=>parseInt(b.version,10)-parseInt(a.version,10));
  if(!vs.length) return `<div class="card">Procedimiento no encontrado. <button class="ghost" onclick="VIEW='poes';render()">← Volver</button></div>`;
  const t = vs[0], ro = esLector();
  return `
  <p><button class="ghost" onclick="VIEW='poes';render()">← Volver a procedimientos</button></p>
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="codigo" style="font-size:15px">${esc(POE.base)}</span>
      <h2 style="flex:1;min-width:200px;font-size:17px">${esc(t.titulo)}</h2>
      ${t.carpeta_drive_url?`<a href="${esc(t.carpeta_drive_url)}" target="_blank" rel="noopener"><button class="sec">Abrir en Drive</button></a>`:''}
    </div>
    <table class="docs-tabla"><thead><tr><th>Código</th><th>Estado</th><th>Vigente desde</th><th>Vence</th><th>Autor</th></tr></thead><tbody>
      ${vs.map(p=>{
        const d = diasAlVenc(p);
        return `<tr>
        <td><span class="codigo">${esc(p.codigo)}</span></td>
        <td>${ro?esc(p.estado):`<select onchange="estadoPoe('${esc(p.codigo)}', this.value)">
          ${POE_ESTADOS.map(s=>`<option ${p.estado===s?'selected':''}>${s}</option>`).join('')}</select>`}
          ${p.estado==='Vigente'&&d!==null&&d<=30?` <span class="badge b-bad">${d<0?'vencido':'vence en '+d+'d'}</span>`:''}</td>
        <td>${esc(p.fecha_vigencia||'—')}</td><td>${esc(p.fecha_vencimiento||'—')}</td>
        <td class="muted" style="font-size:11px">${esc((p.autor||'').split('@')[0])}</td></tr>`;
      }).join('')}
    </tbody></table>
    <div style="margin-top:12px;font-size:13px">
      <span class="muted" style="font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px">Documentos relacionados:</span>
      ${relacionadosDe(POE.base).map(b=>`<span class="codigo" style="margin-left:6px;cursor:pointer" onclick="abrirPoe('${esc(b)}')" title="${esc(tituloDe(b))}">${esc(b)}</span>`).join('') || ' <span class="muted">ninguno</span>'}
      ${ro?'':` <button class="ghost" onclick="modalRelaciones()" style="font-size:12px">Editar</button>`}
    </div>
    ${ro?'':`<p class="muted" style="margin-top:8px">
      <button class="ghost" onclick="nuevaVersionPoe('${esc(POE.base)}')">⬆ Nueva versión</button>
      · <button class="ghost" onclick="verificarCadenaPoe()">⛓ Verificar integridad</button></p>`}
  </div>
  ${ro?'':`<div class="card">
    <h3>Agregar nota a la bitácora</h3>
    <textarea id="poeNotaTxt" placeholder="Revisión, aprobación, distribución, capacitación al equipo…"></textarea>
    <div class="row" style="margin-top:8px">
      <div><label>Adjuntar archivos (opcional)</label><input type="file" id="poeNotaFiles" multiple></div>
      <div><label>Guardar adjuntos en</label><select id="poeNotaSub">
        <option value="01_versiones">01_versiones (borradores y revisiones)</option>
        <option value="03_entregables">03_entregables (PDF firmado vigente)</option>
        <option value="02_evidencias">02_evidencias (capacitaciones, difusión)</option>
      </select></div>
    </div>
    <p style="margin-top:12px"><button onclick="guardarNotaPoe()">Guardar en bitácora</button></p>
  </div>`}
  <div class="card"><h3>Bitácora</h3><div id="bitacoraPoe" style="margin-top:10px"><p class="muted">Cargando…</p></div></div>`;
}
window.estadoPoe = async function(codigo, estado){
  if(estado==='Vigente' && !confirm('Al marcar Vigente se fija la fecha de vigencia y vencimiento, y cualquier otra versión vigente pasa a Obsoleto. ¿Continuar?')){ render(); return; }
  spin(true,'Actualizando…');
  try{
    await api('/api/procedimientos/'+encodeURIComponent(codigo)+'/estado',{method:'POST',body:{estado}});
    await cargarPoes(); POE.bit = await api('/api/expedientes/'+encodeURIComponent(POE.base)+'/bitacora');
    spin(false); toast('Estado actualizado'); render(); pintarBitacoraPoe();
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.modalRelaciones = function(){
  const actuales = new Set(relacionadosDe(POE.base));
  const otros = [...new Set(POES.map(p=>p.codigo_base))].filter(b=>b!==POE.base).sort();
  modal(`<h3>Documentos relacionados de ${esc(POE.base)}</h3>
    <p class="muted" style="margin:8px 0 12px">Marcá los POEs vinculados (se referencian mutuamente, o uno depende del otro). Al crear una nueva versión de cualquiera, el sistema te va a recordar evaluar el impacto sobre los relacionados.</p>
    <div style="max-height:45vh;overflow-y:auto">
    ${otros.length? otros.map(b=>`<label style="display:flex;align-items:center;gap:8px;margin:5px 0;font-weight:400">
      <input type="checkbox" class="relChk" value="${esc(b)}" ${actuales.has(b)?'checked':''} style="width:auto">
      <span class="codigo">${esc(b)}</span> <span class="muted" style="font-size:12px">${esc(tituloDe(b))}</span></label>`).join('')
    : '<p class="muted">No hay otros POEs cargados todavía.</p>'}
    </div>
    <p style="margin-top:14px;display:flex;gap:10px"><button onclick="guardarRelaciones()">Guardar</button><button class="sec" onclick="cerrarModal()">Cancelar</button></p>`);
};
window.guardarRelaciones = async function(){
  const rels = $$('.relChk:checked').map(el=>el.value);
  cerrarModal(); spin(true,'Guardando relaciones…');
  try{
    await api('/api/poe-relaciones/'+encodeURIComponent(POE.base),{method:'POST',body:{relacionados:rels}});
    await cargarPoes(); POE.bit = await api('/api/expedientes/'+encodeURIComponent(POE.base)+'/bitacora');
    spin(false); toast('Relaciones actualizadas'); render(); pintarBitacoraPoe();
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.nuevaVersionPoe = function(base){
  const rels = relacionadosDe(base);
  modal(`<h3>Nueva versión de ${esc(base)}</h3>
    ${rels.length?`<div class="card" style="background:#FBF0DA;border-color:var(--warn);margin:10px 0;padding:12px">
      <b style="font-size:13px">⚠ Evaluá el impacto sobre los documentos relacionados:</b>
      ${rels.map(b=>{
        const vs = POES.filter(p=>p.codigo_base===b); const vig = vs.find(v=>v.estado==='Vigente');
        return `<div style="margin:6px 0;font-size:13px"><span class="codigo">${esc(b)}</span> ${esc(tituloDe(b))} <span class="muted">— ${vig?('vigente v'+vig.version+(vig.fecha_vencimiento?', vence '+vig.fecha_vencimiento:'')):'sin versión vigente'}</span></div>`;
      }).join('')}
      <p class="muted" style="margin-top:8px;font-size:12px">No es obligatorio modificarlos, pero verificá si esta nueva versión los afecta. El aviso queda registrado en la bitácora.</p>
    </div>`:'<p class="muted" style="margin:10px 0">Este POE no tiene documentos relacionados cargados.</p>'}
    <label>Motivo de la nueva versión (va a la bitácora)</label>
    <textarea id="nvPoeMotivo" placeholder="Ej: adecuación a la nueva plantilla y actualización de referencias"></textarea>
    <p style="margin-top:14px;display:flex;gap:10px">
      <button onclick="crearNuevaVersionPoe('${esc(base)}')">Crear nueva versión</button>
      <button class="sec" onclick="cerrarModal()">Cancelar</button></p>`);
};
window.crearNuevaVersionPoe = async function(base){
  const motivo = $('#nvPoeMotivo').value.trim();
  cerrarModal(); spin(true,'Creando nueva versión…');
  try{
    const d = await api('/api/procedimientos/'+encodeURIComponent(base)+'/nueva-version',{method:'POST',body:{motivo}});
    await cargarPoes(); spin(false);
    toast(d.codigo+' creado en Borrador'+(d.impactados?.length?' · impacto registrado sobre '+d.impactados.length+' POE(s)':''));
    abrirPoe(base);
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.guardarNotaPoe = async function(){
  const txt = $('#poeNotaTxt').value.trim();
  const files = [...($('#poeNotaFiles').files||[])];
  if(!txt && !files.length){ toast('Escribí algo o adjuntá un archivo','err'); return; }
  const fd = new FormData();
  fd.append('texto', txt); fd.append('subcarpeta', $('#poeNotaSub').value);
  for(const f of files) fd.append('archivos', f, f.name);
  spin(true,'Guardando nota…');
  try{
    await api('/api/procedimientos/'+encodeURIComponent(POE.base)+'/notas',{method:'POST',body:fd});
    await cargarPoes(); POE.bit = await api('/api/expedientes/'+encodeURIComponent(POE.base)+'/bitacora');
    spin(false); toast('Nota guardada'); render(); pintarBitacoraPoe();
  }catch(e){ spin(false); toast(e.message,'err'); }
};
window.verificarCadenaPoe = async function(){
  spin(true,'Verificando cadena…');
  try{
    const d = await api('/api/expedientes/'+encodeURIComponent(POE.base)+'/verificar');
    spin(false);
    if(d.ok) modal(`<h3>⛓ Integridad verificada</h3><p style="margin:12px 0">Las ${d.entradas} entradas forman una cadena válida.</p><p><button onclick="cerrarModal()">Cerrar</button></p>`);
    else modal(`<h3 style="color:var(--bad)">⚠ Cadena rota</h3><p style="margin:12px 0">Falla en la entrada #${d.rota_en}: la bitácora fue alterada por fuera del sistema.</p><p><button onclick="cerrarModal()">Cerrar</button></p>`);
  }catch(e){ spin(false); toast(e.message,'err'); }
};

/* ----- Utilidades UI ----- */
function modal(html){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) cerrarModal(); });
  document.body.appendChild(bg); }
window.cerrarModal = ()=> $('#modalBg')?.remove();
function postRender(){
  $$('#mainNav button').forEach(b=>b.classList.toggle('active', b.dataset.view===VIEW || (VIEW==='ficha'&&b.dataset.view==='dashboard')));
  if(VIEW==='nuevo') onTTChange();
  if(VIEW==='ficha') document.addEventListener('paste', onPaste);
  else document.removeEventListener('paste', onPaste);
}
function onPaste(ev){
  const items = [...(ev.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));
  if(!items.length) return;
  for(const it of items){
    const f = it.getAsFile();
    const nombre = 'captura_'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';
    PEGADOS.push(new File([f], nombre, {type:f.type}));
  }
  $('#pegados').innerHTML = PEGADOS.map(f=>`<span class="muted" style="margin-right:10px">🖼 ${esc(f.name)}</span>`).join('');
  toast(items.length+' captura(s) lista(s) para adjuntar','info');
}
$$('#mainNav button').forEach(b=>b.addEventListener('click',()=>{ VIEW=b.dataset.view; render(); }));

  if(TOKEN){
    spin(true,'Cargando registro…');
    try{ await cargarRegistro(); }catch(e){ /* sesión vencida ya manejada */ }
    spin(false); render();
  }
})();
